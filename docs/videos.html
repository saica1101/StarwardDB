<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>動画リンク集 | 星の翼ガイド</title>
    <meta name="description" content="星の翼の公式PV、キャラ解説、対戦動画、練習用動画を整理するリンク集です。" />
        <link rel="icon" href="assets/brand/hp-icon-64.png" type="image/png" />
    <link rel="stylesheet" href="styles.css?v=20260613order1" />
  </head>
  <body>
    <header class="site-header" id="top">
      <a class="brand" href="index.html" aria-label="星の翼ガイド トップへ">
        <span class="brand-mark">S</span>
        <span>星の翼ガイド</span>
      </a>
      <nav class="nav" aria-label="主要ナビゲーション">
        <a href="index.html">基本</a>
        <a href="index.html#contributors">ご協力者様</a>
        <a href="characters.html">キャラ</a>
        <a href="videos.html" aria-current="page">動画</a>
        <a href="tools.html">ツール</a>
      </nav>
    </header>

    <main>
      <section class="page-hero compact">
        <div class="page-hero-inner">
          <p class="eyebrow">Video Library</p>
          <h1>動画リンク集</h1>
          <p>公式PV、キャラ解説、対戦動画、練習用の見返し動画をまとめるページです。リンクを増やすだけでカードとして使えます。</p>
        </div>
      </section>

      <section class="section tight">
        <div class="section-heading">
          <p class="eyebrow">My Video Library</p>
          <h2>キャラ別登録動画</h2>
        </div>
        <div class="video-library-shell" id="video-library">
          <aside class="video-character-panel" aria-label="キャラ選択">
            <div class="video-library-tools">
              <span class="video-admin-status video-admin-only" id="video-admin-status">閲覧モード</span>
              <button type="button" class="mini-button video-admin-only" id="video-admin-lock">管理を閉じる</button>
              <button type="button" class="mini-button video-admin-only" id="video-export">JSON出力</button>
              <label class="mini-button video-admin-only" for="video-import">JSON読込</label>
              <input id="video-import" type="file" accept="application/json,.json" hidden />
              <label class="video-toggle">
                <input id="video-hide-empty" type="checkbox" />
                動画ありのみ
              </label>
            </div>
            <div class="video-cost-tabs" id="video-cost-tabs"></div>
            <div class="video-character-list" id="video-character-list"></div>
          </aside>
          <section class="video-library-main" aria-live="polite">
            <div class="video-selected-head">
              <div>
                <p class="eyebrow video-admin-only">Selected Character</p>
                <h3 id="video-selected-name">-</h3>
              </div>
              <span class="tag" id="video-selected-cost">COST -</span>
            </div>
            <div class="registered-video-list" id="registered-video-list"></div>
            <form class="video-register-form" id="video-register-form">
              <label>
                投稿者
                <select id="video-channel"></select>
              </label>
              <label>
                表示名
                <input id="video-title" type="text" placeholder="例: ヒカリ 立ち回り解説" required />
              </label>
              <label>
                URL
                <input id="video-url" type="url" placeholder="https://..." required />
              </label>
              <label>
                メモ
                <textarea id="video-note" rows="3" placeholder="見るポイント、該当バージョン、対面など"></textarea>
              </label>
              <button type="submit" class="button primary">このキャラに登録</button>
              <button type="button" class="button ghost" id="video-edit-cancel" hidden>編集をやめる</button>
            </form>
          </section>
          <aside class="video-channel-panel" aria-label="チャンネル管理">
            <div class="section-heading compact-heading">
              <p class="eyebrow">Channels</p>
              <h3>投稿者管理</h3>
            </div>
            <form class="video-channel-form" id="video-channel-form">
              <label>
                チャンネル名
                <input id="channel-name" type="text" placeholder="例: 投稿者名 / チャンネル名" required />
              </label>
              <label>
                チャンネルURL
                <input id="channel-url" type="url" placeholder="https://www.youtube.com/@..." required />
              </label>
              <label>
                アイコンURL
                <input id="channel-icon" type="url" placeholder="未入力なら自動アイコン" />
              </label>
              <button type="submit" class="mini-button">チャンネル登録</button>
            </form>
            <div class="video-channel-row">
              <label>
                表示チャンネル
                <select id="channel-filter"></select>
              </label>
              <div class="video-channel-list" id="video-channel-list"></div>
            </div>
          </aside>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>動画リンクは公式・投稿者の公開ページへ遷移します。</p>
      <a href="#top">上へ戻る</a>
    </footer>
    <script src="script.js?v=20260613ordervideo1"></script>
    <script src="video-library.js?v=20260605adminsync1"></script>
  </body>
</html>
