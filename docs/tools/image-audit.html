<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>画像切れチェック | 星の翼ガイド</title>
  <style>
    :root {
      --bg: #06101b;
      --panel: rgba(8, 20, 32, .84);
      --line: rgba(104, 220, 255, .28);
      --text: #edf8ff;
      --muted: #a9c0cf;
      --cyan: #55e6ff;
      --bad: #ff6b78;
      --warn: #ffd65a;
      --ok: #91ffd2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Noto Sans JP", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 10%, rgba(85, 230, 255, .16), transparent 28rem),
        radial-gradient(circle at 86% 18%, rgba(145, 255, 210, .12), transparent 28rem),
        linear-gradient(135deg, #06101b, #02070d 72%);
    }
    main { width: min(1080px, calc(100% - 28px)); margin: 0 auto; padding: 26px 0 48px; }
    a { color: var(--cyan); }
    .top { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 18px; }
    .back {
      display: inline-flex; align-items: center; min-height: 40px; padding: 10px 13px;
      border: 1px solid var(--line); border-radius: 10px; color: var(--text); text-decoration: none;
      background: rgba(6,18,29,.78);
    }
    .hero, .panel {
      border: 1px solid var(--line); border-radius: 18px; background: var(--panel);
      box-shadow: 0 22px 70px rgba(0,0,0,.3); backdrop-filter: blur(14px);
    }
    .hero { padding: 28px; margin-bottom: 16px; }
    .eyebrow { margin: 0 0 8px; color: var(--cyan); font-size: 12px; font-weight: 900; letter-spacing: .12em; }
    h1 { margin: 0; font-size: clamp(34px, 7vw, 68px); line-height: 1; }
    .hero p { color: var(--muted); line-height: 1.8; }
    .summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat { padding: 16px; }
    .stat strong { display: block; font-size: 28px; color: var(--ok); }
    .stat span { color: var(--muted); font-size: 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 0; }
    button {
      min-height: 42px; border: 1px solid rgba(104,220,255,.34); border-radius: 12px;
      padding: 10px 14px; color: var(--text); background: rgba(9, 28, 42, .8); font-weight: 900;
      cursor: pointer;
    }
    button:hover { border-color: var(--cyan); }
    .results { padding: 18px; }
    .row {
      display: grid; grid-template-columns: 120px minmax(0, 1fr) 110px 90px;
      gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid rgba(104,220,255,.13);
    }
    .row:first-child { border-top: 0; }
    .badge { display: inline-flex; align-items: center; justify-content: center; min-height: 26px; padding: 4px 9px; border-radius: 999px; font-size: 12px; font-weight: 900; }
    .ok { background: rgba(145,255,210,.15); color: var(--ok); }
    .warn { background: rgba(255,214,90,.15); color: var(--warn); }
    .bad { background: rgba(255,107,120,.16); color: var(--bad); }
    .path { color: var(--muted); overflow-wrap: anywhere; font-size: 12px; }
    @media (max-width: 760px) {
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <a class="back" href="../tools.html">← ツール一覧</a>
      <span id="updated" class="path"></span>
    </div>
    <section class="hero">
      <p class="eyebrow">IMAGE AUDIT</p>
      <h1>画像切れチェック</h1>
      <p>All Star ルーレットのキャラ画像を読み込み確認します。壊れている画像と、重い画像の候補を見つけるための管理用ページです。</p>
      <div class="actions">
        <button type="button" onclick="runAudit()">再チェック</button>
        <a class="back" href="apps/allstar/index.html">All Starを開く</a>
      </div>
    </section>
    <section class="summary">
      <div class="panel stat"><strong id="total">0</strong><span>対象</span></div>
      <div class="panel stat"><strong id="ok">0</strong><span>正常</span></div>
      <div class="panel stat"><strong id="warn">0</strong><span>重め</span></div>
      <div class="panel stat"><strong id="bad">0</strong><span>画像切れ</span></div>
    </section>
    <section class="panel results" id="results">読み込み中...</section>
  </main>
  <script>
    const DATA_URL = "apps/allstar/allstar-characters.json";
    const IMAGE_BASE = "apps/shared/characters";
    const HEAVY_BYTES = 1500 * 1024;

    function imagePath(char) {
      return `${IMAGE_BASE}/${char.cost}/${encodeURIComponent(char.file)}.png`;
    }

    function formatBytes(bytes) {
      if (!Number.isFinite(bytes)) return "-";
      if (bytes > 1024 * 1024) return `${(bytes / 1024 / 1024).toFixed(1)}MB`;
      return `${Math.round(bytes / 1024)}KB`;
    }

    function checkImage(char) {
      const path = imagePath(char);
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = async () => {
          let bytes = 0;
          try {
            const response = await fetch(path, { method: "HEAD", cache: "no-store" });
            bytes = Number(response.headers.get("content-length") || 0);
          } catch {}
          resolve({ char, path, ok: true, bytes });
        };
        img.onerror = () => resolve({ char, path, ok: false, bytes: 0 });
        img.src = `${path}?v=${Date.now()}`;
      });
    }

    async function runAudit() {
      const results = document.getElementById("results");
      results.textContent = "チェック中...";
      const response = await fetch(`${DATA_URL}?v=${Date.now()}`);
      const chars = await response.json();
      const rows = await Promise.all(chars.map(checkImage));
      const bad = rows.filter((row) => !row.ok);
      const warn = rows.filter((row) => row.ok && row.bytes > HEAVY_BYTES);
      const ok = rows.filter((row) => row.ok && row.bytes <= HEAVY_BYTES);
      document.getElementById("total").textContent = rows.length;
      document.getElementById("ok").textContent = ok.length;
      document.getElementById("warn").textContent = warn.length;
      document.getElementById("bad").textContent = bad.length;
      const ordered = [...bad, ...warn, ...ok].slice(0, 200);
      results.innerHTML = ordered.map((row) => {
        const cls = !row.ok ? "bad" : row.bytes > HEAVY_BYTES ? "warn" : "ok";
        const text = !row.ok ? "画像切れ" : row.bytes > HEAVY_BYTES ? "重め" : "OK";
        return `
          <div class="row">
            <strong>${row.char.name}</strong>
            <span class="path">${row.path}</span>
            <span>${formatBytes(row.bytes)}</span>
            <span class="badge ${cls}">${text}</span>
          </div>
        `;
      }).join("") || "対象がありません。";
    }

    document.getElementById("updated").textContent = `ページ更新: ${new Date(document.lastModified).toLocaleString("ja-JP")}`;
    runAudit().catch((error) => {
      document.getElementById("results").textContent = error.message || String(error);
    });
  </script>
</body>
</html>
