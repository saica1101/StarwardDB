<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>キャラPick/Ban Board - UESAMA Edition</title>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --panel-bg: rgba(10, 16, 24, 0.94);
            --neon-blue: #00d2ff;
            --neon-red: #ff0055;
            --white-border: #ffffff;
            --gold: #ffcc00;
            --line: rgba(255,255,255,.16);
            --panel-line: rgba(0,210,255,.24);
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-dark);
            background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('back.png');
            background-attachment: fixed;
            background-position: center;
            background-size: cover;
            color: white;
            margin: 0;
            min-height: 100vh;
            padding: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 1540px; display: flex; flex-direction: column; gap: 16px; }
        @media (min-width: 1100px) { .container { flex-direction: row; align-items: flex-start; margin-top: 14px; gap: 18px; } }

        .board { flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
        @media (max-width: 900px) { .board { grid-template-columns: 1fr; } }
        .match-board {
            display: grid; gap: 12px; padding: 14px;
            border: 1px solid var(--panel-line); border-radius: 18px;
            background:
                linear-gradient(145deg, rgba(0,210,255,.10), rgba(255,255,255,.03) 34%, rgba(255,0,85,.08)),
                rgba(4,8,14,.78);
            box-shadow: 0 24px 80px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.08);
            backdrop-filter: blur(10px);
        }
        .match-title {
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
            min-height: 38px; padding: 0 12px;
            border: 1px solid rgba(255,204,0,.28); border-radius: 999px;
            color: var(--gold); background: rgba(0,0,0,.42);
            font-weight: 900; font-size: 15px; letter-spacing: .04em;
        }
        .match-title small { color: rgba(255,255,255,.68); font-size: 12px; letter-spacing: 0; }
        .player-section {
            background: rgba(0,0,0,0.46); padding: 12px; border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
        }
        .player-header {
            font-size: 13px; font-weight: 900; margin-bottom: 10px; padding: 6px 12px;
            border-left: 4px solid var(--neon-blue); border-radius: 8px;
            background: rgba(0,210,255,0.10); color: #dff8ff;
            display: inline-flex; align-items: center; min-height: 30px; letter-spacing: .04em;
        }
        .header-b { border-left-color: var(--neon-red); }

        .slot-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .slot {
            aspect-ratio: 1/1;
            background:
                radial-gradient(circle at 50% 42%, rgba(255,255,255,.08), transparent 56%),
                rgba(0,0,0,0.78);
            border: 1px solid rgba(255,255,255,.34); border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden; cursor: pointer;
            box-shadow: inset 0 0 18px rgba(0,0,0,.8);
            transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
        }
        .slot:hover { transform: translateY(-2px); border-color: rgba(0,210,255,.72); box-shadow: 0 0 18px rgba(0,210,255,.18), inset 0 0 18px rgba(0,0,0,.8); }
        .slot img { width: 100%; height: 100%; object-fit: contain; transition: filter .14s ease, transform .14s ease; }

        .slot.is-banned img { filter: brightness(0.2) grayscale(1); transform: scale(0.9); }
        .slot.is-banned::after {
            content: "×"; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -52%); color: var(--neon-red);
            font-size: clamp(42px, 5vw, 70px); font-weight: 900; text-shadow: 0 0 12px #000, 0 0 26px var(--neon-red); z-index: 10;
        }
        .slot.is-marked { border-color: var(--gold); box-shadow: 0 0 18px rgba(255,204,0,.45), inset 0 0 18px rgba(0,0,0,.8); }
        .slot.is-marked::before {
            content: "○"; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -52%); color: var(--gold);
            font-size: clamp(40px, 5vw, 68px); font-weight: 900; text-shadow: 0 0 12px #000, 0 0 24px var(--gold); z-index: 11;
        }
        .slot.is-banned.is-marked::before { opacity: .35; }

        .controls {
            width: 100%; max-width: 430px; background: var(--panel-bg); padding: 14px;
            border-radius: 18px; box-sizing: border-box; border: 1px solid var(--line); margin: 0 auto;
            box-shadow: 0 24px 70px rgba(0,0,0,.44), inset 0 1px 0 rgba(255,255,255,.08);
            backdrop-filter: blur(10px);
        }
        .mode-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .tab-btn {
            flex: 1; min-height: 44px; padding: 10px 8px; border: 1px solid rgba(255,255,255,.08);
            border-radius: 10px; background: #111923; color: #9aa6b2; font-weight: 900; font-size: 14px; cursor: pointer;
        }
        .tab-btn.active-pick { background: var(--neon-blue); color: #000; }
        .tab-btn.active-ban { background: var(--neon-red); color: #fff; }
        .tab-btn.active-mark { background: var(--gold); color: #000; }

        .cost-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
        .cost-btn { min-height: 36px; padding: 8px; font-size: 12px; background: #101820; border: 1px solid #314150; color: #fff; border-radius: 8px; cursor: pointer; font-weight: 800; }
        .cost-btn.active { background: #ffb300; border-color: #ffb300; color: #05070a; }
        
        #uesama-btn { 
            display: none; 
            grid-column: span 4; 
            background: linear-gradient(45deg, #ff4500, #ffcc00); 
            color: black; font-weight: bold; 
            margin-top: 5px; animation: uesama-flash 1.0s infinite alternate;
        }
        @keyframes uesama-flash { from { box-shadow: 0 0 5px #ff4500; } to { box-shadow: 0 0 20px var(--gold); } }

        .pool {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
            max-height: min(46vh, 390px); overflow-y: auto; background: rgba(0,0,0,.72); padding: 10px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,.08);
        }
        .pool img { width: 100%; aspect-ratio: 1/1; object-fit: contain; border-radius: 8px; border: 1px solid #29333d; background: rgba(255,255,255,.04); cursor: pointer; }
        .pool img.selected { border: 2px solid var(--neon-blue); box-shadow: 0 0 8px var(--neon-blue); }

        .sys-reset { margin-top: 12px; width: 100%; min-height: 42px; padding: 10px; background: #242b35; color: #fff; border-radius: 10px; font-weight: 900; border: 1px solid rgba(255,255,255,.12); font-size: 14px; cursor: pointer; }
        .status { font-size: 12px; color: #ffd35c; text-align: center; margin-top: 10px; font-weight: 900; min-height: 20px; }
    .guide-back-button{position:fixed;left:16px;bottom:16px;z-index:99999;display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:10px 14px;border:1px solid rgba(78,211,255,.55);border-radius:10px;background:rgba(8,17,24,.92);color:#eaf8ff;text-decoration:none;font-weight:800;font-size:13px;line-height:1;box-shadow:0 12px 30px rgba(0,0,0,.28);backdrop-filter:blur(10px)}.guide-back-button:hover{background:#143040;border-color:#62ddff;color:#fff}.guide-back-button:focus-visible{outline:3px solid rgba(78,211,255,.45);outline-offset:3px}@media(max-width:640px){.guide-back-button{left:10px;bottom:10px;min-height:38px;padding:9px 11px;font-size:12px}}</style>
</head>
<body><a class="guide-back-button" data-guide-back-button href="../../../index.html" aria-label="星の翼ガイドへ戻る">← 星の翼ガイド</a>

<div class="container">
    <div class="board">
        <div class="match-board" data-match="1">
            <div class="match-title"><span>TEAM 1</span><small>BAN ×2 / GOOD ○2</small></div>
            <div class="player-section">
                <div class="player-header" id="nameA1" onclick="editName('A1')">PLAYER A</div>
                <div class="slot-grid">
                    <div class="slot" id="s1" data-match="1" data-side="A1" onclick="tapSlot(this)"></div>
                    <div class="slot" id="s2" data-match="1" data-side="A1" onclick="tapSlot(this)"></div>
                    <div class="slot" id="s3" data-match="1" data-side="A1" onclick="tapSlot(this)"></div>
                    <div class="slot" id="s4" data-match="1" data-side="A1" onclick="tapSlot(this)"></div>
                </div>
            </div>
            <div class="player-section">
                <div class="player-header header-b" id="nameB1" onclick="editName('B1')">PLAYER B</div>
                <div class="slot-grid">
                    <div class="slot" id="s5" data-match="1" data-side="B1" onclick="tapSlot(this)"></div>
                    <div class="slot" id="s6" data-match="1" data-side="B1" onclick="tapSlot(this)"></div>
                    <div class="slot" id="s7" data-match="1" data-side="B1" onclick="tapSlot(this)"></div>
                    <div class="slot" id="s8" data-match="1" data-side="B1" onclick="tapSlot(this)"></div>
                </div>
            </div>
        </div>
        <div class="match-board" data-match="2">
            <div class="match-title"><span>TEAM 2</span><small>BAN ×2 / GOOD ○2</small></div>
            <div class="player-section">
                <div class="player-header" id="nameA2" onclick="editName('A2')">PLAYER A</div>
                <div class="slot-grid">
                    <div class="slot" id="s9" data-match="2" data-side="A2" onclick="tapSlot(this)"></div>
                    <div class="slot" id="s10" data-match="2" data-side="A2" onclick="tapSlot(this)"></div>
                    <div class="slot" id="s11" data-match="2" data-side="A2" onclick="tapSlot(this)"></div>
                    <div class="slot" id="s12" data-match="2" data-side="A2" onclick="tapSlot(this)"></div>
                </div>
            </div>
            <div class="player-section">
                <div class="player-header header-b" id="nameB2" onclick="editName('B2')">PLAYER B</div>
                <div class="slot-grid">
                    <div class="slot" id="s13" data-match="2" data-side="B2" onclick="tapSlot(this)"></div>
                    <div class="slot" id="s14" data-match="2" data-side="B2" onclick="tapSlot(this)"></div>
                    <div class="slot" id="s15" data-match="2" data-side="B2" onclick="tapSlot(this)"></div>
                    <div class="slot" id="s16" data-match="2" data-side="B2" onclick="tapSlot(this)"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="mode-tabs">
            <button id="mPick" class="tab-btn active-pick" onclick="setMode('pick')">PICK</button>
            <button id="mBan" class="tab-btn" onclick="setMode('ban')">BAN</button>
            <button id="mMark" class="tab-btn" onclick="setMode('mark')">○</button>
        </div>
        <div id="uiPick">
            <div class="cost-row">
                <button class="cost-btn active" onclick="loadPool('15', this)">C15</button>
                <button class="cost-btn" onclick="loadPool('20', this)">C20</button>
                <button class="cost-btn" onclick="loadPool('25', this)">C25</button>
                <button class="cost-btn" onclick="loadPool('30', this)">C30</button>
            </div>
            <div class="pool" id="poolGrid"></div>
        </div>
        <button class="sys-reset" onclick="resetAll()">SYSTEM RESET</button>
        <div class="status" id="hint">キャラを選択 → スロットをタップ</div>
    </div>
</div>

<script>
let mode = 'pick';
let selected = null;
let isMusicTriggered = false;

const data = {
    "15": ["Katerina.png", "Orchid.png", "Roland.png", "Snowowl.png", "Yammyn.png"],
    "20": ["fibi.png", "tatiana.png","Aida.png", "Beta.png", "Borzoi.png", "Breaker.png", "Darkstar.png", "Deucalion.png", "Emika.png", "Franca.png", "Hibiki.png", "ice.png", "Kitty.png", "kurisu.png", "kuro.png", "Pallas.png", "Qingni.png", "Scorpion.png", "Seraph.png", "suteko.png", "Virtues.png", "Zakharova.png"],
    "25": ["Aliz.png", "Angelis.png", "baze.png", "Cygnus.png", "doragu.png", "Ffreedo.png", "gouraikai.png", "haruka.png", "Ine.png", "Iva.png", "Kaze.png", "Lancelot.png", "Nora.png", "reki.png", "sanboruto.png", "Sharp.png", "sirogara-Photoroom.png", "Skysaber.png", "Valkia.png", "Xiaoling.png", "XVIII.png", "zyem.png", "DeadMaster.png", "BRS.png"],
    "30": ["akatuki.png","Akigumo.png", "Cammy.png", "Cavalry.png", "Cherub.png", "Convallaria.png", "Elfin.png", "Ether.png", "Griffin.png", "Hikari.png", "LonginusBeta.png", "Qiuyu.png", "Rasiel.png", "Rhine.png", "Rota.png", "Shadow.png", "Siren.png", "Mumei.png", "VoidSaber.png"],
    };

function setMode(m) {
    mode = m;
    document.getElementById('mPick').className = m==='pick'?'tab-btn active-pick':'tab-btn';
    document.getElementById('mBan').className = m==='ban'?'tab-btn active-ban':'tab-btn';
    document.getElementById('mMark').className = m==='mark'?'tab-btn active-mark':'tab-btn';
    selected = null;
    document.querySelectorAll('.pool img').forEach(i => i.classList.remove('selected'));
    document.getElementById('hint').innerText = m === 'pick'
        ? 'キャラを選択 → スロットをタップ'
        : m === 'ban'
            ? '×を付けるスロットをタップ（各TEAM 2つまで）'
            : '○を付けるスロットをタップ（各TEAM 2つまで）';
}

function loadPool(c, btn) {
    document.querySelectorAll('.cost-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const grid = document.getElementById('poolGrid');
    grid.innerHTML = '';
    data[c].forEach(f => {
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.src = `../shared/characters/${c}/${f}`;
        img.onclick = () => {
            if(mode!=='pick') return;
            document.querySelectorAll('.pool img').forEach(i => i.classList.remove('selected'));
            img.classList.add('selected');
            selected = { src: img.src, file: f };
        };
        grid.appendChild(img);
    });
}

function tapSlot(slot) {
    const hasImg = slot.querySelector('img');
    if(mode === 'pick') {
        if(selected) {
            const group = [...document.querySelectorAll(`.slot[data-side="${slot.dataset.side}"]`)];
            if(group.some(item => item.querySelector('img')?.dataset.file === selected.file)) {
                alert("重複配置はできません"); return;
            }
            slot.innerHTML = `<img src="${selected.src}" data-file="${selected.file}">`;
            slot.classList.remove('is-banned', 'is-marked');
            selected = null;
            document.querySelectorAll('.pool img').forEach(i => i.classList.remove('selected'));
            checkSecret();
        } else if(hasImg) {
            slot.innerHTML = '';
            slot.classList.remove('is-banned', 'is-marked');
            checkSecret();
        }
    } else if(mode === 'ban') {
        if(!hasImg) return;
        if(slot.classList.contains('is-banned')) {
            slot.classList.remove('is-banned');
        } else {
            if(slotsInMatch(slot).filter(item => item.classList.contains('is-banned')).length < 2) {
                slot.classList.add('is-banned');
                slot.classList.remove('is-marked');
            } else {
                alert("×は各TEAM 2つまでです");
            }
        }
    } else if(mode === 'mark') {
        if(!hasImg) return;
        if(slot.classList.contains('is-marked')) {
            slot.classList.remove('is-marked');
        } else {
            if(slotsInMatch(slot).filter(item => item.classList.contains('is-marked')).length < 2) {
                slot.classList.add('is-marked');
                slot.classList.remove('is-banned');
            } else {
                alert("○は各TEAM 2つまでです");
            }
        }
    }
}

function editName(p) {
    const el = document.getElementById('name'+p);
    const n = prompt("名前を入力:", el.innerText);
    if(n) el.innerText = n.toUpperCase();
}

function resetAll() {
    if(confirm("全消去しますか？")) {
        document.querySelectorAll('.slot').forEach(s => { s.innerHTML = ''; s.classList.remove('is-banned', 'is-marked'); });
        checkSecret();
    }
}

function slotsInMatch(slot) {
    return [...document.querySelectorAll(`.slot[data-match="${slot.dataset.match}"]`)];
}

function checkSecret() {
    // Reserved for the UESAMA hidden effect. Keep board actions safe when the effect is unused.
}

loadPool('15', document.querySelector('.cost-btn'));
</script>
</body>
</html>
