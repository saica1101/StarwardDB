<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STARWARD ROULETTE</title>
  <style>
    :root {
      --bg: #06101b;
      --panel: rgba(8, 20, 32, .82);
      --panel-strong: rgba(8, 20, 32, .94);
      --line: rgba(104, 220, 255, .28);
      --text: #edf8ff;
      --muted: #a9c0cf;
      --cyan: #55e6ff;
      --mint: #91ffd2;
      --gold: #ffd65a;
      --pink: #ff6fb1;
      --cost-30: #36a3ff;
      --cost-25: #ff4d69;
      --cost-20: #ffd43b;
      --cost-15: #44d17f;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Segoe UI", "Noto Sans JP", system-ui, sans-serif;
      background: linear-gradient(rgba(2, 8, 14, .76), rgba(2, 8, 14, .9)), url("bak.webp") center / cover;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: rgba(3, 12, 20, .18);
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }
    .shell { width: min(1180px, calc(100% - 28px)); margin: 0 auto; padding: 26px 0 46px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
    .back-link {
      display: inline-flex; align-items: center; gap: 8px; min-height: 40px;
      padding: 10px 13px; border: 1px solid var(--line); border-radius: 10px;
      color: var(--text); text-decoration: none; background: rgba(6, 18, 29, .74);
      box-shadow: 0 8px 20px rgba(0,0,0,.18);
    }
    .version-pill { color: var(--muted); font-size: 12px; letter-spacing: .08em; }
    .hero {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: end;
      padding: 28px; border: 1px solid var(--line); border-radius: 18px;
      background: linear-gradient(135deg, rgba(6, 18, 30, .9), rgba(12, 34, 48, .68));
      box-shadow: 0 12px 34px rgba(0,0,0,.24);
    }
    .eyebrow { margin: 0 0 8px; color: var(--cyan); font-weight: 900; letter-spacing: .12em; font-size: 12px; }
    h1 { margin: 0; font-size: clamp(38px, 8vw, 82px); line-height: .95; letter-spacing: 0; }
    .hero p { margin: 14px 0 0; color: #d5e6f2; line-height: 1.8; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .primary-action {
      min-height: 48px; border: 0; border-radius: 12px; padding: 12px 18px;
      color: #04111a; background: linear-gradient(135deg, var(--cyan), var(--mint));
      font-weight: 1000;
    }
    .quick-stats { display: grid; grid-template-columns: repeat(2, 110px); gap: 10px; }
    .stat {
      min-height: 72px; padding: 12px; border: 1px solid rgba(104,220,255,.22);
      border-radius: 12px; background: rgba(4, 13, 22, .62);
    }
    .stat strong { display: block; font-size: 24px; color: var(--mint); }
    .stat span { color: var(--muted); font-size: 12px; }
    .controls {
      margin-top: 18px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px;
      align-items: stretch;
    }
    .panel {
      border: 1px solid var(--line); border-radius: 16px; background: var(--panel);
      box-shadow: 0 10px 28px rgba(0,0,0,.22);
    }
    .settings { padding: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .segmented { display: inline-grid; grid-template-columns: repeat(2, minmax(120px, 1fr)); gap: 6px; padding: 5px; border: 1px solid rgba(104,220,255,.22); border-radius: 12px; background: rgba(2,8,14,.55); }
    .segmented label { min-height: 40px; display: grid; place-items: center; border-radius: 9px; color: var(--muted); font-weight: 800; }
    .segmented input { position: absolute; opacity: 0; }
    .segmented label:has(input:checked) { background: linear-gradient(135deg, var(--cyan), var(--mint)); color: #04111a; }
    .check { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; color: #dff5ff; font-weight: 800; }
    .button {
      min-height: 42px; border: 1px solid rgba(104,220,255,.34); border-radius: 12px;
      padding: 10px 14px; color: var(--text); background: rgba(9, 28, 42, .8); font-weight: 900;
    }
    .button:hover { border-color: var(--cyan); background: rgba(19, 58, 75, .9); }
    .draw-btn {
      min-width: 210px; min-height: 74px; border: 0; border-radius: 16px;
      color: #031018; background: linear-gradient(135deg, var(--cyan), var(--gold));
      font-size: 24px; font-weight: 1000;
    }
    .draw-btn.stop { background: linear-gradient(135deg, var(--pink), #7db5ff); color: #fff; }
    .main-grid { margin-top: 18px; display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 18px; align-items: start; }
    .result-wrap { padding: 18px; min-height: 462px; }
    .section-label { margin: 0 0 14px; color: var(--cyan); font-weight: 900; letter-spacing: .12em; font-size: 12px; }
    #result-area { display: grid; gap: 14px; justify-content: center; }
    #result-area.mode-1 { grid-template-columns: minmax(260px, 340px); }
    #result-area.mode-4 { grid-template-columns: repeat(2, minmax(220px, 300px)); }
    #result-area.mode-8 { grid-template-columns: repeat(4, minmax(170px, 1fr)); }
    .ready { min-height: 360px; display: grid; place-items: center; color: rgba(237,248,255,.35); font-size: 26px; font-weight: 1000; border: 1px dashed rgba(104,220,255,.22); border-radius: 16px; }
    .card {
      overflow: hidden; border-radius: 16px; color: var(--text);
      border: 1px solid rgba(104,220,255,.3); background: rgba(5, 13, 22, .82);
      box-shadow: 0 10px 28px rgba(0,0,0,.28);
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 12px 8px; }
    .cost-badge, .kakusei-badge { padding: 5px 10px; border-radius: 999px; font-size: 11px; font-weight: 1000; }
    .cost-30 { background: var(--cost-30); color: #fff; }
    .cost-25 { background: var(--cost-25); color: #fff; }
    .cost-20 { background: var(--cost-20); color: #06101b; }
    .cost-15 { background: var(--cost-15); color: #06101b; }
    .char-name { padding: 0 12px 12px; font-size: 20px; font-weight: 1000; }
    .image-container { height: 330px; display: grid; place-items: center; background: rgba(0,0,0,.46); }
    .image-container img { width: 100%; height: 100%; object-fit: contain; }
    .spin-placeholder {
      height: 220px; display: grid; place-items: center; margin-top: 8px;
      color: rgba(237,248,255,.38); font-weight: 1000; letter-spacing: .12em;
      background: rgba(0,0,0,.28);
    }
    .result-tools {
      display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: center;
    }
    .team-board {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px;
    }
    .team-box {
      min-height: 78px; padding: 12px; border: 1px solid rgba(104,220,255,.22);
      border-radius: 12px; background: rgba(2,8,14,.48);
    }
    .team-box strong { display: block; color: var(--cyan); margin-bottom: 6px; font-size: 12px; letter-spacing: .08em; }
    .team-box span { display: block; color: var(--text); font-weight: 900; line-height: 1.6; }
    .flash-win { animation: flash-win .38s ease-out 1; }
    @keyframes flash-win {
      0% { outline: 0 solid rgba(85,230,255,0); }
      35% { outline: 6px solid rgba(85,230,255,.42); }
      100% { outline: 0 solid rgba(85,230,255,0); }
    }
    .history-area { padding: 16px; position: sticky; top: 16px; }
    .history-title { color: var(--cyan); font-weight: 1000; margin-bottom: 12px; }
    .history-item { margin-bottom: 9px; padding: 11px; border-radius: 11px; background: rgba(2,8,14,.5); border-left: 4px solid rgba(255,255,255,.2); }
    .hist-30 { border-left-color: var(--cost-30); }
    .hist-25 { border-left-color: var(--cost-25); }
    .hist-20 { border-left-color: var(--cost-20); }
    .hist-15 { border-left-color: var(--cost-15); }
    .filter-panel { display: none; position: fixed; inset: 0; z-index: 1000; overflow: auto; padding: 18px; background: rgba(2,8,14,.96); }
    .filter-shell { width: min(1120px, 100%); margin: 0 auto; }
    .filter-top { position: sticky; top: 0; z-index: 10; padding: 14px; border-radius: 16px; background: #06121d; border: 1px solid var(--line); }
    .filter-actions { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; }
    .search-input {
      width: 100%; min-height: 44px; border-radius: 12px; border: 1px solid rgba(104,220,255,.28);
      background: rgba(2,8,14,.74); color: var(--text); padding: 0 13px;
    }
    .cost-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .cost-tabs button.active { background: linear-gradient(135deg, var(--cyan), var(--mint)); color: #04111a; }
    .cost-section { margin-top: 24px; }
    .cost-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(104,220,255,.18); }
    .cost-head h2 { margin: 0; font-size: 18px; color: var(--cyan); }
    .filter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; margin-top: 14px; }
    .char-select-card {
      min-height: 152px; display: grid; grid-template-rows: 100px auto; gap: 0;
      overflow: hidden; border-radius: 12px; background: rgba(8,20,32,.8);
      border: 1px solid rgba(104,220,255,.22); color: var(--text); padding: 0; text-align: center;
    }
    .char-select-card img { width: 100%; height: 100px; object-fit: contain; background: rgba(0,0,0,.26); display: block; }
    .char-select-card .name-tag { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 8px 4px 2px; font-size: 12px; font-weight: 900; }
    .char-select-card .state-tag { justify-self: center; margin-bottom: 7px; padding: 2px 8px; border-radius: 999px; background: rgba(145,255,210,.14); color: var(--mint); font-size: 10px; font-weight: 1000; }
    .char-select-card.disabled { opacity: .52; background: rgba(2,8,14,.72); }
    .char-select-card.disabled .state-tag { background: rgba(255,255,255,.08); color: var(--muted); }
    .meta-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 14px; color: var(--muted); font-size: 12px; }
    .issue-list { margin-top: 12px; color: #ffd3d3; font-size: 12px; line-height: 1.7; }
    .footer-note { margin-top: 18px; text-align: center; color: var(--muted); font-size: 12px; }

    @media (max-width: 860px) {
      .hero, .controls, .main-grid { grid-template-columns: 1fr; }
      .quick-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .draw-btn { width: 100%; }
      .history-area { position: static; }
      #result-area.mode-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #result-area.mode-8 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .filter-actions { grid-template-columns: 1fr; }
      .team-board { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <a class="back-link" href="../../../index.html">← 星の翼ガイド</a>
      <div class="version-pill" id="version-pill">loading...</div>
    </div>

    <section class="hero">
      <div>
        <p class="eyebrow">STARWARD DATABASE</p>
        <h1>Roulette</h1>
        <p>キャラ抽選、BAN PICK、覚醒込みの組み合わせ確認に使えるランダムツールです。</p>
        <div class="hero-actions">
          <button class="primary-action" type="button" onclick="openFilter()">抽選キャラを選ぶ</button>
        </div>
      </div>
      <div class="quick-stats">
        <div class="stat"><strong id="stat-total">0</strong><span>登録キャラ</span></div>
        <div class="stat"><strong id="stat-enabled">0</strong><span>抽選対象</span></div>
      </div>
    </section>

    <section class="controls">
      <div class="panel settings">
        <div class="segmented" aria-label="抽選モード">
          <label><input type="radio" name="play-mode" value="1" checked onchange="saveOptions()">CASUAL 1</label>
          <label><input type="radio" name="play-mode" value="4" onchange="saveOptions()">BAN PICK 4</label>
        </div>
        <label class="check"><input type="checkbox" id="kakusei-toggle" checked onchange="saveOptions(); updateDisplayAfterToggle();"> 覚醒表示</label>
        <label class="check"><input type="checkbox" id="exclude-toggle" checked onchange="saveOptions()"> 直近除外</label>
        <label class="check"><input type="checkbox" id="team-toggle" onchange="saveOptions(); updateDisplayAfterToggle();"> チーム分け</label>
        <label class="check"><input type="checkbox" id="fx-toggle" onchange="saveOptions()"> 演出/SE</label>
        <button class="button" type="button" onclick="openFilter()">抽選キャラを選ぶ</button>
      </div>
      <button id="main-btn" class="draw-btn" type="button" onclick="toggleRoulette()">START</button>
    </section>

    <section class="main-grid">
      <div class="panel result-wrap">
        <p class="section-label">CURRENT SELECTION</p>
        <div id="result-area" class="mode-1"><div class="ready">READY</div></div>
        <div class="result-tools">
          <button class="button" type="button" onclick="copyResult()">結果コピー</button>
          <span id="copy-status" class="footer-note"></span>
        </div>
        <div id="team-board" class="team-board hidden"></div>
        <div id="issue-list" class="issue-list"></div>
      </div>
      <aside class="panel history-area">
        <div class="history-title">PREVIOUS LOGS</div>
        <div id="history-list"><div style="opacity:.45;text-align:center;font-size:12px;">No History</div></div>
      </aside>
    </section>

    <div class="footer-note" id="page-meta"></div>
  </main>

  <div id="filter-panel" class="filter-panel">
    <div class="filter-shell">
      <div class="filter-top">
        <div class="filter-actions">
          <input id="filter-search" class="search-input" type="search" placeholder="キャラ名で検索" oninput="renderFilter()">
          <button class="button" type="button" onclick="toggleOnlyDisabled()">未選択のみ</button>
          <button class="button" type="button" onclick="closeFilter()">保存して閉じる</button>
        </div>
        <div class="cost-tabs" id="cost-tabs"></div>
      </div>
      <div id="filter-content"></div>
    </div>
  </div>

  <script>
    const DATA_URL = "allstar-characters.json";
    const COSTS = ["30", "25", "20", "15"];
    const kakuseiList = [
      { id: "B", name: "B覚醒", c: "#657080" },
      { id: "F", name: "F覚醒", c: "#e74c3c" },
      { id: "S", name: "S覚醒", c: "#3498db" },
      { id: "M", name: "M覚醒", c: "#f1c40f" },
      { id: "D", name: "D覚醒", c: "#2ecc71" },
      { id: "C", name: "C覚醒", c: "#3eaa11" }
    ];

    let allChars = [];
    let history = [];
    let rouletteTimer = null;
    let isRunning = false;
    let currentSelections = [];
    let activeCost = "30";
    let onlyDisabled = false;
    let filterRendered = false;
    let spinSlots = [];
    let recentCharacterIds = [];
    let audioContext = null;

    function imageSrc(char) {
      return `../shared/characters/${char.cost}/${encodeURIComponent(char.file)}.png`;
    }

    function thumbSrc(char) {
      return `../shared/character-thumbs/${char.cost}/${encodeURIComponent(char.file)}.webp`;
    }

    function charId(char) {
      return `${char.cost}-${char.file}`;
    }

    async function init() {
      restoreOptions();
      await loadCharacters();
      renderCostTabs();
      updateStats();
      document.getElementById("version-pill").textContent = `Updated ${new Date(document.lastModified).toLocaleString("ja-JP")}`;
      document.getElementById("page-meta").textContent = `ページ更新: ${new Date(document.lastModified).toLocaleString("ja-JP")} / データ: ${DATA_URL}`;
    }

    async function loadCharacters() {
      const savedChars = JSON.parse(localStorage.getItem("roulette_enabled_chars") || "{}");
      const response = await fetch(`${DATA_URL}?v=${Date.now()}`);
      if (!response.ok) throw new Error("キャラJSONを読み込めませんでした");
      const data = await response.json();
      allChars = data.map((char) => {
        const normalized = {
          cost: String(char.cost),
          file: char.file,
          name: char.name,
          id: `${char.cost}-${char.file}`
        };
        normalized.enabled = savedChars[normalized.id] !== undefined ? savedChars[normalized.id] : true;
        return normalized;
      });
    }

    function restoreOptions() {
      const options = JSON.parse(localStorage.getItem("roulette_options") || "null");
      try {
        recentCharacterIds = JSON.parse(localStorage.getItem("roulette_recent_ids") || "[]").filter(Boolean).slice(0, 8);
      } catch {
        recentCharacterIds = [];
      }
      if (!options) return;
      document.getElementById("kakusei-toggle").checked = options.kakusei !== false;
      document.getElementById("exclude-toggle").checked = options.excludeRecent !== false;
      document.getElementById("team-toggle").checked = options.teamMode === true;
      document.getElementById("fx-toggle").checked = options.fx === true;
      const mode = document.querySelector(`input[name="play-mode"][value="${options.mode || "1"}"]`);
      if (mode) mode.checked = true;
    }

    function renderCostTabs() {
      const wrap = document.getElementById("cost-tabs");
      wrap.innerHTML = COSTS.map((cost) => ({ label: `COST ${cost}`, value: cost }))
        .map((item) => `<button class="button ${activeCost === item.value ? "active" : ""}" type="button" onclick="setActiveCost('${item.value}')">${item.label}</button>`)
        .join("");
    }

    function setActiveCost(cost) {
      activeCost = cost;
      renderCostTabs();
      if (filterRendered) renderFilter();
    }

    function toggleOnlyDisabled() {
      onlyDisabled = !onlyDisabled;
      if (filterRendered) renderFilter();
    }

    function renderFilter() {
      const query = document.getElementById("filter-search")?.value.trim().toLowerCase() || "";
      const wrap = document.getElementById("filter-content");
      wrap.innerHTML = "";
      [activeCost].forEach((cost) => {
        const chars = allChars.filter((char) => {
          if (char.cost !== cost) return false;
          if (onlyDisabled && char.enabled) return false;
          if (!query) return true;
          return `${char.name} ${char.file}`.toLowerCase().includes(query);
        });
        if (!chars.length) return;
        const section = document.createElement("section");
        section.className = "cost-section";
        section.innerHTML = `
          <div class="cost-head">
            <h2>COST ${cost}</h2>
            <div>
              <button class="button" type="button" onclick="toggleCostGroup('${cost}', true)">ALL</button>
              <button class="button" type="button" onclick="toggleCostGroup('${cost}', false)">CLEAR</button>
            </div>
          </div>
          <div class="filter-grid"></div>
        `;
        const grid = section.querySelector(".filter-grid");
        chars.forEach((char) => grid.appendChild(createFilterCard(char)));
        wrap.appendChild(section);
      });
      updateStats();
    }

    function createFilterCard(char) {
      const card = document.createElement("button");
      card.type = "button";
      card.className = `char-select-card${char.enabled ? "" : " disabled"}`;
      card.id = `card-${char.id}`;
      card.onclick = () => {
        char.enabled = !char.enabled;
        card.classList.toggle("disabled", !char.enabled);
        const state = card.querySelector(".state-tag");
        if (state) state.textContent = char.enabled ? "ON" : "OFF";
        saveToStorage();
        updateStats();
      };
      card.innerHTML = `
        <img loading="lazy" decoding="async" src="${thumbSrc(char)}" alt="${char.name}">
        <span class="name-tag">${char.name}</span>
        <span class="state-tag">${char.enabled ? "ON" : "OFF"}</span>
      `;
      return card;
    }

    function updateStats() {
      document.getElementById("stat-total").textContent = allChars.length;
      document.getElementById("stat-enabled").textContent = allChars.filter((char) => char.enabled).length;
    }

    function toggleCostGroup(cost, status) {
      allChars.filter((char) => char.cost === cost).forEach((char) => {
        char.enabled = status;
      });
      saveToStorage();
      if (filterRendered) renderFilter();
    }

    function saveToStorage() {
      const charStatus = {};
      allChars.forEach((char) => { charStatus[char.id] = char.enabled; });
      localStorage.setItem("roulette_enabled_chars", JSON.stringify(charStatus));
    }

    function saveOptions() {
      const modeInput = document.querySelector("input[name='play-mode']:checked");
      localStorage.setItem("roulette_options", JSON.stringify({
        kakusei: document.getElementById("kakusei-toggle").checked,
        excludeRecent: document.getElementById("exclude-toggle").checked,
        teamMode: document.getElementById("team-toggle").checked,
        fx: document.getElementById("fx-toggle").checked,
        mode: modeInput ? modeInput.value : "1"
      }));
    }

    function openFilter() {
      document.getElementById("filter-panel").style.display = "block";
      filterRendered = true;
      renderFilter();
      document.getElementById("filter-search")?.focus();
    }

    function closeFilter() {
      document.getElementById("filter-panel").style.display = "none";
    }

    function toggleRoulette() {
      if (isRunning) {
        stopRoulette();
      } else {
        if (currentSelections.length > 0) {
          history = [...currentSelections];
          updateHistoryDisplay();
        }
        startRoulette();
      }
    }

    function startRoulette() {
      const candidates = allChars.filter((char) => char.enabled);
      const modeInput = document.querySelector("input[name='play-mode']:checked");
      const teamMode = document.getElementById("team-toggle").checked;
      const mode = teamMode ? 8 : (modeInput ? parseInt(modeInput.value, 10) : 1);
      if (candidates.length < mode) {
        alert(`キャラを${mode}体以上選択してください`);
        return;
      }
      document.getElementById("team-board").classList.add("hidden");
      document.getElementById("copy-status").textContent = "";
      isRunning = true;
      const button = document.getElementById("main-btn");
      button.textContent = "STOP";
      button.classList.add("stop");
      document.getElementById("result-area").className = mode === 8 ? "mode-8" : (mode === 4 ? "mode-4" : "mode-1");
      renderSpinShell(mode);
      currentSelections = pickSelections(applyRecentExclusion(candidates, mode), mode);
      updateSpinShell();
      rouletteTimer = setInterval(() => {
        currentSelections = pickSelections(applyRecentExclusion(candidates, mode), mode);
        updateSpinShell();
      }, 55);
    }

    function stopRoulette() {
      clearInterval(rouletteTimer);
      isRunning = false;
      const button = document.getElementById("main-btn");
      button.textContent = "START";
      button.classList.remove("stop");
      spinSlots = [];
      renderCards(true);
      renderTeamBoard();
      rememberRecentSelections();
      playFinishEffects();
    }

    function updateDisplayAfterToggle() {
      if (currentSelections.length > 0) renderCards();
      renderTeamBoard();
    }

    function renderCards(showImages = true) {
      const isKakuseiVisible = document.getElementById("kakusei-toggle").checked;
      document.getElementById("result-area").innerHTML = currentSelections.map((item) => `
        <article class="card">
          <div class="card-header">
            <span class="cost-badge cost-${item.char.cost}">COST ${item.char.cost}</span>
            <span class="kakusei-badge ${isKakuseiVisible ? "" : "hidden"}" style="background:${item.kakusei.c}">${item.kakusei.name}</span>
          </div>
          <div class="char-name">${item.char.name}</div>
          ${showImages
            ? `<div class="image-container"><img loading="eager" src="${imageSrc(item.char)}" alt="${item.char.name}"></div>`
            : `<div class="spin-placeholder">SPINNING</div>`}
        </article>
      `).join("");
    }

    function pickSelections(candidates, mode) {
      const result = [];
      const tempCandidates = [...candidates];
      for (let i = 0; i < mode; i += 1) {
        const idx = Math.floor(Math.random() * tempCandidates.length);
        result.push({
          char: tempCandidates.splice(idx, 1)[0],
          kakusei: kakuseiList[Math.floor(Math.random() * kakuseiList.length)]
        });
      }
      return result;
    }

    function applyRecentExclusion(candidates, mode) {
      if (!document.getElementById("exclude-toggle").checked || recentCharacterIds.length === 0) return candidates;
      const blocked = new Set(recentCharacterIds);
      const filtered = candidates.filter((char) => !blocked.has(char.id));
      return filtered.length >= mode ? filtered : candidates;
    }

    function rememberRecentSelections() {
      const ids = currentSelections.map((item) => item.char.id);
      recentCharacterIds = [...ids, ...recentCharacterIds.filter((id) => !ids.includes(id))].slice(0, 8);
      localStorage.setItem("roulette_recent_ids", JSON.stringify(recentCharacterIds));
    }

    function renderSpinShell(mode) {
      const area = document.getElementById("result-area");
      area.innerHTML = Array.from({ length: mode }, () => `
        <article class="card">
          <div class="card-header">
            <span class="cost-badge">COST</span>
            <span class="kakusei-badge">覚醒</span>
          </div>
          <div class="char-name">...</div>
          <div class="spin-placeholder">SPINNING</div>
        </article>
      `).join("");
      spinSlots = [...area.querySelectorAll(".card")].map((card) => ({
        cost: card.querySelector(".cost-badge"),
        kakusei: card.querySelector(".kakusei-badge"),
        name: card.querySelector(".char-name"),
      }));
    }

    function updateSpinShell() {
      const isKakuseiVisible = document.getElementById("kakusei-toggle").checked;
      currentSelections.forEach((item, index) => {
        const slot = spinSlots[index];
        if (!slot) return;
        slot.cost.className = `cost-badge cost-${item.char.cost}`;
        slot.cost.textContent = `COST ${item.char.cost}`;
        slot.kakusei.className = `kakusei-badge ${isKakuseiVisible ? "" : "hidden"}`;
        slot.kakusei.style.background = item.kakusei.c;
        slot.kakusei.textContent = item.kakusei.name;
        slot.name.textContent = item.char.name;
      });
    }

    function updateHistoryDisplay() {
      const list = document.getElementById("history-list");
      if (history.length === 0) {
        list.innerHTML = '<div style="opacity:.45;text-align:center;font-size:12px;">No History</div>';
        return;
      }
      list.innerHTML = history.map((item) => `
        <div class="history-item hist-${item.char.cost}">
          <strong>${item.char.name}</strong><br>
          <small>COST ${item.char.cost} / ${item.kakusei.name}</small>
        </div>
      `).join("");
    }

    function resultText() {
      if (document.getElementById("team-toggle").checked && currentSelections.length >= 8) {
        const one = currentSelections.slice(0, 4).map((item) => item.char.name).join(" / ");
        const two = currentSelections.slice(4, 8).map((item) => item.char.name).join(" / ");
        return `1P: ${one}\n2P: ${two}`;
      }
      return currentSelections.map((item) => {
        const kakusei = document.getElementById("kakusei-toggle").checked ? ` / ${item.kakusei.name}` : "";
        return `${item.char.name}（COST ${item.char.cost}${kakusei}）`;
      }).join(" / ");
    }

    async function copyResult() {
      if (!currentSelections.length) return;
      const text = resultText();
      try {
        await navigator.clipboard.writeText(text);
        document.getElementById("copy-status").textContent = "コピーしました";
      } catch {
        document.getElementById("copy-status").textContent = text;
      }
    }

    function renderTeamBoard() {
      const board = document.getElementById("team-board");
      if (!document.getElementById("team-toggle").checked || currentSelections.length < 8) {
        board.classList.add("hidden");
        return;
      }
      const playerOne = currentSelections.slice(0, 4).map((item) => item.char.name).join(" / ");
      const playerTwo = currentSelections.slice(4, 8).map((item) => item.char.name).join(" / ");
      board.innerHTML = `
        <div class="team-box"><strong>1P 4キャラ</strong><span>${playerOne}</span></div>
        <div class="team-box"><strong>2P 4キャラ</strong><span>${playerTwo}</span></div>
      `;
      board.classList.remove("hidden");
    }

    function playFinishEffects() {
      if (!document.getElementById("fx-toggle").checked) return;
      const area = document.getElementById("result-area");
      area.classList.remove("flash-win");
      void area.offsetWidth;
      area.classList.add("flash-win");
      playBeep();
    }

    function playBeep() {
      try {
        audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = "sine";
        osc.frequency.value = 740;
        gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.05, audioContext.currentTime + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.14);
        osc.connect(gain).connect(audioContext.destination);
        osc.start();
        osc.stop(audioContext.currentTime + 0.15);
      } catch {}
    }

    init().catch((error) => {
      document.getElementById("result-area").innerHTML = `<div class="ready">${error.message}</div>`;
    });
  </script>
</body>
</html>
