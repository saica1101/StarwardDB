1808","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/eee1e3ca2e4f2ec68a9a01ea88eeb101.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"上方修正\n1. 【左右＋サブ射撃】弾丸誘導性能: 30°/s→60°/s。","rawText":"1. 【左右+サブ射撃】 弾丸誘導性能: 308/s-601so\nヒカリ\n1. 【左右方向+サブ射撃】 移動性能とアニメーショ ン速度を最適化 弾丸発射タイミングを調整: 8Fっ4F_ 【メイン射撃】 で最短キャンセル可能な 日 ワロ\n8Fっ4F 【メイン射撃】 で最恐キャンセルロ能な 時間: 15F-5F。\n2盛装状態で 【サブ格闘】 発生時 10F以内に必ず ビットがキャラクターの元に戻るように修正。\n3.【後+メイン格闘】 武装を追加: 強いビーム照射 攻撃を発動 「盛装」 状態でこの武装がさらに強 化される。\n4. 【メイン射撃】 弾丸上下角度制限を追加: 上下gっ上下6Oe。","ocrMode":"manual-image-cleaned","id":"ocr-75d3215c0898","summary":"上方修正 / 1. 【左右＋サブ射撃】弾丸誘導性能: 30°/s→60°/s。"},{"date":"2025-08-06","title":"『星の翼』8月7日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1953","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/f76afd56ee5f0199755601f9540eb75a.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"コンテンツ調整\n1. 【左/右＋サブ射撃】の弾丸初期誘導性能が誤って増加されていた不具合を修正。","rawText":"前回の上方調整後 アンジェリスの弾丸発射直後 (初動5間) において 誘導性能が増幅される事 象を確認しておりました。 この度 調査 修正を 実施いたしました。\n1.【左+サブ射撃】 の弾丸初期誘導性能が課っ て増加されていた不具合を修正。","ocrMode":"manual-image-cleaned","id":"ocr-10b215ada1da","summary":"コンテンツ調整 / 1. 【左/右＋サブ射撃】の弾丸初期誘導性能が誤って増加されていた不具合を修正。"},{"date":"2025-09-17","title":"『星の翼』9月19日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2061","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/8618b26e8ea556c271282dc0e3877268.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"下方修正\n1. 聖槍展開中に【サブ射撃】を再入力時、目標を攻撃するまでの発生時間: 1F→6F→4F→9F。\n2. 神託降臨状態で【メイン格闘】弾丸の誘導性能: 40°/s→50°/s。","rawText":"アンジェリスは聖楯展開と非足止め持続照射武装 により 過度に強力な防衛能力を有している状態 が確認されておりました。 このたび ビット攻撃\nが確認されておりました。 このたび ビット攻撃 の発生をわずかに遅延させ この武装の予測と判 断の重要性を高める調整を実施いたします。\nこれに伴う補債指畳としまして 強化状態におけ る 【メイン格闘】 の弾丸性能を上方調整いたしま した。\n1.聖橋展開中に 【サブ射撃】 を再入力時 目標を 攻撃するまでの発生時間: 1F~6F一4F~9F。\n2.神託降臨状態で 【メイン格闘】 弾丸の誘導性 能: 40/s-50/s。","ocrMode":"manual-image-cleaned","id":"ocr-d9f918f5b745","summary":"下方修正 / 1. 聖槍展開中に【サブ射撃】を再入力時、目標を攻撃するまでの発生時間: 1F→6F→4F→9F。 / 2. 神託降臨状態で【メイン格闘】弾丸の誘導性能: 40°/s→50°/s。"},{"date":"2025-10-29","title":"『星の翼』10月30日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2156","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/9df899b8acb17e0d4b499c0948f0c80f.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"アンジェリスの【メイン射撃】に搭載されていた特殊メカニズムは、操作に慣れていないプレイヤーにとって適応が必要であり、また一部の特殊な状態下で【メイン射撃】が正常に発動しないケースがありました。これらを踏まえ、今回この特殊メカニズムを削除することにしました。\n\n1.【メイン射撃】武装発動中の再入力による背面メイン射撃が発生するテクニックを削除。\n2.1発目の射撃で背面射撃が既に発動している状態において、2発目のメイン射撃を行うと背面状態が解除され、強制的に落下する不具合を修正。","rawText":"アンジェリスの【メイン射撃】に搭載されていた特殊メカニズムは、操作に慣れていないプレイヤーにとって適応が必要であり、また一部の特殊な状態下で【メイン射撃】が正常に発動しないケースがありました。これらを踏まえ、今回この特殊メカニズムを削除することにしました。\n\n1.【メイン射撃】武装発動中の再入力による背面メイン射撃が発生するテクニックを削除。\n2.1発目の射撃で背面射撃が既に発動している状態において、2発目のメイン射撃を行うと背面状態が解除され、強制的に落下する不具合を修正。","ocrMode":"manual-image-cleaned","id":"ocr-bb08e1dd1262"},{"date":"2026-05-27","title":"『星の翼』5月28日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2570","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/6c78cd97e02964e987e790a2156026ec.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"今回の調整では、アンジェリスの非足止め照射武装の銃口補正に対し、下方修正を行いました。\nこれによる性能への影響を考慮し、中・遠距離からでも対戦相手に対してプレッシャーを与えられる手段を新たに追加いたしました。彼女の本来の強みである、中・遠距離戦における立ち回りをより活かしやすくなるよう、全体のバランスを図りました。\n\n1.【サブ射撃+メイン射撃】の銃口照準性能: 照準フレーム 11F→10F。ビーム弾の直径: 0.3m→0.5m。\n2.【後+サブ射撃】: 目標の上から十字架弾丸を生成する効果に変更。ダメージを低下。\n3.新規武装【前+サブ射撃】を追加: 光の槍を召喚・操って自動で目標を攻撃させる。\n4.【メイン射撃】の弾丸が中・遠距離での誘導性能を向上。","rawText":"今回の調整では、アンジェリスの非足止め照射武装の銃口補正に対し、下方修正を行いました。\nこれによる性能への影響を考慮し、中・遠距離からでも対戦相手に対してプレッシャーを与えられる手段を新たに追加いたしました。彼女の本来の強みである、中・遠距離戦における立ち回りをより活かしやすくなるよう、全体のバランスを図りました。\n\n1.【サブ射撃+メイン射撃】の銃口照準性能: 照準フレーム 11F→10F。ビーム弾の直径: 0.3m→0.5m。\n2.【後+サブ射撃】: 目標の上から十字架弾丸を生成する効果に変更。ダメージを低下。\n3.新規武装【前+サブ射撃】を追加: 光の槍を召喚・操って自動で目標を攻撃させる。\n4.【メイン射撃】の弾丸が中・遠距離での誘導性能を向上。","ocrMode":"manual-image-cleaned","id":"ocr-15d45a5c5914"}],"cost":"2.5","icon":"assets/character-icons-api/ 格闘」 上下照準角度の制限を追加","ocrMode":"manual-image-cleaned","id":"ocr-beb3df62c1eb","summary":"下方修正 / 1. 【サブ格闘】上下照準角度の制限を追加。"},{"date":"2025-12-24","title":"『星の翼』12月25日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2285","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/67e20c9d79e86f69572c319fc3b601d8.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"ヴァルキア従来の武装【強制暴走】の発動条件が厳しく、通常状態の武装だけでは十分な強さを発揮しにくく、対戦での安定性に欠けることが確認されました。\n\nそこで、今回ヴァルキアを全面的にリワークし、ハイリスク・ハイリターンの戦闘スタイルは維持した上で、強制暴走に依存せずとも比較的安定した立ち回りが可能になるよう調整を行いました。具体的には、一部武装ルートの調整やメインメカニズムの発動条件・効果の再設計を実施しました。\n\nこれにより、タイミングの見極めとリソースの管理を通じて、ヴァルキアが攻撃タイプのキャラクターとしての役割をより発揮でき、有利な局面で相手の逆転を封じることを目的としています。\n\n1.【サブ射撃】の最終段をブラックシャーク型子機が目標に突進して噛みつきに変更。弾数: 2→1、リロード時間: 10s→6s。【横方向+サブ射撃】武装を削除。\n2.【前+メイン格闘】のモーションを目標への飛び掛かり斬撃に変更。\n3.【メイン格闘派生サブ射撃】を強化し、モーション速度を加速。\n4.【サブ格闘】を調整: 1段目に拾い効果を追加、その場で準備期間中にスーパーアーマーを付与。その場で準備時間: 10F→15F、最大追撃時間: 19F→22F、移動速度: 20m/s→22m/s。目標命中後自身の方向転換が発生する不具合を修正。\n5.【サブ格闘派生メイン格闘】を強化し、連打中に継続的加速効果が発生するようになる。\n6.通常状態で【左/右/前+サブ格闘】を追加。目標へ素早く突進することができる。\n7.【サブ格闘派生メイン射撃】を調整: 【左/右/前+サブ格闘派生メイン射撃】に変更し、【メイン射撃副弾薬】を消費。慣性速度を向上、幅: 0.25m→0.5m、延伸速度: 40m/s→60m/s、最大存続時間: 45F→10F。ダメージ: 240→180、ダウン値: 40→20、ダメージ補正率: 25%→15%。\n8.【サブ格闘派生サブ射撃】を調整: 【左/右/前+サブ格闘派生サブ射撃】に変更し、【サブ射撃主弾薬】を消費。武装効果を変更: 目標の両側にブラックシャーク型子機を投擲し、命中時に目標を連続で噛み付き攻撃する。\n9.元の【後+サブ格闘】を調整: 回避不可・キャンセル不可効果を削除し、バースト期間中および強制暴走状態中の使用が可能となる。【サブ格闘】命中時の弾薬回復仕様を削除（時間回復も不可）し、発生時間: 20F→22F。\n10.【強制暴走】はロックオン目標を制限せず、かつ大半の武装発動中に全フレームスーパーアーマーを提供しなくなる。現在の効果は基礎機動力および一部武装性能を向上し、発動期間中は自身のHPが持続的に減少し、格闘攻撃によるHP吸収効果を獲得。\n11.暴走モード中、元の【左/右+サブ格闘】を【左/右/前+サブ格闘】派生【左/右+サブ格闘】へ移行・調整。\n12.元の【後+バーストアタック】を【強制暴走】および【戦傷】期間中の【サブ格闘】派生【後+メイン射撃】に移行。フィニッシュ機制を保留し、【強制暴走】期間中は無制限使用可能。フィニッシュ成功時は暴走時間リセット・バースト値・HP回復効果を追加で獲得。【サブ格闘】発動中に対象がフィニッシュ条件を満たすと、マークを付与。フィニッシュHP閾値: 40%→20%。\n13.【戦傷】状態での復活時基礎HP値: 350→600。復活後は一時的に90%ダメージ補正率を獲得。状態持続中は自身のHPが持続的に減少し、格闘攻撃でHP吸収効果を獲得。\n14.元の【戦傷】状態下における【メイン射撃】を【サブ射撃】に移行・調整。\n15.元の【戦傷】状態下における【サブ射撃】を【メイン射撃】に移行・調整。\n16.【戦傷】状態では、直接通常状態の【サブ格闘】を使用するよう変更し、この状態下での【左/右/前+サブ格闘派生サブ格闘】武装を削除。\n17.【戦傷】状態下における【バーストアタック】を、通常状態の【バーストアタック】と仕様統一。\n18.天賦IIIの効果を変更: 【強制暴走】および【戦傷】状態期間中の持続HP減少速度を軽減。","rawText":"ヴァルキア従来の武装【強制暴走】の発動条件が厳しく、通常状態の武装だけでは十分な強さを発揮しにくく、対戦での安定性に欠けることが確認されました。\n\nそこで、今回ヴァルキアを全面的にリワークし、ハイリスク・ハイリターンの戦闘スタイルは維持した上で、強制暴走に依存せずとも比較的安定した立ち回りが可能になるよう調整を行いました。具体的には、一部武装ルートの調整やメインメカニズムの発動条件・効果の再設計を実施しました。\n\nこれにより、タイミングの見極めとリソースの管理を通じて、ヴァルキアが攻撃タイプのキャラクターとしての役割をより発揮でき、有利な局面で相手の逆転を封じることを目的としています。\n\n1.【サブ射撃】の最終段をブラックシャーク型子機が目標に突進して噛みつきに変更。弾数: 2→1、リロード時間: 10s→6s。【横方向+サブ射撃】武装を削除。\n2.【前+メイン格闘】のモーションを目標への飛び掛かり斬撃に変更。\n3.【メイン格闘派生サブ射撃】を強化し、モーション速度を加速。\n4.【サブ格闘】を調整: 1段目に拾い効果を追加、その場で準備期間中にスーパーアーマーを付与。その場で準備時間: 10F→15F、最大追撃時間: 19F→22F、移動速度: 20m/s→22m/s。目標命中後自身の方向転換が発生する不具合を修正。\n5.【サブ格闘派生メイン格闘】を強化し、連打中に継続的加速効果が発生するようになる。\n6.通常状態で【左/右/前+サブ格闘】を追加。目標へ素早く突進することができる。\n7.【サブ格闘派生メイン射撃】を調整: 【左/右/前+サブ格闘派生メイン射撃】に変更し、【メイン射撃副弾薬】を消費。慣性速度を向上、幅: 0.25m→0.5m、延伸速度: 40m/s→60m/s、最大存続時間: 45F→10F。ダメージ: 240→180、ダウン値: 40→20、ダメージ補正率: 25%→15%。\n8.【サブ格闘派生サブ射撃】を調整: 【左/右/前+サブ格闘派生サブ射撃】に変更し、【サブ射撃主弾薬】を消費。武装効果を変更: 目標の両側にブラックシャーク型子機を投擲し、命中時に目標を連続で噛み付き攻撃する。\n9.元の【後+サブ格闘】を調整: 回避不可・キャンセル不可効果を削除し、バースト期間中および強制暴走状態中の使用が可能となる。【サブ格闘】命中時の弾薬回復仕様を削除（時間回復も不可）し、発生時間: 20F→22F。\n10.【強制暴走】はロックオン目標を制限せず、かつ大半の武装発動中に全フレームスーパーアーマーを提供しなくなる。現在の効果は基礎機動力および一部武装性能を向上し、発動期間中は自身のHPが持続的に減少し、格闘攻撃によるHP吸収効果を獲得。\n11.暴走モード中、元の【左/右+サブ格闘】を【左/右/前+サブ格闘】派生【左/右+サブ格闘】へ移行・調整。\n12.元の【後+バーストアタック】を【強制暴走】および【戦傷】期間中の【サブ格闘】派生【後+メイン射撃】に移行。フィニッシュ機制を保留し、【強制暴走】期間中は無制限使用可能。フィニッシュ成功時は暴走時間リセット・バースト値・HP回復効果を追加で獲得。【サブ格闘】発動中に対象がフィニッシュ条件を満たすと、マークを付与。フィニッシュHP閾値: 40%→20%。\n13.【戦傷】状態での復活時基礎HP値: 350→600。復活後は一時的に90%ダメージ補正率を獲得。状態持続中は自身のHPが持続的に減少し、格闘攻撃でHP吸収効果を獲得。\n14.元の【戦傷】状態下における【メイン射撃】を【サブ射撃】に移行・調整。\n15.元の【戦傷】状態下における【サブ射撃】を【メイン射撃】に移行・調整。\n16.【戦傷】状態では、直接通常状態の【サブ格闘】を使用するよう変更し、この状態下での【左/右/前+サブ格闘派生サブ格闘】武装を削除。\n17.【戦傷】状態下における【バーストアタック】を、通常状態の【バーストアタック】と仕様統一。\n18.天賦IIIの効果を変更: 【強制暴走】および【戦傷】状態期間中の持続HP減少速度を軽減。","ocrMode":"manual-image-cleaned","id":"ocr-fa68a16554b4"},{"date":"2026-01-14","title":"『星の翼』1月15日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2332","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/0cc0d21f14c7da9c101732a00f80c8f2.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"下方修正\n1. 【戦傷】【強制暴走】状態中、ダウン時にもHPが継続して減少するよう調整。あわせて、格闘によるHP吸収率: 35%→40%。\n2. 【左/右/前＋サブ格闘】をオーバーヒート状態で使用しても、ダッシュ時間が短縮されないよう調整。オーバーヒート時のダッシュ速度: 17.5m/s→12m/s。\n3. 【後＋サブ格闘】のダッシュ中はキャンセル不可となるよう調整。\n4. ファイティングバースト中、【左/右/前＋サブ格闘派生左/右＋サブ格闘】発動時に、速度とモーション加速効果が異常に重複し、突進速度が過度に上昇する不具合を修正。","rawText":"対戦中 ヴァルキアは強力なパッシブ能力の復活 と効率的なH回復により、 激しい撃ち合いや終盤 戦で高い持続力を発揮し、 ミス許容度が高く対応 が難しい状態を生み出していました。 また 一部 の移動武装はリソースが尽きた状態でも週剥な脱 出性能を持ち リスクとリターンのバランスが適 切ではありませんでした。\n今回の調整では: ヴァルキアの狂暴な攻撃や逆境 からの反撃といった特徴を維持しつつ 相手が戦 紀や突進への対応を取りやすくなることを目指し ています。\n1. 戦傷】 【強制暴走】 状態中 ダウン時にもHP が継続して滅少するよう調整 あわせて 格闘に よるH吸収率: 35% っ 40%。\n2.【左右ノ前+サブ格闘】 をオーバーヒート状態 で使用しても ダッシュ時間が短縮されないよう 調整。\nオーバーヒート時のダッシュ速度: 17.5m/s一 12m/s\n3.【後+サブ格闘】 のダッシュ中はキャンセル不 可となるよう調整\n4.ファイティングバースト中 【左ノに前+サブ 格闘派生左右+サブ格闘】 発動時に 速度とモー ション加速効果が異常に重複し、 突進速度が過度 に上昇する不具合を修正。","ocrMode":"manual-image-cleaned","id":"ocr-0808ebfff36e","summary":"下方修正 / 1. 【戦傷】【強制暴走】状態中、ダウン時にもHPが継続して減少するよう調整。あわせて、格闘によるHP吸収率: 35%→40%。 / 2. 【左/右/前＋サブ格闘】をオーバーヒート状態で使用しても、ダッシュ時間が短縮されないよう調整。オーバーヒート時のダッシュ速度: 17.5m/s→12m/s。"},{"date":"2026-03-04","title":"『星の翼』3月5日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2395","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/19c8969ca953f0e0904965a042133035.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"下方修正\n1. 【サブ射撃】リロード時間: 6s→7s。\n2. 【左/右/前＋サブ格闘派生メイン射撃】リロード時間: 6s→7s。","rawText":"ヴァルキアは高類度の制圧射撃により; 武装の回 転率が想定を上回る状態となっております。 その ため ゲームバランスを考慮し、 リロード時間を 若干延長する調整を行いました。\n1. 【サブ射撃】 リロード時間: 6s-7s。\n2.【左前+サブ格闘派生メイン射撃】 リロード 時間: 6s-7s。","ocrMode":"manual-image-cleaned","id":"ocr-66cf564d59dc","summary":"下方修正 / 1. 【サブ射撃】リロード時間: 6s→7s。 / 2. 【左/右/前＋サブ格闘派生メイン射撃】リロード時間: 6s→7s。"}],"cost":"2.5","icon":"assets/character-icons-api/ヴァルキア.png","fullbody":""},{"name":"ヴォイドセーバー","firstDate":"20 l":"不具合修正","text":"スターバースト爆発終了時、特定条件下でアカツキ状態が解除されない不具合を修正"},{"date":"2025-10-29","title":"『星の翼』10月30日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2156","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/9df899b8acb17e0d4b499c0948f0c80f.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"時限強化キャラクターであるガラハッド・暁は、現状では強化前の段階でも十分に戦力を発揮でき、優位を取れる場面が多く見られました。そのため、今回の調整では通常状態の性能を一部抑え、強化状態とのメリハリをより明確にしています。\n\nまた、ガラハッド・暁の一部の格闘攻撃を受けた際に、相手の体験が良くない点も確認しています。これらの点については、体験面の改善を目的とした調整を実施しています。\n\n1.【左/右+サブ射撃】の攻撃間隔: 10F→7F。\n2.【サブ格闘】及び【左/右+サブ格闘】の格闘追撃時間: 25F→22F。\n3.至近距離で【左/右+メイン格闘】が攻撃発生前にステップでキャンセル可能であった不具合を修正。\n4.アカツキ状態で【サブ射撃】発生時間: 14F→16F。\n5.アカツキ状態で【後+サブ射撃】補正率: 10%→15%。慣性速度が過大な場合に静止目標に命中しない不具合を修正。\n6.アカツキ状態で【メイン格闘派生サブ射撃】3段目・4段目の吹き飛び速度を調整。","rawText":"時限強化キャラクターであるガラハッド・暁は、現状では強化前の段階でも十分に戦力を発揮でき、優位を取れる場面が多く見られました。そのため、今回の調整では通常状態の性能を一部抑え、強化状態とのメリハリをより明確にしています。\n\nまた、ガラハッド・暁の一部の格闘攻撃を受けた際に、相手の体験が良くない点も確認しています。これらの点については、体験面の改善を目的とした調整を実施しています。\n\n1.【左/右+サブ射撃】の攻撃間隔: 10F→7F。\n2.【サブ格闘】及び【左/右+サブ格闘】の格闘追撃時間: 25F→22F。\n3.至近距離で【左/右+メイン格闘】が攻撃発生前にステップでキャンセル可能であった不具合を修正。\n4.アカツキ状態で【サブ射撃】発生時間: 14F→16F。\n5.アカツキ状態で【後+サブ射撃】補正率: 10%→15%。慣性速度が過大な場合に静止目標に命中しない不具合を修正。\n6.アカツキ状態で【メイン格闘派生サブ射撃】3段目・4段目の吹き飛び速度を調整。","ocrMode":"manual-image-cleaned","id":"ocr-682af318dcc7"},{"date":"2025-11-12","title":"『星の翼』11月13日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2198","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/a55fdd7965e74b1c5ec4f64e3beacb8c.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"1.【左/右+サブ射撃】ビット準備時間: 20F→22F。\n2.【サブ格闘】と【左/右+サブ格闘】補正率: 3段目8%→10%、4段目7%→8%。\n3.アカツキ状態で【後+サブ射撃】ビーム延伸速度: 100m/s→85m/s、最大射程: 20m→16m。\n4.アカツキ状態で【サブ格闘】移動速度: 25m/s→22m/s、最大維持時間: 30F→25F。","rawText":"1.【左/右+サブ射撃】ビット準備時間: 20F→22F。\n2.【サブ格闘】と【左/右+サブ格闘】補正率: 3段目8%→10%、4段目7%→8%。\n3.アカツキ状態で【後+サブ射撃】ビーム延伸速度: 100m/s→85m/s、最大射程: 20m→16m。\n4.アカツキ状態で【サブ格闘】移動速度: 25m/s→22m/s、最大維持時間: 30F→25F。","ocrMode":"manual-image-cleane の横幅: 0.35m→0.5m、ダウン値: 5.9→10、補正率: 4%→10%、総ダメージ: 633→648。\n4.【サブ射撃派生サブ射撃】弾丸の誘導開始時間: 5F→4F。\n5.アサルトモードでロックを切り替えると、目標が被攻撃ヒットを受けない不具合を修正。","rawText":"1.アサルトモードで特殊ステップの初期ブースト消費: 20→15、維持ブースト消費: 0.4→0。\n2.【左/右+サブ射撃】がオーバーヒート状態で使用可能。\n3.【後+サブ射撃】ビーム判定の横幅: 0.35m→0.5m、ダウン値: 5.9→10、補正率: 4%→10%、総ダメージ: 633→648。\n4.【サブ射撃派生サブ射撃】弾丸の誘導開始時間: 5F→4F。\n5.アサルトモードでロックを切り替えると、目標が被攻撃ヒットを受けない不具合を修正。","ocrMode":"manual-image-cleaned","id":"ocr-8d9fdea5349e"},{"date":"2026-03-04","title":"『星の翼』3月5日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2395","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/19c8969ca953f0e0904965a042133035.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"キャラ調整\n1. 天運Iの効果を変更。【メイン射撃】の弾速姿を増加。\n2. 天運IIの効果を変更。アサルトブースト状態のブースト消費を減少。\n3. 天運IIIの効果を変更。【左/右＋サブ射撃】で追加ミサイルを発射。\n4. 天運IVの効果を変更。アサルトブースト中の【メイン射撃】が爆撃制限を受けなくなる。\n5. 【メイン射撃】を12連射から2連射に変更。連射で弾薬可能に。ダメージ: 38→120、ダウン値: 6.25→17、ダメージ補正率: 4%→15%、判り値: 34→50。弾数: 60→12。\n6. 元の【後＋メイン射撃】を【後＋サブ射撃】に変更。【サブ射撃副弾薬】ゲージを消費。リロード時間: 8s→6s、発生時間: 15F→12F。\n7. 元の【サブ射撃】を【メイン格闘】チャージに変更。弾薬倍増がなくなり、乱散兵器を斉射。\n8. 元の【サブ格闘派生サブ射撃】を【サブ射撃】に変更。追加角度を追加。ダメージ: 60→80、ダウン値: 6.7→10、ダメージ補正率: 1%→4%。\n9. 元の【後＋サブ射撃】を【後＋メイン格闘】に変更。\n10. 【格闘派生サブ射撃】は、【後＋サブ射撃】を介助するようになる。\n11. 【サブ格闘】の登録をアサルトブースト終了後にその他で回復するよう変更。アサルトブースト中の持続消費を削除。アサルトブーストの総ゲージ追加技削除、ブースト消費を増加。\n12. アサルトブースト中の【メイン射撃】射撃速度仕様を調整。初期状態を高燃焼維持に設定し、弾速減少に伴い燃焼速度が低下。射撃速度は4秒で全回復。\n13. アサルトブースト【サブ射撃】リロード時間: 8s→6s。\n14. アサルトブースト【後＋メイン格闘】ダウン値: 5.9→10。補正率: 4%→10%。総ダメージ: 633→648。\n15. アサルトブースト【サブ格闘】リロード時間: 12s→8s。","rawText":"今回の調整では: キャヴァリーの武装構成を全面 的にリワークしました。\n従来の武装構成では: アクションのテンポの欠如 や挙動の冗長化といった課題が浮き彫りになって いました。 特に、 本来の強みであるはずの 「アサ ルトブースト」 の体験が不明瞭で 核心となる射 撃ロジックやリソース管理もキャラクターの特性 を十分に活かしきれていませんでした。\nを十分に活かしきれていませんでした。\nこれら を踏まえ 操作感の向上 リソース の楯 環 そして操作習熟度に応じた性能の最適化を目 指し、 複数の武装を再設計しました。 今後も引き 続き 調整後の性能を注視していきます。\n1天職I の効果を変更: 【メイン射撃】 の弾薬数 を増加\n2天職立の効果を変更: アサルトブースト状態の ブースト消費を減少。\n3天職皿の効果を変更: 【左+サブ射撃】 で追 加ミサイルを発射\n4天職川の効果を変更: アサルトブースト 中の 【メイン射撃】 が弾薬制限を受けなくなる。\n5.【メイン射撃】 を12連射から乙連射に変更。 連打 で3連射可能に。 ダメージ: 38-120 ダウン値: 6.25-17 ダメージ補正率: 4%-15% 削り値:\n「り,\n6.25-17、 ダメージ補正率: 4%っ15% 削り値: 34-50 弾数: 60-12。\n6元の 【後+メイン射撃】 を 【後+サブ射撃】 に 変更 【サブ射撃副弾薬】 ゲージを消費\nリロード時間: 85→6s 発生時間: 15Fっ12F。\n7元の サブ射撃】 を 【メイン格闘】 チャージに 変更。 弾薬消費がなくなり 拡散角度を縮小。\n8元の 【サブ射撃派生サブ射撃】 を 【サブ射撃】 に変更。 【サブ射撃主弾薬】 を消費し、 拡散角度 を増加\nダメージ: 60-80 ダウン値: 6.7-10 ダメージ 補正率: 7%-89。\n9元の 【後+サブ射撃】 を 【後+メイン格闘】 に 変更。\n10. 格闘派生サブ射撃】 は\n【後+サブ射撃】 を\n10. 格闘派生サブ射撃】 は 【後+サブ射撃】 を 発動するようになる。\n11.【サブ格闘】 の弾薬を アサルトブースト終了 後固定で4利で回復するように変更 (アサルトブ 一スト中の持続消費を削除)\nアサルトブースト の被ダメージ 増加機制を削除 し ブースト消費を増加。\n12アサルトブースト中の 【メイン射撃】 射撃速度 仕様を調整: 初期状態を最速発射に設定し 弾薬 減少に伴い発射速度が低下。 射撃速度は4利で全 回復\n13.アサルトブースト 【サブ射撃】 リロード時間: 85一5S。\n14.アサルトブースト 【後+メイン格闘】 ダウン 値: 5.9 つ 10 補正率: 4% つ 109 総ダメー ジ: 633 つ 648。\nルーー\nしけい\n15.アサルトブースト 【サブ格闘】 リロード時間: 12s-8s。","ocrMode":"manual-image-cleaned","id":"ocr-36439b3cf2cd","summary":"キャラ調整 / 1. 天運Iの効果を変更。【メイン射撃】の弾速姿を増加。 / 2. 天運IIの効果を変更。アサルトブースト状態のブースト消費を減少。"},{"date":"2026-03-25","title":"『星の翼』3月26日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2433","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/83a74db80820cf95f04f0ed0a614ac41.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"キャヴァリーのアサルトブーストは、通常時と比べてブースト消費が少なく、立ち回りにおいて優位な状況を作りやすい状態にあることが確認されています。\n\nそのため、アサルトブースト中のブースト消費量について調整を行っています。\n\n1.【アサルトブースト】のアサルトブースト消費: 5ポイント/s→12ポイント/s。\n2.チャージ【メイン格闘】のチャージゲージ減衰速度を緩和。","rawText":"キャヴァリーのアサルトブーストは、通常時と比べてブースト消費が少なく、立ち回りにおいて優位な状況を作りやすい状態にあることが確認されています。\n\nそのため、アサルトブースト中のブースト消費量について調整を行っています。\n\n1.【アサルトブースト】のアサルトブースト消費: 5ポイント/s→12ポイント/s。\n2.チャージ【メイン格闘】のチャージゲージ減衰速度を緩和。","ocrMode":"manual-image-cleaned","id":"ocr-591938e0d7d2"},{"date":"2026-05-06","title":"『星の翼』5月7日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2517","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/15994ebe0900101366a47874d5391394.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"キャヴァリーは中距離での牽制や高速の立ち回りにおいて、リスクの低い制圧力を発揮していました。今回の調整では、核心となる牽制手段の安定性を高めつつ、一方的に攻撃を押し付ける「引き撃ち」戦術を抑制することを目指しています。\n\n1.【左/右+サブ射撃】: ミサイルの発射間隔: 3F→5F、ミサイルの誘導性能: 50°/s→40°/s。\n2.アサルトブースト中に【メイン射撃】を下方、銃口追従遅延を若干増加。\n3.【サブ射撃】を強化: 一部ミサイルの拡散角度を微調整し、命中をより安定化。弾丸の最高速度到達時間: 発射後20Fで最高速度に到達→発射後10Fで最高速度に到達。","rawText":"キャヴァリーは中距離での牽制や高速の立ち回りにおいて、リスクの低い制圧力を発揮していました。今回の調整では、核心となる牽制手段の安定性を高めつつ、一方的に攻撃を押し付ける「引き撃ち」戦術を抑制することを目指しています。\n\n1.【左/右+サブ射撃】: ミサイルの発射間隔: 3F→5F、ミサイルの誘導性能: 50°/s→40°/s。\n2.アサルトブースト中に【メイン射撃】を下方、銃口追従遅延を若干増加。\n3.【サブ射撃】を強化: 一部ミサイルの拡散角度を微調整し、命中をより安定化。弾丸の最高速度到達時間: 発射後20Fで最高速度に到達→発射後10Fで最高速度に到達。","ocrMode":"manual-image-cleaned","id":"ocr-f8f653b10873"},{"date":"2026-05-27","title":"『星の翼』5月28日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2570","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/6c78cd97e02964e987e790a2156026ec.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"1.アサルトブースト中、ブーストがほぼ尽きた状態でステップを使用した際に、状態解除後の硬直が異常となる不具合を修正。","rawText":"1.アサルトブースト中、ブーストがほぼ尽きた状態でステップを使用した際に、状態解除後の硬直が異常となる不具合を修正。","ocrMode":"manual-image-cleaned","id":"ocr-9389c826dddd"},{"date":"2024-12-31","title":"『星の翼』1月1日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1233","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/4526e93539b93fb65a2eb4d2e6066a45.jpg","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","id":"ocr-manual-2024-12-31-e382ade383a3e383","text":"特定の状況で、空中でアサルトモードで【メイン格闘】を使用すると、キャラが落下し続ける不具合を修正。","rawText":"特定の状況で、空中でアサルトモードで【メイン格闘】を使用すると、キャラが落下し続ける不具合を修正。","ocrMode":"manual-image-cleaned"}],"cost":"3.0","icon":"assets/character-icons-api/キャヴァリー.png","fullbody":"assets/character-icons/キャヴァリー.png"},{"name":"キャッティ","firstDate":"2025-08-07","lastDate":"2026-01-20","articleCount":4,"updateCount":9,"ocrCount":2,"counts":{"balance":1,"fix":4,"add":0,"other":2,"ocr":2},"weapons":["後+メイン格闘","バースト","バーストアタック"],"updates":[{"id":"txt-fc945f993a72","date":"2025-08-07","title":"『星の翼』8月7日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo 丸判定幅: 0.5m→0.35m。","ocrMode":"manual-image-cleaned","id":"ocr-10586013b16a"},{"date":"2025-10-29","title":"『星の翼』10月30日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2156","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/9df899b8acb17e0d4b499c0948f0c80f.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"キャミィは現在、特定の派生への依存がやや強く、戦闘中の選択肢が限定されがちでした。そのため、該当派生の使用による効果を下方修正し、他の派生の性能を強化することで、より多様な立ち回りができるよう調整しています。\n\nまた、【後+サブ射撃】武装は、現状の性能がやや高めであるだけでなく、高さの差によって攻撃判定がエフェクトに左右されやすい問題も確認されました。こちらの問題を改善すべく、調整を行いました。\n\n1.【後方+サブ射撃】連打後に発動するストームの判定高さ: 8m→6m。\n2.【メイン格闘+サブ射撃】派生時の滑走速度: 20m/s→15m/s。さらに、1段目のヒットストップ時間: 2F→7F。\n3.【左/右+メイン格闘】の回転攻撃におけるダウン値構成を調整。各ヒットのダウン値: 3.5→1段目ダウン値: 34、后续撃のダウン値: 0に変更。\n4.【メイン格闘】命中中に【サブ格闘】を派生させた際のダメージを調整: 1段目・2段目のダウン値を0に下方修正。","rawText":"キャミィは現在、特定の派生への依存がやや強く、戦闘中の選択肢が限定されがちでした。そのため、該当派生の使用による効果を下方修正し、他の派生の性能を強化することで、より多様な立ち回りができるよう調整しています。\n\nまた、【後+サブ射撃】武装は、現状の性能がやや高めであるだけでなく、高さの差によって攻撃判定がエフェクトに左右されやすい問題も確認されました。こちらの問題を改善すべく、調整を行いました。\n\n1.【後方+サブ射撃】連打後に発動するストームの判定高さ: 8m→6m。\n2.【メイン格闘+サブ射撃】派生時の滑走速度: 20m/s→15m/s。さらに、1段目のヒットストップ時間: 2F→7F。\n3.【左/右+メイン格闘】の回転攻撃におけるダウン値構成を調整。各ヒットのダウン値: 3.5→1段目ダウン値: 34、后续撃のダウン値: 0に変更。\n4.【メイン格闘】命中中に【サブ格闘】を派生させた際のダメージを調整: 1段目・2段目のダウン値を0に下方修正。","ocrMode":"manual-image-cleaned","id":"ocr-6fdaa309549a"}],"cost":"3.0","icon":"assets/character-icons-api/キャミィ.png","fullbody":""},{"name":"クリスタ","firstDate":"2026-01-15","lastDate":"2026-03-04","articleCount":4,"updateCount":15,"ocrCount":2,"counts":{"balance":8,"fix":4,"add":1,"other":0,"ocr":2},"weapons":["サブ格闘","サブ格闘＋サブ格闘派生","バーストアタック","前＋メイン格闘"],"updates":[{"id":"txt-3491e3501f71","date":"2026-01-15","title":"『星の翼』1月15日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2341","category":"balance","categoryLabel":"バランス・性能調整","text":"サブ格闘: 発動中に自身がダウンされた場合でもブーストが持続消費される不具合を修正"},{"id":"txt-c79754183e2f","date":"2026-01-15","title":"『星の翼』1月15日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=23 id":"ocr-05ecd0a264b1"},{"date":"2025-05-07","title":"『星の翼』5月8日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1641","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/246814068c3c5e776d2e7bececefc4eb.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"1.飛翔状態で【後+メイン格闘】命中後、【メイン格闘+サブ格闘】派生が目標に命中しない不具合を修正。","rawText":"1.飛翔状態で【後+メイン格闘】命中後、【メイン格闘+サブ格闘】派生が目標に命中しない不具合を修正。","ocrMode":"manual-image-cleaned","id":"ocr-b2fc5a6f0e0b"},{"date":"2025-09-17","title":"『星の翼』9月19日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2061","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/8618b26e8ea556c271282dc0e3877268.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"キャラ調整\n1. 飛翔期間中に武装使用後、オーバーヒートになり、接地状態で【ステップ】を入力すると、武装状態が異常になる不具合を修正。","rawText":"1 飛翔期間中に武装使用後 オーバーヒートにな\n1飛翔期間中に武装使用後 オーバーヒートにな り 接地状態で 【ステップ】 を入力すると 武装 状態が異常になる不具合を修正。\nI A D ノリ 5 T\n1.一部キャラクターが格闘ヒットした後 即座に 【ステップ】 をキャンセルできない不具合を修 正。","ocrMode":"manual-image-cleaned","id":"ocr-7bdaf7c616e3","summary":"キャラ調整 / 1. 飛翔期間中に武装使用後、オーバーヒートになり、接地状態で【ステップ】を入力すると、武装状態が異常になる不具合を修正。"},{"date":"2026-03-04","title":"『星の翼』3月5日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2395","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/19c8969ca953f0e0904965a042133035.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"上方修正\n1. 【前＋メイン格闘】および飛翔状態の【メイン格闘】は弾薬制限なしに変更。\n2. 【サブ射撃】の弾薬を2発に変更（1回使用につき1発消費）。【メイン格闘＋サブ射撃】は【サブ射撃】の弾薬制限を受けなくなる。\n3. 飛翔状態の【後＋サブ射撃】を調整。ヒットが目標付近まで追従し、障壁ユニットを2連射。その弾丸は相手の移動経路を予測して発射。\n4. 飛翔状態の【任意方向＋メイン射撃】は、ヒットを指示して手放し狙撃を行う非足止武装に変更。ただし性能は単方向【メイン射撃】より弱くなく、単独攻撃方向【メイン射撃】と共用。","rawText":"グリフィンは独自の乙形態と複雑な操作性が特徴 のキャラですが 今回の調整では立ち回りにおけ るレバー操作を簡略化しました。\nまた、 中遠距離からの牽制能力を強化し、 着地と 離陸を繰り返す立ち回りの安定性を向上させ よ り扱いやすいキャラクターに改善しました。\n1.【前+メイン格闘】 および飛翔状態の 【メイン 格闘】 は弾薬制限なし。\n【前+メイン格闘】 の発生時間を6に調整。 ファ イティングバースト中 追従加速効果が格闘武装 加速効果と重複しなくなる。\n2.【サブ射撃】 の弾薬を2発に変更 (1回使用につ き1発消費) 【メイン格闘 + サブ射撃】 は 【サ ブ射撃】 の弾薬制限を受けなくなる。\n3飛翔状態の 【後+サブ射撃】 を調整: ビットが 目標付近まで追従し、 麻痺ビーム を2連続で発射 する。\n4飛翔状態の 【任意方向+メイン射撃】 は ビッ トを指示して手放し射撃を行う非足止武装に変 更。 ただし性能は無方向 【メイン射撃】 より弱く なり 弾数は無方向 【メイン射撃】 と共用とな る。","ocrMode":"manual-image-cleaned","id":"ocr-9282521d08ea","summary":"上方修正 / 1. 【前＋メイン格闘】および飛翔状態の【メイン格闘】は弾薬制限なしに変更。 / 2. 【サブ射撃】の弾薬を2発に変更（1回使用につき1発消費）。【メイン格闘＋サブ射撃】は【サブ射撃】の弾薬制限を受けなくなる。"},{"date":"2026-03-25","title":"『星の翼』3月26日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2433","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/83a74db80820cf95f04f0ed0a614ac41.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"1.シューティングバースト発動中、飛翔状態のN【メイン射撃】が方向【メイン射撃】でキャンセルされた後、ビットの照準方向が異常となる不具合を修正。\n\n2.シューティングバースト発動中、飛翔状態の方向【メイン射撃】が快速で連続使用可能となる不具合を修正。","rawText":"1.シューティングバースト発動中、飛翔状態のN【メイン射撃】が方向【メイン射撃】でキャンセルされた後、ビットの照準方向が異常となる不具合を修正。\n\n2.シューティングバースト発動中、飛翔状態の方向【メイン射撃】が快速で連続使用可能となる不具合を修正。","ocrMode":"manual-image-cleaned","id":"ocr-fd7191308f80"},{"date":"2026-04-15","title":"『星の翼』4月16日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2476","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/3a262646e336e91559b6e2d24247c98f.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"1.飛翔状態でN【メイン射撃】発生時間を1F増加。飛翔状態で【任意方向+メイン射撃】の発生時間を1F短縮。\n2.通常状態で【サブ射撃】における羽弾の誘導を切れる時間: 発射後18F→発射後14F。\n3.HP値: 3020→2952。","rawText":"1.飛翔状態でN【メイン射撃】発生時間を1F増加。飛翔状態で【任意方向+メイン射撃】の発生時間を1F短縮。\n2.通常状態で【サブ射撃】における羽弾の誘導を切れる時間: 発射後18F→発射後14F。\n3.HP値: 3020→2952。","ocrMode":"manual-image-cleaned","id":"ocr-c6d6fa0ce589"},{"date":"2024-12-11","title":"『星の翼』12月12日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1072","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/6db151c3222d04bc8d84642340c8be84.jpg","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","id":"ocr-manual-2024-12-11-e382b0e383aae383","text":"1.飛翔状態【後+メイン格闘】の追従速度異常の不具合を修正。\n2.スマホ版で、天賦Vの特殊バーストを発生すると、模擬レバーUIが表示される。","rawText":"1.飛翔状態【後+メイン格闘】の追従速度異常の "不具合修正","text":"後+ステップ: で格闘武装中に下方向へ移動してしまう不具合を修正"},{"date":"2025-03-05","title":"『星の翼』3月6日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1456","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/d9abf95b40f0a429f101af2abd65c0a3.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"下方修正\n1. 【後＋メイン格闘】判定範囲をエフェクトに合わせて短縮。","rawText":"1.「後+メイン格闘」 判定範囲のがエフェクトに合 わせて短縮。","ocrMode":"manual-image-cleaned","id":"ocr-03ad5066c8c6","summary":"下方修正 / 1. 【後＋メイン格闘】判定範囲をエフェクトに合わせて短縮。"},{"date":"2025-04-16","title":"『星の翼』4月17日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1539","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/f190e84fa0a4fb3390cca037af812f76.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"1.【メイン射撃】スタン値: 50→100。\n\n2.【後+メイン格闘】照準維持時間: 8F→12F（発生時間が変更なし）。","rawText":"1.【メイン射撃】スタン値: 50→100。\n\n2.【後+メイン格闘】照準維持時間: 8F→12F（発生時間が変更なし）。","ocrMode":"manual-image-cleaned","id":"ocr-580e361b62f4"},{"date":"2025-08-27","title":"『星の翼』8月27日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1992","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/e2bf6977a13c920fb1e33c704c95857b.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"コンテンツ調整\n1. 【スターバースト】の効果範囲内で自身が【ステップ】を使用した際、ブーストが消費されない不具合を修正。","rawText":"1.【スターバースト】 の効果範囲内で自身が 【ステ ップ】 を使用した際 ブーストが消費されない不 具合を修正。","ocrMode":"manual-image-cleaned","id":"ocr-312689aa4c98","summary":"コンテンツ調整 / 1. 【スターバースト】の効果範囲内で自身が【ステップ】を使用した際、ブーストが消費されない不具合を修正。"},{"date":"2025-09-17","title":"『星の翼』9月19日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2061","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/8618b26e8ea556c271282dc0e3877268.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"キャラ調整\n1. 【メイン射撃】が全方向の【サブ格闘】でもキャンセル可能。\n2. 【後＋サブ格闘】発生期間中に回避されると、キャラクターの移動方向が異常になる不具合を修正。\n3. 【左右/後方＋サブ射撃】発動中、翔が目標に命中しても引き戻せない場合がある不具合を修正。","rawText":"シャオリンのキャンセルルートを最適化し、 一部 の武装の不具合を修正いたしました。\nレノエVルマッノ ニミワ・バシーッノンょしノ。\n1.【メイン射撃】 が全方向の 【サブ格闘】 でキャン セル可能\n2.【後+サブ格闘】 発生期間中に回避されると キャラクターの移動方向が異常になる不具合を修 正。\n3.【左右後方 +サブ射撃】 発動中 網が目標に命 中しても引き戻せない場合がある不具合を修正。","ocrMode":"manual-image-cleaned","id":"ocr-8d34c6f3680e","summary":"キャラ調整 / 1. 【メイン射撃】が全方向の【サブ格闘】でもキャンセル可能。 / 2. 【後＋サブ格闘】発生期間中に回避されると、キャラクターの移動方向が異常になる不具合を修正。"},{"date":"2025-12-03","title":"『星の翼』12月04日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2239","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/6ecc64985c5c319a354fb6df1b630708.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"キャラ調整\n1. 【メイン射撃】を近距離の単発拳風に変更。弾速を上げ、命中した対象に重量による硬直を与えるようにし、接地判定は廃止。\n2. 【サブ射撃】の当たり判定を拡大: 1×1m→2×2m。任意の【サブ格闘】へのキャンセルルートを新規追加。\n3. 【後＋ステップ】の下方向移動速度を上昇: 5m→10m。\n4. 【サブ格闘】のスーパーアーマーを、モーション開始タイミングから攻撃判定発生時までに変更。アクティブ/スターバースト中の追従速度と格闘動作加速の重複効果を削除。追従時間を短縮: 30F→25F。追従速度を減少: 25m/s→22m/s、発生フレーム: 7→10F。\n5. 【後＋サブ格闘】の弾薬を独立化し、射撃防御時のヒットストップ時間を短縮: 3F→2F。【左右＋サブ格闘】を新規追加。左・右方向に跳びながら目標に飛び蹴りを行う。この武装は【後＋サブ格闘】と弾薬を共有。弾切れ時でも使用可能だが、正面からの射撃は防御できない。\n6. 新規【バーストアタック】を追加。目標方向に巨竜を発射。既存のバーストアタックは【後＋バーストアタック】に変更。\n7. 【メイン格闘＋メイン射撃】派生を削除。代わりに【前＋サブ格闘】を追加。目標に高速で接近して連続パンチを繰り出す。\n8. 【前＋メイン格闘】を飛び蹴りに変更し、旋風脚で目標を追撃する。既存の【前＋メイン格闘】は【メイン格闘＋サブ射撃】格闘派生に変更。最後の一撃は必ず対象をダウンさせる。\n9. 【メイン格闘＋サブ格闘】派生は、前方への移動を行わず、その場で攻撃を行うように変更。","rawText":"シャオリンの戦闘スタイルを見直し、 遠跳離牽制 依存からより押しの強い近接格闘へ転換するた め、 武装システムを全面的に再構築しました 今 回の調整では 近距離での積極的な攻撃能力の向 上 武装連構ロジックの最適化 そしてより明確 な爆発力と戦術選択の付与を目指しています。\n1.【メイン射撃】 を近距離の単発拳風に変更。 弾速 を上げ_ 命中した対象に重撃による硬直を与える ようにし 接地判定は廃止。\n2. サブ射撃】 の当たり判定を拡大: 1x1m つう\n2.【サブ射撃】 の当たり判定を拡大: 1x1m つ Zx2m 任意の 【サブ格闘】 へのキャンセルルート を新規追加。\n3.【後+ステップ】 の下方向移動速度を上昇: 5m 10m\n4. 【サブ格闘】 のスーパーアーマーを 「モーショ ンを開始したタイミングから攻撃判定発生時ま で」 に変更。 ファイティング型スターバースト発 動中の追従速度と格闘動作加速の重複効果を削 除。\n追従時間を短縮: 30F 一 25F 追従速度を減少: 25m/s つ 22m/s 発生フレーム: 7→10F。\n5.【後+サブ格闘】 の弾薬を独立化し、 射撃防御時 のヒットストップ時間を短縮: 3F - 2F。\n【左右+サブ格闘】 を新規追加: 左・右方向に跳 びあがって目標に飛び跡りを行う。 こちらの武装 は 【後+サブ格闘】 と弾薬を共有\n弾切れ時でも使用可能だが 正面からの射撃は防 御できない。\n6新規 【バーストアタック】 を追加: 目標方向に巨 竜を発射\nイ存のバーストアタックは 【後+バーストアタッ ク】 に変更。\n7.【メイン格闘+ メイン射撃】 派生を削除 代わり に 【前+サブ格闘】 を追加: 目標に高速で接近し て連続パンチを繰り出す。\n8.【前+メイン格闘】 を飛び跡りに変更し 旋風脚 で目標を追撃する。\n眠存の 【前+メイン格闘】 は 【メイン格闘+サブ 射撃】 格闘派生に変更 最後の一撃は必ず対象を ダウンさせる。\n9.【メイン格闘+サブ格闘】 派生は 前方への移動 を行わず その場で攻撃を行うように変更。","ocrMode":"manual-image-cleaned","id":"ocr-2f8b31c501a6","summary":"キャラ調整 / 1. 【メイン射撃】を近距離の単発拳風に変更。弾速を上げ、命中した対象に重量による硬直を与えるようにし、接地判定は廃止。 / 2. 【サブ射撃】の当たり判定を拡大: 1×1m→2×2m。任意の【サブ格闘】へのキャンセルルートを新規追加。"},{"date":"2025-12-24","title":"『星の翼』12月25日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2285","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/67e20c9d79e86f69572c319fc3b601d8.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"シャオリンの【サブ格闘】はヒットストップが長いため、保護を目的としてスーパーアーマーの持続時間を1F延長しました。\n\nあわせて、中〜近距離でもより安心して使用できるよう調整しています。\n\n1.【サブ格闘】のスーパーアーマー効果持続時間を1F延長。","rawText":"シャオリンの【サブ格闘】はヒットストップが長いため、保護を目的としてスーパーアーマーの持続時間を1F延長しました。\n\nあわせて、中〜近距離でもより安心して使用できるよう調整しています。\n\n1.【サブ格闘】のスーパーアーマー効果持続時間を1F延長。","ocrMode":"manual-image-cleaned","id":"ocr-1b9c3a14592e"},{"date":"2026-01-14","title":"『星の翼』1月15日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2332","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/0cc0d21f14c7da9c101732a00f80c8f2.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"キャラ調整\n1. マップ境界付近の対象に【サブ格闘】をヒットさせた直後に【サブ射撃】派生攻撃を発動すると、攻撃が空振りする不具合を修正。\n2. 【前＋メイン格闘】がステップされた際、キャラが早期終了する不具合を修正。","rawText":"1.マップ境界付近の対象に 【サブ格闘】 をヒット させた真後に 【サブ射撃】 派生攻撃を発動する と 攻撃が空振りする不具合を修正。\n2. 【前+メイン格闘】 がステップされた際 キッ クが早期終了する不具合を修正。","ocrMode":"manual-image-cleaned","id":"ocr-90e1c744bb68","summary":"キャラ調整 / 1. マップ境界付近の対象に【サブ格闘】をヒットさせた直後に【サブ射撃】派生攻撃を発動すると、攻撃が空振りする不具合を修正。 / 2. 【前＋メイン格闘】がステップされた際、キャラが早期終了する不具合を修正。"},{"date":"2026-03-04","title":"『星の翼』3月5日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2395","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/19c8969ca953f0e0904965a042133035.png","imageIndex": : 10F→8F。弾丸判定幅: 2m→2.5m。","rawText":"同タイプの武装と比べ、【後+メイン射撃】は性能が十分に発揮できていないと判断したため、今回一定の調整を行いました。\n\n1.【後+メイン射撃】発生時間: 10F→8F。弾丸判定幅: 2m→2.5m。","ocrMode":"manual-image-cleaned","id":"ocr-6b6f2a601e86"},{"date":"2025-12-03","title":"『星の翼』12月04日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2239","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/6ecc64985c5c319a354fb6df1b630708.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"上方修正\n1. 【サブ射撃】シュウウが吹き飛ばされた際、虚剣が一緒に落下しなくなるように調整。","rawText":"シュウウの被ダメージ中の武装価値と戦闘フォ一 ルトトレラント性を向上させるため 【サブ射 撃】 の特定状態下における効果ロジックを調整 し、 武装発動の安定性を高めました。\n1. 【サブ射撃】 シュウウが吹き飛ばされた際 虚剣 が一緒に落下しなくなるように調整。\nデッド・アライブ\n現在 「デッド・アライブ」 のサバイバビリティ と有効戦闘距離において やや苦戦が確認されて います。\nいます。\nこのため 部基本属性のバランス調整を実施 し、 ゲーム環境においてより安定した戦闘能力を 発揮できるよう改善を行いました\n1.HPを増加: 2525 つ 2675。\n2赤ロック距離を延長: 31m つ 33m\nさ雷改\nこのたび 薫雷改の一部格闘派生武装について 消費リソースとコンボ接続ロジックの最適化を実 施いたしました。\nこれにより: 戦闘中により柔軟な攻めの展開が可 能となることを目指しております。\n1.【前+メイン格闘】 の追加ブーストゲージ消費を 減少: 15 っ3。\nル\n川川ーニ\nれルト\nルッー・\n減少: 15 - 3。\n【メイン射撃】 から 【前+メイン格闘】 へのキャ ンセルルートを新規追加\n2.【後+メイン格闘】 の追加ブーストゲージ消費を 減少: 5 っ0。","ocrMode":"manual-image-cleaned","id":"ocr-e218feace12e","summary":"上方修正 / 1. 【サブ射撃】シュウウが吹き飛ばされた際、虚剣が一緒に落下しなくなるように調整。"},{"date":"2024-12-31","title":"『星の翼』1月1日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1233","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/4526e93539b93fb65a2eb4d2e6066a45.jpg","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","id":"ocr-manual-2024-12-31-e382b7e383a5e382","text":"【サブ格闘】虚剣・銘ブースト消費: 0→5。【八里・朧撃】ブースト消費: 20→10。","rawText":"【サブ格闘】虚剣・銘ブースト消費: 0→5。【八里・朧撃】ブースト消費: 20→10。","ocrMode":"manual-image-cleaned"},{"date":"2025-02-12","title":"『星の翼』2月13日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1370","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/57bd2cf7c34210f82faf8f36d3972971.jpg","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","id":"ocr-manual-2025-02-12-e382b7 hengtiangames.com/newsInfo?lan=CN&id=1732","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/31b822c474f986e50e265d579d95d06d.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"1.【サブ射撃サブ弾薬】リロード時間: 4s→3s。\n2.【サブ格闘派生サブ射撃】が【左/右+サブ格闘】でキャンセル可能。","rawText":"1.【サブ射撃サブ弾薬】リロード時間: 4s→3s。\n2.【サブ格闘派生サブ射撃】が【左/右+サブ格闘】でキャンセル可能。","ocrMode":"manual-image-cleaned","id":"ocr-2559ea8ddf0a"},{"date":"2025-10-29","title":"『星の翼』10月30日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2156","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/9df899b8acb17e0d4b499c0948f0c80f.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"同タイプの武装と比べ、一部の場面で力不足に感じられることがありました。そのため、該当武装の性能をより扱いやすく、戦闘で活躍しやすいよう調整を行いました。\n\n1.【サブ格闘派生サブ射撃】発生時間: 11F→9F。","rawText":"同タイプの武装と比べ、一部の場面で力不足に感じられることがありました。そのため、該当武装の性能をより扱いやすく、戦闘で活躍しやすいよう調整を行いました。\n\n1.【サブ格闘派生サブ射撃】発生時間: 11F→9F。","ocrMode":"manual-image-cleaned","id":"ocr-a0db986f78db"},{"date":"2026-04-15","title":"『星の翼』4月16日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2476","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/3a262646e336e91559b6e2d24247c98f.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"1.【メイン射撃】を調整: 特殊背面射撃を削除。\n2.【サブ射撃】: バックパックから強力なビームとミサイルを発射する効果に変更。リロード時間: 1発ごとに8秒→7秒。\n3.【左/右/後+サブ射撃】の最大弾速: 2s→5s、リロード時間: 3s→4s。左/右は二連射に変更。\n4.【メイン格闘】の各ヒットのダメージ構成を再調整。\n5.【左/右+メイン格闘】の各ヒットのダメージ構成を再調整。\n6.【前+メイン格闘】: 複合武装を使用した目標への斬り抜け効果に変更。スターバースト状態中の効果を調整: 基礎性能・攻撃段数・一部格闘武装からの【前+メイン格闘】派生を追加。\n7.【後+メイン格闘】: ダークスターを召喚し、目標に射撃する効果に変更。スターバースト状態中に初めて使用した場合、ダークスターが目標に突進して強力な攻撃を行う。総弾数: 60→1、リロード時間: 12s→10s。\n8.【サブ格闘派生メイン格闘】の追撃を目標に跳びかかり、斬撃を行うに変更。1段目のダメージ補正率: 15%→20%。\n9.【後+サブ格闘】の弾薬消費を撤廃。追従時間: 30F→15F、跳びの踏み切り速度: 50m/s→40m/s。\n10.【メイン格闘派生サブ射撃】: 補正率: 20%→15%。命中時に受け身不可効果を追加し、従来スターバースト中のみ有効だった効果を常時有効化。獲得ブースト量を10→7に調整。\n11.【メイン格闘派生サブ格闘】の戦闘演出を再設計。\n12.【バーストアタック】の戦闘アニメーションを再設計。","rawText":"1.【メイン射撃】を調整: 特殊背面射撃を削除。\n2.【サブ射撃】: バックパックから強力なビームとミサイルを発射する効果に変更。リロード時間: 1発ごとに8秒→7秒。\n3.【左/右/後+サブ射撃】の最大弾速: 2s→5s、リロード時間: 3s→4s。左/右は二連射に変更。\n4.【メイン格闘】の各ヒットのダメージ構成を再調整。\n5.【左/右+メイン格闘】の各ヒットのダメージ構成を再調整。\n6.【前+メイン格闘】: 複合武装を使用した目標への斬り抜け効果に変更。スターバースト状態中の効果を調整: 基礎性能・攻撃段数・一部格闘武装からの【前+メイン格闘】派生を追加。\n7.【後+メイン格闘】: ダークスターを召喚し、目標に射撃する効果に変更。スターバースト状態中に初めて使用した場合、ダークスターが目標に突進して強力な攻撃を行う。総弾数: 60→1、リロード時間: 12s→10s。\n8.【サブ格闘派生メイン格闘】の追撃を目標に跳びかかり、斬撃を行うに変更。1段目のダメージ補正率: 15%→20%。\n9.【後+サブ格闘】の弾薬消費を撤廃。追従時間: 30F→15F、跳びの踏み切り速度: 50m/s→40m/s。\n10.【メイン格闘派生サブ射撃】: 補正率: 20%→15%。命中時に受け身不可効果を追加し、従来スターバースト中のみ有効だった効果を常時有効化。獲得ブースト量を10→7に調整。\n11.【メイン格闘派生サブ格闘】の戦闘演出を再設計。\n12.【バーストアタック】の戦闘アニメーションを再設計。","ocrMode":"manual-image-cleaned","id":"ocr-d8a7b31dc696"},{"date":"2026-05-06","title":"『星の翼』5月7日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2517","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/15994ebe0900101366a47874d5391394.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"スカイセーバーにおいて、追撃性能およびコンボのつながりに改善の余地があり、一部の武装がバフ効果を正しく受けられない不具合も確認されました。これらを改善するため、コンボ追撃の安定化と操作感の最適化を実施しました。\n\n1.【サブ射撃】ミサイル弾速: 30m/s→35m/s。射撃終了後のキャンセルルート入力タイミングを明確化するため、後隙を若干増加。\n2.【前+メイン格闘】の追撃速度にファイティングバーストの追加効果が適用されない不具合を修正。\n3.【サブ格闘派生メイン格闘】: 格闘追撃速度: 20m/s→22m/s。追撃期間中に【左/右/後+サブ射撃】によるキャンセルルートを追加。\n4.【後+サブ格闘】の格闘追撃速度: 15m/s→18m/s。","rawText":"スカイセーバーにおいて、追撃性能およびコンボのつながりに改善の余地があり、一部の武装がバフ効果を正しく受けられない不具合も確認されました。これらを改善するため、コンボ追撃の安定化と操作感の最適化を実施しました。\n\n1.【サブ射撃】ミサイル弾速: 30m/s→35m/s。射撃終了後のキャンセルルート入力タイミングを明確化するため、後隙を若干増加。\n2.【前+メイン格闘】の追撃速度にファイティングバーストの追加効果が適用されない不具合を修正。\n3.【サブ格闘派生メイン格闘】: 格闘追撃速度: 20m/s→22m/s。追撃期間中に【左/右/後+サブ射撃】によるキャンセルルートを追加。\n4.【後+サブ格闘】の格闘追撃速度: 15m/s→18m/s。","ocrMode":"manual-image-cleaned","id":"ocr-6b1f6f7d13b2"},{"id":"txt-adfc786a68c8","date":"2026-05-29","title":"『星の翼』5月29日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2591","category":"fix","categoryLabel":"不具合修正","text":"〖バーストアタック〗：目標が障害物に背を向けているとコンボが空振りする不具合を修正。"}],"cost":"2.5","icon":"assets/character-icons-api/スカイセーバー.png","fullbody":""},{"nam ategory":"fix","categoryLabel":"不具合修正","text":"シューティングバースト発動中、巡遊状態で【左/右/後＋サブ格闘】が【サブ射撃】でキャンセルできない不具合を修正"},{"date":"2025-12-03","title":"『星の翼』12月04日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2239","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/6ecc64985c5c319a354fb6df1b630708.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"キャラ調整\n1. 【メイン射撃】を最適化。振り向き撃ち際の動作を改善し、逆旋撃が後にキャラクターが目標方向を向くように変更。","rawText":"1. 【メイン射撃】 を最適化: 振り向き撃ち際の動作\n1.【メイン射撃】 を最適化: 振り向き撃ち際の動作 を改善し、 武装終了後にキャラクターが目標方向 を向くように変更。","ocrMode":"manual-image-cleaned","id":"ocr-8825eff27df7","summary":"キャラ調整 / 1. 【メイン射撃】を最適化。振り向き撃ち際の動作を改善し、逆旋撃が後にキャラクターが目標方向を向くように変更。"},{"date":"2025-12-24","title":"『星の翼』12月25日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2285","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/67e20c9d79e86f69572c319fc3b601d8.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"巡遊状態中のセイレンの一部武装の挙動が、想定していた立ち位置から乖離していることを確認しています。\n\n攻撃パターンや防御性能にはさらなる最適化の余地があります。\n\n今回の調整では、武装の操作感の向上、弾薬やゲージなどのリソース管理、および一部武装効果の調整を行うことで、巡遊状態におけるセイレンの特徴的な立ち回りをより明確にし、全体の戦闘テンポを合理的なものにすることを目的としています。\n\n1.巡遊状態中、【サブ射撃】の自身慣性速度を減少。銃口照準時間: 15F発生後の追加照準1F→発生時間と同等に変更。ビーム弾の命中間隔: 1F→2F。タツノオトシゴ照射の持続時間: 60F→30F。\n2.巡遊状態中、【左/右/後+サブ格闘】の垂直方向速度: 第10Fからの落下→第0Fからの落下へ変更。弾丸の分布と誘導弾道を調整し、削り値: 34→50。\n3.巡遊状態中、【メイン射撃】の泡の初速: 10m/s→40m/s。誘導弾道を最適化。直撃ダメージ: 210→345、ダウン値: 40→120。弾薬数を3発に調整、4秒ごとに1発を回復。\n4.巡遊状態中、【左/右+サブ射撃】の移動軌道を曲線移動に変更し、発射される弾道を最適化。関連数値を調整: ダメージ61→45、ダウン値5→4、ダメージ補正率5→4.8、削り値100→50。この時タツノオトシゴも同一弾丸を発射。\n5.【ガード】の最大維持時間を延長: 40F→60F。新仕様を追加: 防御成功時に一部のブーストおよびスターエネルギーを回復可能となる。\n6.【サブ射撃】の攻撃判定範囲を30%減少。","rawText":"巡遊状態中のセイレンの一部武装の挙動が、想定していた立ち位置から乖離していることを確認しています。\n\n攻撃パターンや防御性能にはさらなる最適化の余地があります。\n\n今回の調整では、武装の操作感の向上、弾薬やゲージなどのリソース管理、および一部武装効果の調整を行うことで、巡遊状態におけるセイレンの特徴的な立ち回りをより明確にし、全体の戦闘テンポを合理的なものにすることを目的としています。\n\n1.巡遊状態中、【サブ射撃】の自身慣性速度を減少。銃口照準時間: 15F発生後の追加照準1F→発生時間と同等に変更。ビーム弾の命中間隔: 1F→2F。タツノオトシゴ照射の持続時間: 60F→30F。\n2.巡遊状態中、【左/右/後+サブ格闘】の垂直方向速度: 第10Fからの落下→第0Fからの落下へ変更。弾丸の分布と誘導弾道を調整し、削り値: 34→50。\n3.巡遊状態中、【メイン射撃】の泡の初速: 10m/s→40m/s。誘導弾道を最適化。直撃ダメージ: 210→345、ダウン値: 40→120。弾薬数を3発に調整、4秒ごとに1発を回復。\n4.巡遊状態中、【左/右+サブ射撃】の移動軌道を曲線移動に変更し、発射される弾道を最適化。関連数値を調整: ダメージ61→45、ダウン値5→4、ダメージ補正率5→4.8、削り値100→50。この時タツノオトシゴも同一弾丸を発射。\n5.【ガード】の最大維持時間を延長: 40F→60F。新仕様を追加: 防御成功時に一部のブーストおよびスターエネルギーを回復可能となる。\n6.【サブ射撃】の攻撃判定範囲を30%減少。","ocrMode":"manual-image-cleaned","id":"ocr-65ba0038515d"},{"date":"2026-04-15","title":"『星の翼』4月16日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2476","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/3a262646e336e91559b6e2d24247c98f.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"1.巡遊状態の【左/右+サブ射撃】発動時、タツノオトシゴが発射する弾丸が目標を照準しない不具合を修正。","rawText":"1.巡遊状態の【左/右+サブ射撃】発動時、タツノオトシゴが発射する弾丸が目標を照準しない不具合を修正。","ocrMode":"manual-image-cleaned","id":"ocr-0e2913cda8e4"},{"date":"2026-05-27","title":"『星の翼』5月28日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2570","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/6c78cd97e02964e987e790a2156026ec.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"セイレンの巡航状態中の横サブ射撃は、発動時に自分の向きが変わる仕様上、ターゲットに軸を合わせ直すために前ステップに過度に依存せざるを得ない状況にありました。そのため、今回は該当武装の最適化を行いました。\n\n1.巡遊状態の【左/右+サブ射撃】が武装終了間際に【前+ステップ】でキャンセル可能になる。","rawText":"セイレンの巡航状態中の横サブ射撃は、発動時に自分の向きが変わる仕様上、ターゲットに軸を合わせ直すために前ステップに過度に依存せざるを得ない状況にありました。そのため、今回は該当武装の最適化を行いました。\n\n1.巡遊状態の【左/右+サブ射撃】が武装終了間際に【前+ステップ】でキャンセル可能になる。","ocrMode":"manual-image-cleaned","id":"ocr-d816fe9796e0"}],"cost":"3.0","icon":"assets/character-icons-api/セイレン.png","fullbody":""},{"name":"セラフィム","firstDate":"2024-11-29","lastDate":"2025-08-07","articleCount":4,"updateCount":8,"ocrCount":3,"counts":{"balance":0,"fix":5,"add":0,"other":0,"ocr":3},"weapons":["メイン射撃","サブ格闘","前＋メイン格闘","バーストアタック"],"updates":[{"id":"txt-f954d520b1ed","date":"2024-11-29","title":"『星の翼』11月29日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1040","category":"fix","categoryLabel":"不具合修正","text":"シューティングバーストで、弓形態「メイン射撃」を連続で押した際に、弾の発射が間に合わない可能性があるバグを修正"},{"id":"txt-6de827ee7408","date":"2025-03-27","title":"『星の翼』3月27日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1512","category":"fix","categoryLabel":"不具合修正","text":"降臨状態中に「サブ格闘」使用後、「前＋メイン格闘」を発動するとビットが正しく消滅しない不具合を修正"},{"id":"txt-debc63605f56","date":"2025-04-09","title":"『星の翼』4月9日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1536","category":"fix","categoryLabel":"不具合修正","text":"降臨状態中、「バーストアタック」が目標を命中して撃破した場合、メイン射撃のチャージがキャンセルされる不具合を修正"},{"id":"txt-c3c2344f7511","date":"2025-04-09","title":"『星の翼』4月9日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1536","category":"fix","categoryLabel":"不具合修正","text":"降臨状態中、ファイティングバーストを使用した後、「前＋メイン格闘」が射撃武装をキャンセルできない不具合を修正"},{"id":"txt-187b9a819050","date":"2025-08-07","title":"『星の翼』8月7日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1964","category":"fix","categoryLabel":"不具合修正","text":"天賦Vが未解放の場合、降临形態の【メイン射撃】弾薬表示が異常となる不具合を修正"},{"date":"2024-12-11","title":"『星の翼』12月12日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1072","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/6db151c3222d04bc8d84642340c8be84.jpg","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"1.【降臨】状態で【メイン射撃】二段目チャージ時間: 60F→50F。","rawText":"1.【降臨】状態で【メイン射撃】二段目チャージ時間: 60F→50F。","ocrMode":"manual-image-cleaned","id":"ocr-b5947cc22821"},{"date":"2025-03-26","title":"『星の翼』3月27日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1499","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/95fdc2504d5e150fafe56429ed5ebe8e.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"キャラ調整\n1. 降臨状態【メイン射撃】で【後＋サブ格闘】をキャンセルするルートを追加。\n2. 【サブ射撃】で降臨状態中の【後＋サブ格闘】をキャンセルするルートを追加。\n3. 通常状態と降臨状態中の速度を上方修正。\n4. 降臨状態で【前＋メイン格闘】が即時通常状態に変更して攻撃を行うことを追加。\n5. 天賦IIを下方修正。敵の格闘武装を防御する時に効果を発生しない。\n6. 降臨状態での【サブ格闘】が全弾薬状態で使用可能になる。維持時 o?lan=CN&id=2517","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/15994ebe0900101366a47874d5391394.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"タチアナの前格闘およびその派生について、ヒット後の追撃選択肢が不足している点や、チャージ突進中に通常のビーム等で潰されやすく、インファイトでの攻め継続が困難な点を確認しました。これらを改善するため、当該の突進アクションを中心に強化を実施しました。\n\n1.【前方+メイン格闘】及び【サブ射撃+前+メイン格闘】が目標命中後に【サブ格闘】と【メイン射撃派生】でキャンセル可能。\n2.【サブ射撃+前+メイン格闘】のチャージ中に判定を若干縮小し、通常ビーム弾を回避しやすくなる。","rawText":"タチアナの前格闘およびその派生について、ヒット後の追撃選択肢が不足している点や、チャージ突進中に通常のビーム等で潰されやすく、インファイトでの攻め継続が困難な点を確認しました。これらを改善するため、当該の突進アクションを中心に強化を実施しました。\n\n1.【前方+メイン格闘】及び【サブ射撃+前+メイン格闘】が目標命中後に【サブ格闘】と【メイン射撃派生】でキャンセル可能。\n2.【サブ射撃+前+メイン格闘】のチャージ中に判定を若干縮小し、通常ビーム弾を回避しやすくなる。","ocrMode":"manual-image-cleaned","id":"ocr-44fafbadd14a"},{"id":"txt-d258f2f1227e","date":"2026-06-01","title":"『星の翼』6月1日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2592","category":"fix","categoryLabel":"不具合修正","text":"〖後方＋メイン格闘〗：特定条件下でロックを切り替えた際、目標が緑ロック状態でも追従する不具合を修正。"}],"cost":"2.0","icon":"assets/character-icons-api/タチアナ.png","fullbody":""},{"name":"チンニ","firstDate":"2024-11-29","lastDate":"2026-05-06","articleCount":5,"updateCount":11,"ocrCount":5,"counts":{"balance":2,"fix":3,"add":1,"other":0,"ocr":5},"weapons":["後+サブ射撃","後＋サブ射撃","前＋サブ格闘","後＋サブ格闘","サブ格闘"],"updates":[{"id":"txt-e429fbafded8","date":"2024-11-29","title":"『星の翼』11月29日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1040","category":"add","categoryLabel":"追加・販売・募集","text":"ショップ: チンニ・スタンプパックを追加"},{"id":"txt-ffc4d3d6e4be","date":"2024-12-17","title":"『星の翼』12月17日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1090","category":"balance","categoryLabel":"バランス・性能調整","text":"「後+サブ射撃」弾発射時に後退速度が異常になる不具合を修正"},{"id":"txt-6159b6475369","date":"2025-02-25","title":"『星の翼』2月25日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1412","category":"fix","categoryLabel":"不具合修正","text":"「後＋サブ射撃」、「前＋サブ格闘」、「後＋サブ格闘」の必要な弾薬とテキストが正しくない不具合を修正"},{"id":"txt-7a213baad82b"," 干早める。\n4.キャラクタータイプを「中」に変更。","ocrMode":"manual-image-cleaned","id":"ocr-60d04bae894f"},{"id":"txt-c91122266f61","date":"2026-05-29","title":"『星の翼』5月29日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2591","category":"fix","categoryLabel":"不具合修正","text":"〖メイン格闘〗のコンボ終了後も派生技が使用可能であった不具合を修正。"},{"id":"txt-945a48c6f740","date":"2026-06-02","title":"『星の翼』6月2日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2593","category":"fix","categoryLabel":"不具合修正","text":"〖メイン射撃〗が斜面に正対した目標に命中した際、吹き飛ばしが無効になる不具合を修正。"},{"id":"txt-871343520a88","date":"2026-06-05","title":"『星の翼』6月5日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2604","category":"fix","categoryLabel":"不具合修正","text":"〖メイン射撃〗がシューティングバースト発動中に銃口性能が向上してしまう不具合を修正。"},{"id":"txt-4ad753ef4762","date":"2026-06-05","title":"『星の翼』6月5日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2604","category":"fix","categoryLabel":"不具合修正","text":"目標に密着した状態で〖バーストアタック〗を使用した際、相手の〖ガード〗で防がれない不具合を修正。"}],"cost":"2.5","icon":"assets/character-icons-api/デッドマスター.png","fullbody":""},{"name":"デュカリオン","firstDate":"2024-12-11","lastDate":"2026-05-15","articleCount":5,"updateCount":10,"ocrCount":5,"counts":{"balance":1,"fix":3,"add":1,"other":0,"ocr":5},"weapons":["サブ格闘"],"updates":[{"id":"txt-155dae675feb","date":"2025-02-19","title":"『星の翼』2月19日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1401","category":"add","categoryLabel":"追加・販売・募集","text":"デフォルトスキンの翼の表示異常を修正"},{"id":"txt-d47f066f1610","date":"2025-07-18","title":"『星の翼』7月18日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1897","category":"fix","categoryLabel":"不具合修正","text":"ダッシュ: でN（ニュートラル）【サブ格闘】をキャンセルした際、虹ステが発動しない不具合を修正"},{"id":"txt-bc215031a300","date":"2026-03-05","title":"『星の翼』3月5日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2407","category":"fix","categoryLabel":"不具合修正","text":"メイン射撃: のスキル紹介動画が再生されない不具合を修正"},{"id":"txt-c733f34c79 とを確認しました。\n\n戦闘体験をより快適にし、攻撃のリズムを滑らかにするとともに、選択肢を増やすため、一部武装の調整と新たな格闘派生を追加しました。\n\nこれにより、ノーラの主体的な攻撃による脅威とコンボの柔軟性を強化することを目指しています。\n\n1.【メイン射撃】の銃口照準ロジックを最適化し、発生フレームを1F短縮。\n2.【メイン射撃+サブ格闘】発動中に【後方+メイン格闘】によるキャンセル派生ルートを追加。【メイン格闘+サブ格闘】派生チャージ中にスーパーアーマー効果を付与。さらにチャージ攻撃終了後、そのモーションを早期にキャンセル可能。\n4.【メイン射撃+サブ格闘】の突進速度を向上。\n5.新格闘派生【メイン格闘+メイン射撃】を追加: 素早い斬り抜けを一撃発動して目標から離脱。命中時、対象は受け身不可。\n6.【後+メイン格闘】および【後+メイン格闘+メイン射撃】は【ガード】で直接キャンセルできなくなる。","rawText":"現状の環境では、ノーラの攻撃の連続性および制圧力にはさらなる向上の余地があることを確認しました。\n\n戦闘体験をより快適にし、攻撃のリズムを滑らかにするとともに、選択肢を増やすため、一部武装の調整と新たな格闘派生を追加しました。\n\nこれにより、ノーラの主体的な攻撃による脅威とコンボの柔軟性を強化することを目指しています。\n\n1.【メイン射撃】の銃口照準ロジックを最適化し、発生フレームを1F短縮。\n2.【メイン射撃+サブ格闘】発動中に【後方+メイン格闘】によるキャンセル派生ルートを追加。【メイン格闘+サブ格闘】派生チャージ中にスーパーアーマー効果を付与。さらにチャージ攻撃終了後、そのモーションを早期にキャンセル可能。\n4.【メイン射撃+サブ格闘】の突進速度を向上。\n5.新格闘派生【メイン格闘+メイン射撃】を追加: 素早い斬り抜けを一撃発動して目標から離脱。命中時、対象は受け身不可。\n6.【後+メイン格闘】および【後+メイン格闘+メイン射撃】は【ガード】で直接キャンセルできなくなる。","ocrMode":"manual-image-cleaned","id":"ocr-73e3a44c94d7"},{"date":"2026-03-25","title":"『星の翼』3月26日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2433","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/83a74db80820cf95f04f0ed0a614ac41.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"1.【後+メイン格闘】で目標への反撃成功時、【ガード】でキャンセルできない不具合を修正。","rawText":"1.【後+メイン格闘】で目標への反撃成功時、【ガード】でキャンセルできない不具合を修正。","ocrMode":"manual-image-cleaned","id":"ocr-0d0bff5cd42c"},{"id":"txt-82639bc106aa","date":"2026-05-29","title":"『星の翼』5月29日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2591","category":"fix","categoryLabel":"不具合修正","text":"〖左/右＋サブ格闘〗の実際の攻撃判定フレームが以前のバランス調整内容と異なる不具合を修正。現在の攻撃判定フレームは17Fとなる。"},{"id":"txt-0466a59ef095","date":"2026-06-01","title":"『星の翼』6月1日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2592","category":"fix","categoryLabel":"不具合修正","text":"〖左＋サブ格闘〗が至近距離で命中段数とダメージが共に正しくない不具合を修正。"}],"cost":"2.5","icon":"assets/character-icons-api/ノーラ.png","fullbody":""},{"name":"バーゼラルド","firstDate":"2025-06-25","lastD "『星の翼』8月7日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1953","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/f76afd56ee5f0199755601f9540eb75a.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"下方修正\n1. 【サブ射撃】発動中にステップで誘導を切られた場合、5F後に誘導を再取得不可。","rawText":"このたび バーゼラルドの 【サブ射撃】 におい て 性能強化後の誘導取得メカニズムとの相乗効 果により 過栗な優位性が確認されましたため 該当武装の再誘導取得機能を削除させていただき ました。\n1. 【サブ射撃】 発動中にステップで誘導を切られた 場合 5F後に誘導を再取得不可。","ocrMode":"manual-image-cleaned","id":"ocr-3f9f0fa1b6ad","summary":"下方修正 / 1. 【サブ射撃】発動中にステップで誘導を切られた場合、5F後に誘導を再取得不可。"},{"date":"2025-10-29","title":"『星の翼』10月30日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2156","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/9df899b8acb17e0d4b499c0948f0c80f.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"バーゼラルドの【サブ射撃】は、現状の性能が長い発生時間に見合っていないと判断したため、今回武装の性能を上方修正しました。\n\nまた、キャンセルルートの最適化を行い、戦闘中より柔軟に立ち回れるよう改善しています。ただし、一部状況で過剰に強力にならないよう、適切な制限を設けています。\n\n1.【サブ射撃】の弾丸誘導性能を10°/s向上、弾丸の初速を10m/s増加。\n2.【サブ格闘+サブ格闘】による【メイン射撃】連続射撃期間中に、【サブ射撃】、【後+サブ射撃】、【後+メイン格闘】でキャンセル可能なルートを追加。\n3.【サブ格闘】の弾薬リロード時間: 4s→5s。\n4.【サブ格闘+サブ格闘】は【左/右】方向キーとの組み合わせで使用可能となり、対応する方向へ宙返り。\n5.【サブ格闘+サブ格闘】派生の【後+メイン格闘】における水平追従速度: 18m/s→22m/s。","rawText":"バーゼラルドの【サブ射撃】は、現状の性能が長い発生時間に見合っていないと判断したため、今回武装の性能を上方修正しました。\n\nまた、キャンセルルートの最適化を行い、戦闘中より柔軟に立ち回れるよう改善しています。ただし、一部状況で過剰に強力にならないよう、適切な制限を設けています。\n\n1.【サブ射撃】の弾丸誘導性能を10°/s向上、弾丸の初速を10m/s増加。\n2.【サブ格闘+サブ格闘】による【メイン射撃】連続射撃期間中に、【サブ射撃】、【後+サブ射撃】、【後+メイン格闘】でキャンセル可能なルートを追加。\n3.【サブ格闘】の弾薬リロード時間: 4s→5s。\n4.【サブ格闘+サブ格闘】は【左/右】方向キーとの組み合わせで使用可能となり、対応する方向へ宙返り。\n5.【サブ格闘+サブ格闘】派生の【後+メイン格闘】における水平追従速度: 18m/s→22m/s。","ocrMode":"manual-image-cleaned","id":"ocr-aedc6be8184b"},{"date":"2026-03-04","title":"『星の翼』3月5日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2395","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/19c8969ca953f0e0904965a042133035.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"上方修正 のお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2073","category":"balance","categoryLabel":"バランス・性能調整","text":"サブ格闘＋メイン格闘: 派生の硬直吹き飛び距離および高度を低下"},{"id":"txt-36da47a9c19f","date":"2025-09-22","title":"『星の翼』9月22日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2080","category":"fix","categoryLabel":"不具合修正","text":"メイン射撃: が静止目標に命中しない場合がある不具合を修正"},{"id":"txt-cb9abb20a6d7","date":"2025-09-22","title":"『星の翼』9月22日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2080","category":"fix","categoryLabel":"不具合修正","text":"至近距離での【メイン射撃】が目標に命中しない場合がある不具合を修正"},{"id":"txt-438285a36141","date":"2026-03-13","title":"『星の翼』3月13日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2423","category":"fix","categoryLabel":"不具合修正","text":"サブ格闘: が【サブ射撃】でキャンセルされた際、異常に落下する不具合を修正"},{"date":"2025-05-07","title":"『星の翼』5月8日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1641","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/246814068c3c5e776d2e7bececefc4eb.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"1.【後+サブ格闘】の追従速度: 20→25m/s。\n2.特定の距離で【左/右+サブ格闘】を使用すると、ヒット不可になる不具合を修正。","rawText":"1.【後+サブ格闘】の追従速度: 20→25m/s。\n2.特定の距離で【左/右+サブ格闘】を使用すると、ヒット不可になる不具合を修正。","ocrMode":"manual-image-cleaned","id":"ocr-68bcccfeb73f"},{"date":"2025-09-17","title":"『星の翼』9月19日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2061","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/8618b26e8ea556c271282dc0e3877268.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"上方修正\n1. 【メイン射撃】発生: 12F→10F。射撃後の硬直時間を若干増加。弾丸速度: 60m/s→50m/s。反動を軽減し、弾丸発射時の伸縮表現を最適化。\n2. 【サブ射撃】を調整。掴んだ相手は20F経過後も自動回収されず、連続攻撃またはマップ境界に命中するまで飛行を継続。手斧投擲後、再度【サブ射撃】を入力すると非追跡武装を発動し、手斧を回収召喚。手斧回収後、【サブ射撃】がクールタイムに入る。\n3. 【前＋メイン格闘】を調整。巨斧投擲後に回収されない武装終了後も消滅しない。巨斧の前進速度を増加。巨斧の攻撃時間: 10→5F。\n4. 【サブ格闘】/【左右＋サブ格闘】を調整。弾薬消費武装に変更。サブ格闘主弾薬を1発消費し、上限7発。任意【サブ射撃】でキャンセル可能なルートを追加。任意【メイン格闘】でキャンセル可能なルートを削除。【左右＋サブ格闘】攻撃段階の低速速度と持続時間を増加。第1段攻撃を回避された後の回転攻撃段階の転ぶ時間を修正。【左右＋前格闘】攻撃判定範囲を拡大: 2.5m×2.5m→3m×3m。【メイン格闘】入力で派生武装「強勁アッパー」を発動。天罰Ⅱの効果範囲を調整し、攻撃持続時間を延長。\n5. 【メイン格闘＋サブ格闘】第一撃のヒットストップ時間を短縮。\n6. 【後＋サブ格闘】がサブ格闘副弾薬1発消費に変更。上限1発。発生段階への移行時間: 15→10F。着地後に接地効果を付与。","rawText":"パラスは長らく愛用されているキャラクターです が 現在の戦場環境においては その戦術パター ンが比軟的シンプルであり 熟練した相手には行 動を予測されやすい側面があります。\nこのたび パラスの戦い方に新たな深みと可能性 を加えるため 大幅なプレイスタイルの調整を実 施させていただきました。\n今回の調整では: 攻撃面でのバリエーションと威 麻力を強化するとともに 【サブ射撃】 の武器に 独自の回収着地ルートを導入し、 さまざまな武装 発動順序の組み合わせを通じて 持続的な攻撃圧 力を実現できるよう設計を見直しております。\nどうぞ 烈獅に祖われた目標が ドーリアの 「親 しいi投」 を存分に感じ取られることを願ってい ます。\nますぬ\n1. 【メイン射撃】 発生: 12F-10F 射撃後の硬直 時間を若干増加。 弾丸速度: 60m/s-50m/s 反動 を軽減 弾丸発射時の伸縮表現を最適化し。\n2. 【サブ射撃】 を調整:\n投撮した手令は20経過後も自動回収されず 建 築物またはマップ境界に命中するまで飛行を継 続 手祭投撫後 再度 【サブ射撃】 を入力すると 非足止め武装を発動し、 手祭を回収召険。 手祭回収後 【サブ射撃】 がクールタイムに入 る。\n3. 【前+メイン格闘】 を調整:\n巨祭投撫後に回収されない (武装終了後も消滅 しない) 巨祭の前進速度を増加。 巨祭の攻撃間隔: 10→5F。\n巨dの攻撃間隔: 10→5F。\n4. 【サブ格闘】 【左右+サブ格闘】 を調整: 弾薬消費武装に変更: サブ格闘主弾薬を1発消費 上限2発。\n任意 【サブ射撃】 でキャンセル可能なルートを 追加。 任意 【メイン格闘】 でキャンセル可能なル 一トを削除。 【左右+サブ格闘】 攻撃段階の追従速度と持続 時間を増加。 第1段攻撃を回避された後の回転攻撃 段階の表示異常を 修正。 【左右+副格斗】 攻撃類度を調整: 単一目標に 与えるダメージを1回に限定 (目標を吹き飛ばす効 果を付与) 【左右+副格斗】 攻撃判定範囲を拡大: 2.5Mx2.5M-3Mx3M。 【メイン格闘】 入力で派生武装 烈獅アッパ 一」 を発動』 天販立の効果説明を調整: 【左右+サブ格闘】 攻撃持続時間延長。\n攻撃持続時間延長。\n5. 【メイン格闘+サブ格闘】 第一撃のヒットスト ップ時間を短縮。\n6. 【後+サブ格闘】 がサブ格闘副弾薬1発消費に変 更 上限1発。 降下段階への移行時間: 15→10F 着地後に接地効果を付与。","ocrMode":"manual-image-cleaned","id":"ocr-bc77c212818c","summary":"上方修正 / 1. 【メイン射撃】発生: 12F→10F。射撃後の硬直時間を若干増加。弾丸速度: 60m/s→50m/s。反動を軽減し、弾丸発射時の伸縮表現を最適化。 / 2. 【サブ射撃】を調整。掴んだ相手は20F経過後も自動回収されず、連続攻撃またはマップ境界に命中するまで飛行を継続。手斧投擲後、再度【サブ射撃】を入力すると非追跡武装を発動し、手斧を回収召喚。手斧回収後、【サブ射撃】がクールタイムに入る。"},{"date":"2025-10-29","title":"『星の翼』10月30日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2156","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/9df899b8acb17e0d4b499c0948f0c80f.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"前回の調整により、パラスは再び活躍できるようになりますが、一部の状態では予想以上に強力な場面が見受けられたため、性能に一定の制限を設け、バランスを保つ必要があると考えています。\n\n今後も継続的に注視し、必要に応じてさら 旋回速度: 100°/s→70°/s。\n2.通常状態の【左/右+サブ射撃】: 速度曲線を調整。弾丸誘導を低下、弾丸削り値: 50→34。\n3.【左/右+メイン格闘】、【サブ格闘+メイン格闘】、【メイン格闘+サブ格闘派生】のダメージおよびダメージ補正率の構成を調整。一部派生コンボでダメージが異常に高くなる不具合を修正。\n4.【左/右+メイン格闘】の発生フレームを1F増加。ダメージ判定範囲と斬撃エフェクトを小幅縮小。第1撃のダメージ判定範囲: キャラクター周囲→キャラクター正面。\n5.【後+バーストアタック】の光の玉が建造物を貫通し、目標にダメージを与える不具合を修正。\n6.ファイティングバースト状態中に【サブ格闘】の加速効果が異常に重複し、突進速度が過剰になる不具合を修正。","rawText":"現状の環境では、ハルカの一部武装が中近距離で過度な制圧力を発揮しており、対処が非常に困難であることを確認しました。\n\nこれは当初の設計意図とは大きく乖離しています。\n\nそのため、一部武装の性能を下方調整するとともに、特に強力だった横格闘や一部の派生コンボによる過剰なダメージを抑制する対応を行います。\n\nこれにより、通常時の制圧力を低下させ、近距離交戦時に他のキャラクターにも適切な対応手段が生まれることを目指しています。\n\n1.月見草・高出力状態中、【後+サブ射撃】及び【左/右+サブ射撃】の射撃シールドカバー角度: 正面180°→正面120°。\n【後+サブ射撃】の弾丸延伸速度: 150m/s→100m/s。銃口照準旋回速度: 100°/s→70°/s。\n2.通常状態の【左/右+サブ射撃】: 速度曲線を調整。弾丸誘導を低下、弾丸削り値: 50→34。\n3.【左/右+メイン格闘】、【サブ格闘+メイン格闘】、【メイン格闘+サブ格闘派生】のダメージおよびダメージ補正率の構成を調整。一部派生コンボでダメージが異常に高くなる不具合を修正。\n4.【左/右+メイン格闘】の発生フレームを1F増加。ダメージ判定範囲と斬撃エフェクトを小幅縮小。第1撃のダメージ判定範囲: キャラクター周囲→キャラクター正面。\n5.【後+バーストアタック】の光の玉が建造物を貫通し、目標にダメージを与える不具合を修正。\n6.ファイティングバースト状態中に【サブ格闘】の加速効果が異常に重複し、突進速度が過剰になる不具合を修正。","ocrMode":"manual-image-cleaned","id":"ocr-56b1efe667d9"},{"date":"2026-04-15","title":"『星の翼』4月16日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2476","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/3a262646e336e91559b6e2d24247c98f.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"1.【サブ射撃】および【左/右+サブ射撃】の弾丸属性を変更: 実弾→ビーム。","rawText":"1.【サブ射撃】および【左/右+サブ射撃】の弾丸属性を変更: 実弾→ビーム。","ocrMode":"manual-image-cleaned","id":"ocr-820e67d6c027"}],"cost":"2.5","icon":"assets/character-icons-api/ハルカ.png","fullbody":"assets/character-icons/ハルカ.png"},{"name":"ヒカリ","firstDate":"2025-03-05","lastDate":"2026-03-25","articleCount":10,"updateCount":10,"ocrCount":10,"counts":{"balance":0,"fix":0,"add":0,"other":0,"ocr":10},"weapons":["ダッシュ","メイン射撃","サブ射撃","サブ格闘","後+メイン格闘","盛装"],"updates":[{"id":"ocr-hikari-20250305","date":"2025-03-05","title":"『星の翼』3月6日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1456" zyjp.shengtiangames.com/newsInfo?lan=CN&id=2156","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/9df899b8acb17e0d4b499c0948f0c80f.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"ヒカリの【サブ格闘】およびビット関連武装を調整し、他キャラクターの同タイプ武装と挙動をより統一した形としました。これにより、今回の強化で彼女が現バージョンでも再び活躍しやすくなることを期待しています。\n\n1.【サブ格闘】発生期間中にスーパーアーマー効果を付与。ただし、発生期間中はその武装をキャンセルできない。発生期間中にノックダウンされた場合、【盛装】強化効果を与える。\n2.【後+メイン格闘】の射程距離: 50m→120m。\n3.盛装状態で【後+サブ格闘】のビットが個別に誘導判定を計算。各ビットが指定位置に到達する前には回避不可となり、指定位置に到達した後の攻撃準備時間を5F短縮。","rawText":"ヒカリの【サブ格闘】およびビット関連武装を調整し、他キャラクターの同タイプ武装と挙動をより統一した形としました。これにより、今回の強化で彼女が現バージョンでも再び活躍しやすくなることを期待しています。\n\n1.【サブ格闘】発生期間中にスーパーアーマー効果を付与。ただし、発生期間中はその武装をキャンセルできない。発生期間中にノックダウンされた場合、【盛装】強化効果を与える。\n2.【後+メイン格闘】の射程距離: 50m→120m。\n3.盛装状態で【後+サブ格闘】のビットが個別に誘導判定を計算。各ビットが指定位置に到達する前には回避不可となり、指定位置に到達した後の攻撃準備時間を5F短縮。","ocrMode":"manual-image-cleaned"},{"id":"ocr-hikari-20251112","date":"2025-11-12","title":"『星の翼』11月13日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2198","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/a55fdd7965e74b1c5ec4f64e3beacb8c.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"1.盛装状態中に【サブ格闘】の弾薬が不足している場合、【メイン射撃】から【後+サブ格闘】へのキャンセルルートが使用できない不具合を修正。","rawText":"1.盛装状態中に【サブ格闘】の弾薬が不足している場合、【メイン射撃】から【後+サブ格闘】へのキャンセルルートが使用できない不具合を修正。","ocrMode":"manual-image-cleaned"},{"id":"ocr-hikari-20251203","date":"2025-12-03","title":"『星の翼』12月04日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2239","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/6ecc64985c5c319a354fb6df1b630708.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"下方修正\n1. 霊装状態中、【後＋サブ格闘】でヒット展開後の攻撃準備時間をわずかに延長: 8F→11F。","rawText":"現在、ヒカリの性能は予想以上に強力であると判断しております。このため、若干の制限調整を実施し、今後のデータを注視してまいります。\n1.盛装状態中【後+サブ格闘】でビット展開後の攻撃準備時間をわずかに延長: 8F→11F。","ocrMode":"manual-image-cleaned","summary":"下方修正 / 1. 霊装状態中、【後＋サブ格闘】でヒット展開後の攻撃準備時間をわずかに延長: 8F→11F。"},{"id":"ocr-hikari-20260325","date":"2026-03-25","title":"『星の翼』3月26日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2433","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/83a74db80820cf95f04f0ed0a614ac41.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"ヒカリは現在の環境において、戦闘面でやや苦戦している状況が確認されています。\n\nそのため、現環境でも引き続き活躍できるよう、全体的に強化を行っています。\n\nまた、今回の強化によって過度に安定した性能とならないよう、全体的なバランスを踏まえ、耐久値について一部調整を行っています。\n\n1.通常状態のダッシュ機動力を向上させ、盛装状態時のジャンプ機動力を向上させる。\n2.【左/右+サブ射撃】の移動速度を向上させる。\n3.【サブ射撃】の銃口照準性能を若干向上させる。\n4.【サブ格闘】のリロード時間を短縮。盛装状態中の任意の【サブ格闘】がスターバーストによる弾薬補充が可能となる。【サブ格闘】のエフェクトを最適化。\n5.【前+メイン格闘】の発生時間: 7F→6F、追従持続時間: 17F→12F、初期ブースト消費: 0→10。命中後のヒットストップ時間を減少させ、命中後に【メイン射撃】によるキャンセルが可能となる。\n6.HP値: 2886→2830。","rawText":"ヒカリは現在の環境において、戦闘面でやや苦戦している状況が確認されています。\n\nそのため、現環境でも引き続き活躍できるよう、全体的に強化を行っています。\n\nまた、今回の強化によって過度に安定した性能とならないよう、全体的なバランスを踏まえ、耐久値について一部調整を行っています。\n\n1.通常状態のダッシュ機動力を向上させ、盛装状態時のジャンプ機動力を向上させる。\n2.【左/右+サブ射撃】の移動速度を向上させる。\n3.【サブ射撃】の銃口照準性能を若干向上させる。\n4.【サブ格闘】のリロード時間を短縮。盛装状態中の任意の【サブ格闘】がスターバーストによる弾薬補充が可能となる。【サブ格闘】のエフェクトを最適化。\n5.【前+メイン格闘】の発生時間: 7F→6F、追従持続時間: 17F→12F、初期ブースト消費: 0→10。命中後のヒットストップ時間を減少させ、命中後に【メイン射撃】によるキャンセルが可能となる。\n6.HP値: 2886→2830。","ocrMode":"manual-image-cleaned"}],"cost":"3.0"},{"name":"ヒビキ","firstDate":"2025-03-27","lastDate":"2026-06-02","articleCount":9,"updateCount":15,"ocrCount":4,"counts":{"balance":3,"fix":7,"add":1,"other":0,"ocr":4},"weapons":["メイン射撃","左/右+サブ射撃","サブ格闘","左/右 + サブ射撃","派生メイン射撃","後＋メイン格闘","サブ格闘派生メイン格闘","サブ格闘＋メイン射撃"],"updates":[{"id":"txt-8a2ac6307b30","date":"2025-03-27","title":"『星の翼』3月27日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1512","category":"fix","categoryLabel":"不具合修正","text":"「メイン射撃」二段目の音声消失不具合を修正"},{"id":"txt-6508f139110f","date":"2025-03-27","title":"『星の翼』3月27日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1512","category":"fix","categoryLabel":"不具合修正","text":"「左/右+サブ射撃」後に「メイン射撃」シールドを使用すると、エフェクトが消失する不具合を修正"},{"id":"txt-f2e19dc42ae0","date":"2025-03-27","title":"『星の翼』3月27日アップデートのお ":"manual-image-cleaned","id":"ocr-6243dd33bd3c","summary":"上方修正 / 1. 【後＋サブ格闘】を追加。対応方向へジャンプ斬り下ろし。 / 2. 【メイン格闘】のダメージ構成を最適化。ダウン値と補正率を調整し、全体ダメージを向上。"},{"date":"2025-08-06","title":"『星の翼』8月7日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1953","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/f76afd56ee5f0199755601f9540eb75a.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"上方修正\n1. 【ダッシュ】速度を5%向上、持続ブースト消費量を約10%減少、旋回速度を10%増加。","rawText":"現在の戦闘環境では ベータの戦闘での活曜が他 山-こリナパウ\n現仕の戦園境境では ベータの戦園での古雄が他 のキャラクターと比ベてややグえめな順向にあり ました。 今回の調整では ダッシュ時のリソース 消費を緩和し 機動力の強化を図っています。 今 後の活曜にご期待ください。\n1.【ダッシュ】 速度を5%向上 持続ブースト消費 量を約10%減少 旋回速度を10%増加。","ocrMode":"manual-image-cleaned","id":"ocr-6a4739110b51","summary":"上方修正 / 1. 【ダッシュ】速度を5%向上、持続ブースト消費量を約10%減少、旋回速度を10%増加。"},{"date":"2026-03-04","title":"『星の翼』3月5日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2395","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/19c8969ca953f0e0904965a042133035.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"キャラ調整\n1. 【サブ格闘】の振回が命中しなくてもグラウンドに記入される不具合を修正。","rawText":"1. 【サブ格闘】 の1段目が命中しなくてもがアチー ブメントに記入される不具合を修正。","ocrMode":"manual-image-cleaned","id":"ocr-d511938cfd70","summary":"キャラ調整 / 1. 【サブ格闘】の振回が命中しなくてもグラウンドに記入される不具合を修正。"},{"date":"2026-04-15","title":"『星の翼』4月16日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2476","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/3a262646e336e91559b6e2d24247c98f.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"1.【前/後+サブ射撃】を追加: デュカリオンを召喚し、目標に格闘/射撃を行う。スターバースト発動中は1回限定の援護に変化し、十八号を召喚して目標に格闘/射撃を行う。本武装は【メイン射撃】でキャンセル不可。\n2.【後+サブ格闘】の誘導性能および着地距離を向上させ、ブースト消費を減少。","rawText":"1.【前/後+サブ射撃】を追加: デュカリオンを召喚し、目標に格闘/射撃を行う。スターバースト発動中は1回限定の援護に変化し、十八号を召喚して目標に格闘/射撃を行う。本武装は【メイン射撃】でキャンセル不可。\n2.【後+サブ格闘】の誘導性能および着地距離を向上させ、ブースト消費を減少。","ocrMode":"manual-image-cleaned","id":"ocr-bc0a59c371ee"},{"date":"2026-05-06","title":"『星の翼』5月7日キャラク 2429","category":"fix","categoryLabel":"不具合修正","text":"メイン射撃: 及び【サブ射撃】が地形に背向けた際、弾丸が地形で相殺される不具合を修正"},{"id":"txt-b2ea7bf04ebb","date":"2026-04-21","title":"『星の翼』4月21日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2504","category":"fix","categoryLabel":"不具合修正","text":"メイン格闘派生サブ射撃: のコンボ中に目標を撃破した際、目標がダウンしない不具合を修正"},{"date":"2025-07-16","title":"『星の翼』7月17日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1881","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/476995e1ccc5464afbadefad0c057f13.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"キャラ調整\n1. 【サブ格闘】ジャンプと格闘追従の速度を20%増加。\n2. 【前＋メイン格闘】攻撃の発生時間を増加: 5F→10F。追従初速度を調整: 19m/s→15m/s。\n3. 【前＋メイン格闘】1段目の攻撃判定長さを1m縮小、2段目の攻撃判定長さを2m縮小。さらに2段目射撃開始前の照準速度を50%低下。","rawText":"ボルゾイの前格闘について 近距離において過度 に優位性を発揮する状態が確認されたため その 性能に一定の制限を加えました。 射撃武装の特徴 である射撃判定は維持しております。 その代わり に サブ格闘武装を強化し、 接近戦および先手を 取るための手段としての役割を強化しておりま す。\n1.【サブ格闘】 ジャンプと格闘追従の速度を20%増 加\n2.【前+メイン格闘】 攻撃の発生時間を増加: 5Fっ10F 追従初速度を調整: 1gm/s-15m/so\n3.【前+メイン格闘】 1段目の攻撃判定長さを1m縮 2段目の攻撃判定長さを乙m縮小 さらに2段目 射撃開始前の照準速度を50%低下。\nり」リ 5 T\n現行バージョンのステップにおいて 初速度が持 続判定を持つ武装を十分に回避しにくい状態が確 認されました。 そのため 移動距離を維持しつつ 速度曲線を最適化し、 部の武装に対してより通 速に回避できるよう調整を行っております。\n1.【ステップ】 の速度曲線を調整。 初速度を上昇さ せ 減速がより早くなるよう変更。","ocrMode":"manual-image-cleaned","id":"ocr-0b22d57a16ad","summary":"キャラ調整 / 1. 【サブ格闘】ジャンプと格闘追従の速度を20%増加。 / 2. 【前＋メイン格闘】攻撃の発生時間を増加: 5F→10F。追従初速度を調整: 19m/s→15m/s。"},{"date":"2025-08-06","title":"『星の翼』8月7日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1953","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/f76afd56ee5f0199755601f9540eb75a.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"下方修正\n1. 【サブ格闘】ジャンプ時の水平方向初速: 13m/s→10m/s。\n2. 【メイン射撃】弾丸誘導: 60→45°/s。","rawText":"前回のサブ格闘強化後 優れた射撃性能と機動力 との相乗効果により 中近距離での圧倒的な戦闘 能力が確認されました。 つきましては ゲームバ ランスを維持するため 下記の通り適正化調整を 実施いたしました。\n1.【サブ格闘】 ジャンプ時の水平方向初速: 13m/s-10m/s\n2.【メイン射撃】 弾丸誘導: 60-459/5。","ocrMode":"manual-image-cleaned","id":"ocr-4dd9ca46f829","summary":"下方修正 / 1. 【サブ格闘】ジャンプ時の水平方向初速: 13m/s→10m/s。 / 2. 【メイン射撃】弾丸誘導: 60→45°/s。"},{"date":"2025-08-27","title":"『星の翼』8月27日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1992","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/e2bf6977a13c920fb1e33c704c95857b.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"コンテンツ調整\n1. 【サブ格闘】連携ヒット時に速度が上昇する仕様を削除。\n2. 【メイン射撃】の連射時の最小間隔: 7F→5F。","rawText":"ボルゾイは 【サブ格闘】 を連続して命中させた際 に加速が発生し、 その結果カット耐性が過剰に強 化されるとともに 過度な加速により攻撃が空振 りしやすくなる状態が確認されました。\nりしやすくなる状態が確認されました。\nそのため この加速設定を削除し、 その代わりに 【メイン射撃】 の連射性能をわずかに向上させる 調整をいたしました。\n1. 【サブ格闘】 連続ヒット時に速度が上昇する仕様 を削除。\n2.【メイン射撃】 の連射時の最小間隔: 7Fっ5F。","ocrMode":"manual-image-cleaned","id":"ocr-c57c93fcd0f7","summary":"コンテンツ調整 / 1. 【サブ格闘】連携ヒット時に速度が上昇する仕様を削除。 / 2. 【メイン射撃】の連射時の最小間隔: 7F→5F。"},{"date":"2025-10-29","title":"『星の翼』10月30日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2156","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/9df899b8acb17e0d4b499c0948f0c80f.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"ボルゾイの【サブ格闘】は、現状ではダメージ効率が低めであることが見受けられました。そのため、該当武装を強化するとともに、攻撃をいつでも終了できる仕様に変更しました。\n\nまた、派生武装についてもあわせて強化しました。\n\n1.シューティングバースト発動中に【メイン射撃】の連続射撃の速度が低下する不具合を修正。\n2.【サブ格闘】が連続で目標に命中すると、移動速度が大幅に向上し、サブ格闘の攻撃回数が1回追加。さらに、任意のタイミングで【メイン格闘】を入力することで直接目標を撃破する。\n3.【メイン格闘+サブ射撃】派生ダメージを向上。","rawText":"ボルゾイの【サブ格闘】は、現状ではダメージ効率が低めであることが見受けられました。そのため、該当武装を強化するとともに、攻撃をいつでも終了できる仕様に変更しました。\n\nまた、派生武装についてもあわせて強化しました。\n\n1.シューティングバースト発動中に【メイン射撃】の連続射撃の速度が低下する不具合を修正。\n2.【サブ格闘】が連続で目標に命中すると、移動速度が大幅に向上し、サブ格闘の攻撃回数が1回追加。さらに、任意のタイミングで【メイン格闘】を入力することで直接目標を撃破する。\n3.【メイン格闘+サブ射撃】派生ダメージを向上。","ocrMode":"manual-image-cleaned","id":"ocr-2ede35ef291a"},{"date":"2026-04-15","title":"『星の翼』4月16日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2476","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/3a262646e336e91559b6e2d24247c98f.png","imageIndex":0,"category":"ocr","categoryLab ,"text":"1.【メイン射撃】の弾丸誘導性能が時間経過で減衰するように変更、20°/秒から徐々に10°/秒になる。\n\n2.【スターバースト】期間中、【メイン射撃】の弾丸速度: 50m/s→42m/s。","rawText":"1.【メイン射撃】の弾丸誘導性能が時間経過で減衰するように変更、20°/秒から徐々に10°/秒になる。\n\n2.【スターバースト】期間中、【メイン射撃】の弾丸速度: 50m/s→42m/s。","ocrMode":"manual-image-cleaned","id":"ocr-ca659d7e752a"},{"date":"2025-08-27","title":"『星の翼』8月27日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1992","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/e2bf6977a13c920fb1e33c704c95857b.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"上方修正\n1. 【サブ射撃】弾速: 60m/s→70m/s。","rawText":"ラインのサブ射撃は その幅の広さにおいて優れ た特性をありましたが 12Fという発生時間に対し て 弾速と誘導性能がやや見合っておらず 効果 を発揮しづらい場面が見られました。\nつきましては このたび弾速を僅かに向上させる 調整を施し、 その特性をより活かせるよう改善い たしました。\n1. 【サブ射撃】 弾速: 60m/s-70m/so","ocrMode":"manual-image-cleaned","id":"ocr-18eee3db1a6c","summary":"上方修正 / 1. 【サブ射撃】弾速: 60m/s→70m/s。"},{"date":"2026-01-14","title":"『星の翼』1月15日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2332","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/0cc0d21f14c7da9c101732a00f80c8f2.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"上方修正\n1. 【サブ格闘】で発射される弾丸を、2発の大型低速ミサイルに変更。ミサイルの移動速度は低いものの、誘導性能および攻撃判定を強化。命中時には小型の球状爆風を発生させ、敵を吹き飛ばす。\n2. 【後＋サブ射撃】の発生中、銃口照準性能を向上。あわせて、左右両側の細ビームの延伸速度: 100m/s→75m/s。","rawText":"現在の環境では ラインの 【サブ格闘】 は実戦に おける脅威度や存在感がややグえめであり また 【後+サブ射撃】 についても 操作感やリスクと リターンの面で改善の余地があると判断しまし た。\nそこで 高火力や特定エリアでの制圧力といった 彼女の特徴をより際立たせるため 関連する武装 に強化調整を行います。 これにより、 武装同士の 組み合わせがより実用的になることを目指してい ます。\nなお 今後も実戦での使用状態を継続的に確認し ていきます。\n1. 【サブ格闘】 で発射される弾丸を 2発の大型低 速ミサイルに変更。 ミサイルの移動速度は低いも 語道性能おトフドケケ軽判完左改似 令中時に\n迷二リイルル父史。 ニリイルリ修里や安は八いも のの 誘導性能および攻撃判定を強化 命中時に は小型の球状爆風を発生させ 敵を吹き飛ばす。\n2.【後+サブ射撃】 の発生中 銃口照準性能を向 上 あわせて 左右両側の細ビームの延伸速度: 100m/s つ 75m/s。\n薫雷改\n韓雷改の 【サブ射撃+メイン射撃】 は: 主要な制 圧手段として機能していますが 激しい弾幕戦で は消莉されやすく 火力を安定して発揮しづらい 状態が見受けられました。\nそこで 該当武装の性能を強化する調整を行いま した。\n1. 【サブ射撃+メイン射撃】 の弾丸を強実弾に変 更 他の弾丸と相殺されないよう調整。\n2.【バーストアタック】最終段が遠距離の目標を 強制的に引き寄せてしまう不具合を修正。\n1A 0」 U s T","oc fb1e33c704c95857b.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"上方修正\n1. 【左右＋サブ格闘】ヒットストップ仕様を削除: 3F→0F。格闘追従速度: 18m/s→20m/s。","rawText":"直近のデータと実戦を分析した結果 中距離~近 距離において十分な脅威を発揮できていないと判 断いたしました。\nこれを踏まえ 中距離~近距離での優位性を高め るため 突進能力の性能を最適化しました。 な お 今回の調整後も ラジエルの対戦を注視し 分析してまいります。\n1. 【左右+サブ格闘】 ヒットストップ仕様を削除: 3Fっ0F 格闘追従速度: 18m/s-20m/s","ocrMode":"manual-image-cleaned","id":"ocr-5f4fc7f6ee87","summary":"上方修正 / 1. 【左右＋サブ格闘】ヒットストップ仕様を削除: 3F→0F。格闘追従速度: 18m/s→20m/s。"},{"date":"2025-10-29","title":"『星の翼』10月30日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2156","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/9df899b8acb17e0d4b499c0948f0c80f.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"他の格闘キャラクターと比べると、ラジエルは与ダメージがやや低めで、戦闘で力を発揮しきれない場面がありました。\n\nそのため、与ダメージを上方修正するとともに、一部武装の操作感も改善する調整を行いました。\n\n1.【メイン格闘】、【左/右+メイン格闘】、【メイン格闘派生メイン射撃】、【メイン格闘派生サブ射撃】、【メイン格闘派生サブ格闘】の全体的なダメージを上方調整。\n2.【サブ格闘】発動中に【サブ格闘】と【メイン射撃】を同時入力して発動する三連射が、下切りの慣性を保存する不具合を修正。\n3.【メイン格闘派生サブ格闘】のコンボ速度をわずかに向上。\n4.【左/右+サブ格闘】ダメージ補正率: 30%→20%。さらに、初期ブースト消費量が正しくない不具合を修正。","rawText":"他の格闘キャラクターと比べると、ラジエルは与ダメージがやや低めで、戦闘で力を発揮しきれない場面がありました。\n\nそのため、与ダメージを上方修正するとともに、一部武装の操作感も改善する調整を行いました。\n\n1.【メイン格闘】、【左/右+メイン格闘】、【メイン格闘派生メイン射撃】、【メイン格闘派生サブ射撃】、【メイン格闘派生サブ格闘】の全体的なダメージを上方調整。\n2.【サブ格闘】発動中に【サブ格闘】と【メイン射撃】を同時入力して発動する三連射が、下切りの慣性を保存する不具合を修正。\n3.【メイン格闘派生サブ格闘】のコンボ速度をわずかに向上。\n4.【左/右+サブ格闘】ダメージ補正率: 30%→20%。さらに、初期ブースト消費量が正しくない不具合を修正。","ocrMode":"manual-image-cleaned","id":"ocr-9ebb43ed9766"},{"date":"2025-12-03","title":"『星の翼』12月04日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2239","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/6ecc64985c5c319a354fb6df1b630708.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"キャラ調整\n1. 【後＋サブ射撃】のビット飛行中に【後＋メイン格闘】を使用した際、ビットの発進方向の照準が正常に機能しない問題を修正。【後＋メイン格闘】発生時の照準性能を最適化。","rawText":"1.【後+サブ射撃】 のビット飛行中に 【後+メイン 格闘】 を使用した際 ビットの突進方向の照準が 正常に機能しない問題を修正 【後+メイン格 闘】 発生時の照準性能を最適化","ocrMode":"m 撃】: 2発目ダメージ補正率: 15%→20%。3発目ダメージ: 270→306。補正率: 20%→40%。総合ダメージを低下。\n2. 【バーストアタック】ダメージ減衰を調整。補正率と総合ダメージがやや増加。コンボ1ヒットあたりのダメージ: 15→24。","rawText":"ランスロットの 【左右+サブ射撃】 は: 優れた移 動能力と高い火力輸出を兼ね備えた三連射武装と して設計されております。 今回 その総合的な性 能バランスを適正化するため 各段階のダメージ 構成について適切な調整を実施させていただきま した。 特に 「大車輪」 区間のダメージを強化することに より より団速なダメージ生効を実現するととも に、 空中でより顕着な戦術的優位性を得ていただ けるよう調整いたしました。\n1.【左右+サブ射撃】 1 ・2発目ダメージ補正率: 159→20% 3発目ダメージ: 270-306 補正率; 209-409。 総合ダメージを低下。\n2.【バーストアタック】ダメージ構成を調整 補正 率と総合ダメージがやや増加 コンボ1ヒットあた りのダメージ: 15-24。","ocrMode":"manual-image-cleaned","id":"ocr-53051ee80714","summary":"キャラ調整 / 1. 【左右＋サブ射撃】: 2発目ダメージ補正率: 15%→20%。3発目ダメージ: 270→306。補正率: 20%→40%。総合ダメージを低下。 / 2. 【バーストアタック】ダメージ減衰を調整。補正率と総合ダメージがやや増加。コンボ1ヒットあたりのダメージ: 15→24。"},{"date":"2025-11-12","title":"『星の翼』11月13日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2198","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/a55fdd7965e74b1c5ec4f64e3beacb8c.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"1.【左/右+サブ格闘】発動中に【後+メイン格闘】のジャンプ斬りの落下瞬間に方向転換し、ステルス状態の目標を無視する不具合を修正。","rawText":"1.【左/右+サブ格闘】発動中に【後+メイン格闘】のジャンプ斬りの落下瞬間に方向転換し、ステルス状態の目標を無視する不具合を修正。","ocrMode":"manual-image-cleaned","id":"ocr-b3b373cbc3e9"},{"date":"2025-12-24","title":"『星の翼』12月25日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2285","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/67e20c9d79e86f69572c319fc3b601d8.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"1.【サブ射撃】の弾丸生成時に2Fの遅追加延が発生する不具合を修正。\n\n2.【サブ射撃】の垂直照準時間が発生時間よりも短い不具合を修正。","rawText":"1.【サブ射撃】の弾丸生成時に2Fの遅追加延が発生する不具合を修正。\n\n2.【サブ射撃】の垂直照準時間が発生時間よりも短い不具合を修正。","ocrMode":"manual-image-cleaned","id":"ocr-3f8793b157a1"},{"date":"2026-05-06","title":"『星の翼』5月7日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2517","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/15994ebe0900101366a47874d5391394.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"1.【メイン射撃】のダメージ判定 "category":"ocr","categoryLabel":"上方・下方調整","text":"1.【前+サブ格闘】: その場で停止する5Fの制限を撤廃。突進時間: 20F→25F。【サブ射撃】、【後+サブ射撃】へのキャンセルルートを追加。\n2.【後+サブ射撃】の上下射撃角度制限: 30°→60°。\n3.【メイン射撃】: 【サブ射撃】、【後+サブ射撃】によるキャンセルルートを追加。\n4.解放状態で【メイン格闘】最終段の剣気・【格闘派生】最終段の爆発・【サブ格闘】最終段の地火ダメージ属性: 射撃→格闘。\n5.【左/右+サブ格闘】: 緑ロック状態および未命中時におけるキャンセルルート無効制限を撤廃。解放状態中の緑ロック移動速度: 30m/s→25m/s。\n6.解放状態での【サブ格闘】: 誘導性能および着地距離を向上。ブースト消費を増加。地火が地面から空中へ傾斜して発生する不具合を修正。\n7.【バーストアタック】: 武装終了時に自動で解放状態へ移行。武装が未命中の場合、追加で10Fのモーション後隙時間が発生する。","rawText":"1.【前+サブ格闘】: その場で停止する5Fの制限を撤廃。突進時間: 20F→25F。【サブ射撃】、【後+サブ射撃】へのキャンセルルートを追加。\n2.【後+サブ射撃】の上下射撃角度制限: 30°→60°。\n3.【メイン射撃】: 【サブ射撃】、【後+サブ射撃】によるキャンセルルートを追加。\n4.解放状態で【メイン格闘】最終段の剣気・【格闘派生】最終段の爆発・【サブ格闘】最終段の地火ダメージ属性: 射撃→格闘。\n5.【左/右+サブ格闘】: 緑ロック状態および未命中時におけるキャンセルルート無効制限を撤廃。解放状態中の緑ロック移動速度: 30m/s→25m/s。\n6.解放状態での【サブ格闘】: 誘導性能および着地距離を向上。ブースト消費を増加。地火が地面から空中へ傾斜して発生する不具合を修正。\n7.【バーストアタック】: 武装終了時に自動で解放状態へ移行。武装が未命中の場合、追加で10Fのモーション後隙時間が発生する。","ocrMode":"manual-image-cleaned","id":"ocr-609ac2b3cf1e"},{"date":"2026-05-27","title":"『星の翼』5月28日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2570","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/6c78cd97e02964e987e790a2156026ec.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"ローランドは、武装全体の操作感やコンボの繋がりにおいて、まだ改善の余地が見られました。そのため、今回は様々な状況下における武装モーションおよびキャンセルルートの最適化を行い、同時に武装の基礎性能をわずかに引き上げました。\n\n1.解放状態中の【サブ格闘】下斬りが目標命中後に【サブ格闘派生】/【サブ射撃派生】が発動可能。地火ダメージ発生時の追加5F遅延を削除。\n2.【メイン格闘+サブ格闘派生】の第1撃ダウン値: 20→0。被撃硬直を変更: ノックバック→スタン。【メイン格闘+サブ射撃派生】の第2撃ダウン値: 10→0。\n3.【サブ射撃】の弾速: 30m/s→45m/s。水平・垂直誘導: 20°/s→30°/s。\n4.【前+メイン格闘】通常状態の追従時間: 3F→19F。解放状態の追従時間: 8F→19F。追従速度: 20m/s→15m/s。\n5.解放状態中の【メイン格闘】及び【左/右+メイン格闘】格闘派生へのキャンセル可能フレームを大幅に前倒し。最終撃のモーションを斬り抜けに変更し、カメラ演出を調整。\n6.【メイン格闘+サブ格闘派生】のモーションを斬り抜けに変更し、カメラ演出を調整。\n7.解放状態の【サブ格闘】下斬り発動前5Fで速度が急に低下する不具合を修正。","rawText":"ローランドは、武装全体の操作感やコンボの繋がりにおいて、まだ改善の余地が見られました。そのため、今回は様々な状況下における武装モーションおよびキャンセルルートの最適化を行い、同時に武装の基礎性能をわずかに引き上げました。\n\n1.解放状態中の【サブ格闘】下斬りが目標命中後に【サブ格闘派生】/【サブ射撃派生】が発動可能。地火ダメージ発生時の追加5F遅延を削除。\n2.【メイン格闘+サブ格闘派生】の第1撃ダウン値: 20→0。被撃硬直を変更: ノックバック→スタン。【メイン格闘+サブ射撃派生】の第2撃ダウン値: 10→0。\n3.【サブ射撃】の弾速: 30m/s→45m/s。水平・垂直誘導: 20°/s→30°/s。\n4.【前+メイン格闘】通常状態の追従時間: 3F→19F。解放状態の追従時間: 8F→19F。追従速度: 20m/s→15m/s。\n5.解放状態中の【メイン格闘】及び【左/右+メイン格闘】格闘派生へのキャンセル可能フレームを大幅に前倒し。最終撃のモーションを斬り抜けに変更し、カメラ演出を調整。\n6.【メイン格闘+サブ格闘派生】のモーションを斬り抜けに変更し、カメラ演出を調整。\n7.解放状態の【サブ格闘】下斬り発動前5Fで速度が急に低下する不具合を修正。","ocrMode":"manual-image-cleaned","id":"ocr-c097993c3406"},{"id":"txt-741e4f1a97e5","date":"2026-06-09","title":"『星の翼』6月9日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2617","category":"fix","categoryLabel":"不具合修正","text":"スキン「異邦の傭兵」「機動特勤」着用時、解放状態の〖後＋サブ射撃〗弾丸異常を修正。"}],"cost":"1.5","icon":"assets/character-icons-api/ローランド.png","fullbody":""},{"name":"ロタ","firstDate":"2025-02-13","lastDate":"2026-05-20","articleCount":9,"updateCount":18,"ocrCount":3,"counts":{"balance":5,"fix":8,"add":2,"other":0,"ocr":3},"weapons":["後+メイン格闘","サブ格闘","サブ射撃","左/右+サブ射撃","サブ格闘派生メイン射撃","ステップ","前/後/左/右+サブ格闘","前＋メイン格闘","後＋メイン格闘","左/右＋メイン格闘"],"updates":[{"id":"txt-90d3ed62e2b0","date":"2025-02-13","title":"『星の翼』2月13日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1387","category":"fix","categoryLabel":"不具合修正","text":"キャラクター選択画面でスカートがモデルを突き抜ける不具合を修正"},{"id":"txt-db6f070698c9","date":"2025-02-13","title":"『星の翼』2月13日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1387","category":"balance","categoryLabel":"バランス・性能調整","text":"「後+メイン格闘」で発生する遮断網が水平な地面で傾く不具合を修正"},{"id":"txt-50980b3f8999","date":"2025-02-13","title":"『星の翼』2月13日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1387","category":"balance","categoryLabel":"バランス・性能調整","text":"1v1対戦時にキャラクターを切り替えると、「サブ格闘」の弾薬がリロードされない不具合を修正"},{"id":"txt-27458693e7aa","date":"2025-02-13","title":"『星の翼』2月13日アップデートのお知らせ","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1387","category":"add","categoryLabel":"追加・販売・募集","text":"装飾画面で身体スキンを切り替えた際、耳の色が正しく反映されない不具合を修正"},{"id":"txt-16781368c37d","date":"2025-02-17","title":  【後+サブ射撃】 の攻撃判定幅: 2MxZMっ 1.5Mx1.SM。\n4.ビットの弾薬消費をは廃。 ビット展開中に再度 武装発動時 強制召回して即座に再展開を行うよ うに変更。\n古手トトA\nまた ビットの方向キ一連動性能について 下記 の通り調整を実施いたします:\n一段目追従時の移動速度: 30m/s-25m/s 目標包囲角度を調整 (目標の両側から包囲する 形に近似) 攻撃持続時間: 30F-15F。\n5. 【後+メイン格闘】 の位移開始時に弾薬が消費 されない不具合を修正。\n6.ファイティングバースト発動中 【サブ射撃】 期間中に 【後+メイン格闘】 を入力すると 【メイ ン格闘】 が発動する不具合を修正。","ocrMode":"manual-image-cleaned","id":"ocr-71355e87087d","summary":"下方修正 / 1. N【サブ格闘】弾丸起伸速度: 160m/s→130m/s。 / 2. 【後＋サブ格闘】弾丸起伸速度: 130m/s→110m/s。"},{"date":"2025-10-29","title":"『星の翼』10月30日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2156","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/9df899b8acb17e0d4b499c0948f0c80f.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"1.スターバースト中に【サブ格闘】のドラッグ効果: 直線→曲線。","rawText":"1.スターバースト中に【サブ格闘】のドラッグ効果: 直線→曲線。","ocrMode":"manual-image-cleaned","id":"ocr-a67ef8c15695"},{"date":"2026-01-14","title":"『星の翼』1月15日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2332","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/0cc0d21f14c7da9c101732a00f80c8f2.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"下方修正\n1. 【サブ射撃】の弾丸判定範囲: 1.5×1.5m→1×1m。\n2. 【左/右＋サブ射撃】をオーバーヒート状態で使用した場合、移動距離が大幅に低下するよう調整。","rawText":"現在の環境では: 「ロンギヌス」 ベータの 【サブ 射撃】 およびその派生武装が 中一近距離で安定 しすぎる広範囲の抑制力を持っており リソース 管理の面でもリスクヤコストがナ分に反映されて いませんでした。 さらに リソースが尽きた状態 でも、 特定の操作で高い機動力を発揮できる状態 が確認されています。\nそこで 対戦における戦略性を向上させるため これらの武装について調整を行うことにしまし た。\n1. 【サブ射撃】 の弾丸判定範囲: 1.5x1.5m つ 1x1m\n2.【左+サブ射撃】 をオーバーヒート状態で使 用した場合 移動距離が大幅に低下するよう調 整","ocrMode":"manual-image-cleaned","id":"ocr-12ae610399d8","summary":"下方修正 / 1. 【サブ射撃】の弾丸判定範囲: 1.5×1.5m→1×1m。 / 2. 【左/右＋サブ射撃】をオーバーヒート状態で使用した場合、移動距離が大幅に低下するよう調整。"}],"cost":"3.0","icon":"assets/character-icons-api/ロンギヌス‐ベータ.png","fullbody":""},{"name":"稲","firstDate":"2025-05-15","lastDate":"2026-04-15","articleCount":9,"updateCount":23,"ocrCount":7,"counts":{"balance":4,"fix":10,"add":2,"other":0,"ocr":7},"weapons":["ガード","後+メイン射撃","バースト 調整","text":"任意【メイン格闘】で【サブ格闘】影分身を発動した際の追従時間: 18F→30F、ダメージタイプ: ビーム→格闘。","rawText":"任意【メイン格闘】で【サブ格闘】影分身を発動した際の追従時間: 18F→30F、ダメージタイプ: ビーム→格闘。","ocrMode":"manual-image-cleaned","id":"ocr-e2b45c96ab14"},{"date":"2025-03-26","title":"『星の翼』3月27日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1499","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/95fdc2504d5e150fafe56429ed5ebe8e.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"上方修正\n1. 【サブ格闘＋メイン射撃】派生のナイフ弾速: 30m/s→40m/s。爆発半径: 3m→5m。\n2. 【サブ射撃】速度慣性引継時間: 2F→10F。発生時の照準時間: 2F→5F。","rawText":"1. 「サブ格闘+ メイン射撃」 派生のナイフ弾速: 30m/s-40m/s 爆発半径: 3mっ5m\n2.「サブ射撃」 速度慣性引継時間: 2Fっ10F 発生 時の照準時間: 2F-5F。","ocrMode":"manual-image-cleaned","id":"ocr-81e3e014323d","summary":"上方修正 / 1. 【サブ格闘＋メイン射撃】派生のナイフ弾速: 30m/s→40m/s。爆発半径: 3m→5m。 / 2. 【サブ射撃】速度慣性引継時間: 2F→10F。発生時の照準時間: 2F→5F。"},{"date":"2025-08-27","title":"『星の翼』8月27日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1992","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/e2bf6977a13c920fb1e33c704c95857b.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"上方修正\n1. 落下状態に入る際に継続できる最大水平速度: 14m/s→16m/s。\n2. 【メイン射撃】を調整。誘導なしの直線弾に変更。水平方向の判定: 0.5m→0.7m。左右の投げナイフ間の角度: 20°→15°。飛行時間: 1.5s→0.75s。\n3. 【サブ格闘＋メイン射撃】を調整。方向入力なしは後方に3枚の爆弾ナイフを投擲、前/後方向入力は縦方向に3枚、左/右方向入力は誘導角度を増加: 26°/s→40°/s。ナイフの飛行速度を低下: 40m/s→30m/s。爆弾判定を拡大: 半径4m→5.5m。爆発持続時間を延長: 0.6s→1.2s。弾薬リロード時間: 4s→7s。ナイフがシールドに命中した場合も爆発が発生。\n4. 【サブ格闘】の弾薬制限を撤廃し、ゲージ消費を追加。武装の仕様を調整し、影分身は同時に最大3体まで出現可能。影分身は建物に阻まれ、射撃攻撃によって破壊される。影分身が存在する場合、射撃攻撃は影分身の格闘攻撃を、格闘攻撃は影分身の射撃攻撃を誘発。\n5. 【バーストアタック】を調整。構えモーション中はステップによる誘導切りが不可になり、構え中の硬直をステップ可能に変更。初段の硬直に拾い効果を追加。ダメージ配分を調整。無終段のダメージを増加し、中段弾のダメージを減少。影ダメージ率は概ね変化なし。天賦の特殊バースト技を発動した際、最終段のダメージはダメージ補正を無視するよう変更。\n6. 【メイン格闘＋サブ格闘】の派生はステップ効果を削除し、モーション中は他の武装でキャンセル不可に変更。\n7. 【後＋メイン格闘】の調整。対照の水平方向判定を拡大: 0.9m→2.1m。垂直誘導を強化: 26°/s→40°/s。自身の後方移動速度を低下。\n8. 【サブ射撃】の調整。発生時間を延長: 5F→10F。【左/右＋サブ射撃】の移動方向を斜め前方に変更。\n9. 【前＋メイン格闘】の調整。ダッシュ中に使用した場合、モーションが変化し性能が強化されるよう変更。
