に解除されない不具合を修正。","rawText":"無銘の武装性能を調整し、 全体的な戦闘体験を最 適化するため 以下のバランス調整を行うことに いたしました\n具体的には: 強力すぎる攻撃武装の性能を一部下 方修正するとともに その他の弱点を補う調整を 実施します。 また 無銘の特徴である 「鬼尾」 武 装の使用度を向上させることで よりバランス の取れたキャラクター体験を提供することを目指 します。\n1. 【サブ格闘+前+ メイン格闘】 の初速度: 20122m/s つ 18/18m/s。 攻撃判定を縮小。\n2基確HP値: 2800-2875。\n3. 【鬼尾】 発射後の帰還速度を向上。\n4. 【後+メイン格闘】 最終段のダウン硬を調 整。 妹刀状態で 【メイン格闘派生後+メイン格 闘】 最終段のダウン硬直を最適化。\n5. 【バーストアタック】 4段目のダメージが異常 となる不具合を修正。\n6.【奴刀】 状態中の出血速度を低下。\n7.スターバースト直後に即座に 【後+バーストア タック】 を使用した場合 強化状態が完全に解除 されない不具合を修正。","ocrMode":"manual-image-cleaned","id":"ocr-ebee98ae0020","summary":"キャラ調整 / 1. 【サブ格闘＋メイン格闘】の初速度: 20/22m/s→18/18m/s。攻撃判定を縮小。 / 2. 基礎HP値: 2800→2875。"},{"date":"2026-03-25","title":"『星の翼』3月26日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2433","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/83a74db80820cf95f04f0ed0a614ac41.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"現在の環境では、無銘は攻めに転じた際の性能がやや高い水準にあることが確認されています。\n\n現状を踏まえ、攻撃面について一定の調整を行っています。\n\n今回の調整では、無銘の戦闘スタイルを損なわない範囲で、全体的なバランスの調整を図っています。\n\n今後も本調整による影響を注視しつつ、必要に応じて調整を検討していきます。\n\n1.妖刀状態中、【サブ格闘+メイン射撃】の攻撃判定範囲を縮小。\n2.妖刀状態中、ダッシュ速度を低下させ、ダッシュの初期ブースト消費を通常状態と同一に増加。\n3.全ての状態中における【サブ格闘+前+メイン格闘】の突進速度: 18m/s→17m/s。\n4.【サブ格闘】リロード時間: 12s→15s。","rawText":"現在の環境では、無銘は攻めに転じた際の性能がやや高い水準にあることが確認されています。\n\n現状を踏まえ、攻撃面について一定の調整を行っています。\n\n今回の調整では、無銘の戦闘スタイルを損なわない範囲で、全体的なバランスの調整を図っています。\n\n今後も本調整による影響を注視しつつ、必要に応じて調整を検討していきます。\n\n1.妖刀状態中、【サブ格闘+メイン射撃】の攻撃判定範囲を縮小。\n2.妖刀状態中、ダッシュ速度を低下させ、ダッシュの初期ブースト消費を通常状態と同一に増加。\n3.全ての状態中における【サブ格闘+前+メイン格闘】の突進速度: 18m/s→17m/s。\n4.【サブ格闘】リロード時間: 12s→15s。","ocrMode":"manual-image-cleaned","id":"ocr-fc06c9a4cdcb"},{"date":"2026-04-15","title":"『星の翼』4月16日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2476","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/3a262646e336e91559b6e2d24247c98f.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"1.【後+メイン格闘】が15F〜20F間で追従を停止する不具合を修正。\n2.全形態中の【サブ格闘+左+メイン射撃】における弾丸誘導性能を若干向上。通常状態時の本武装の弾速: 40→45m/s。\n3.妖刀状態中の【サブ格闘+メイン射撃】における中距離での誘導性能を低下。垂直ジャンプによる回避が可能になる。","rawText":"1.【後+メイン格闘】が15F〜20F間で追従を停止する不具合を修正。\n2.全形態中の【サブ格闘+左+メイン射撃】における弾丸誘導性能を若干向上。通常状態時の本武装の弾速: 40→45m/s。\n3.妖刀状態中の【サブ格闘+メイン射撃】における中距離での誘導性能を低下。垂直ジャンプによる回避が可能になる。","ocrMode":"manual-image-cleaned","id":"ocr-384c50b16800"},{"date":"2026-05-06","title":"『星の翼』5月7日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2517","imageUrl":"https://sres.shengtiangames.com/uploads/publisher/15994ebe0900101366a47874d5391394.png","imageIndex":0,"category":"ocr","categoryLabel":"上方・下方調整","text":"1.妖刀状態中で【メイン格闘】・【左/右+メイン格闘】が空振り時にも任意の【サブ格闘】でキャンセル可能であった不具合を修正。","rawText":"1.妖刀状態中で【メイン格闘】・【左/右+メイン格闘】が空振り時にも任意の【サブ格闘】でキャンセル可能であった不具合を修正。","ocrMode":"manual-image-cleaned","id":"ocr-3a6ba061bfa3"}],"cost":"3.0","icon":"assets/character-icons-api/無銘.png","fullbody":"assets/character-icons/無銘.png"}],"imageArticles":[{"id":"1072","href":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1072","title":"『星の翼』12月12日キャラクターバランス調整","date":"2024-12-11","kind":"キャラクターバランス調整","images":["https://sres.shengtiangames.com/uploads/publisher/6db151c3222d04bc8d84642340c8be84.jpg"]},{"id":"1233","href":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1233","title":"『星の翼』1月2日キャラクターバランス調整","date":"2024-12-31","kind":"キャラクターバランス調整","images":["https://sres.shengtiangames.com/uploads/publisher/6eb0ecbff39e4fdf1fee5882de619d24.jpg","https://sres.shengtiangames.com/uploads/publisher/ff9f8447c991e0d6a853b6d6aee55899.jpg","https://sres.shengtiangames.com/uploads/publisher/279fafe829eaeddd85362b860f40f1f9.jpg","https://sres.shengtiangames.com/uploads/publisher/42a6e231add9ee25b0e8cdf49306b87a.jpg"]},{"id":"1302","href":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=1302","title":"『星の翼』1月23日キャラクターバランス調整","date":"2025-01-22","kind":"キャラクターバランス調整","images":["https://sres.shengtiangames.com/uploads/publisher/c5b8e22f777abcbd880c37be9ed7404f.jpg"]},{"id":"1370","href":"https://xzyjp.shengtiangames.com/newsInfo?la Omlso","ラジエル","直近のデータと実戦を分析した結果 中矩離~近 矩離において十分な費威を発揮できていないと判 断いたしました。","これを踏まえ 中矩離~近亜離での優位性を高め るため 突進能力の性能を最適化しました。 な お 今回の調整後も ラジエルの対戦を注視し 分析してまいります。","1. 【左右+サブ格闘】 ヒットストップ仕様を削除: 3FっOF 格闘追従速度: 18m/s-ZOmls","キャッティ","キャッティの 【サブ射撃】 は 弾薬回復メカニズ ムなどの制約により 使用感にやや硬さが見られ ました。 つきましては 今回の調整で一部性能を 見直し、 より様々な戦沢で 【サブ射撃】 を活用い ただけるよう使用環境の拡大を図っております。","ただけるよっ使用境境の払大を以っております。","1.【サブ射撃】 弾薬リロード方式: 弾丸が消えた時 にリロード開始一即座リロード。","2.【サブ格闘】 が遠亜離攻撃を防いだ時にジャンプ モーショウが発動 ブースト消費: 10-5。","フリード","直近の対戦データの分析により 騎乗状態のフリ 一ドはシールド防御を有さないため 【ガード】 着地のみでは自衛手段として十分でない場合が見 られました。","つきましては 中亜離 近亜離における戦闘能力 と生存能力の向上を目的とし、 騎乗状態で 【ガー ド】 、 【左+サブ射撃】 【左+サブ格闘】 の移動亜離を向上する調整を施しました。","1通常状態で 【後+サブ射撃】 が 【メイン射撃】 を","1通常状態で 【後+サブ射撃】 が 【メイン射撃】 を キャンセル可能","2騎乗モードで 【左ノ右+サブ射撃】 【左ノ+サブ 格闘】 【ガード】 速度曲線を調整 移動矩離を上 方修正。","3.【バーストアタック】一段目の拾い効果を追加。","アリス","アリスの 【バーストアタック】は 「強化状態」 へ移行できないという唯一のシューティングバー ストです。 さらに 【サブ格闘】 のサブ弾薬ク一 ルタイムが週度に長かったため 1試合中に強化状 態に入れるチャンスが極めて限られており 敵へ のプレッシャーが不足している状沢でした。","これを踏まえ その武装の命中率を向上するた め 【バーストアタック】 弾薬リロード仕様が直 接強化状態へ移行するように変更し、 横掃き攻撃","接強化状態へ移行するように変更し 横掃き攻撃 の上下旋回速度を向上させました。","今回の調整により アリスがより速やかに強化状 態へ移行し その特性を存分に発揮することで 戦局の主導権を堰れるようになることを期待して おります。","1.【バーストアタック】上下の旋回速度: 0/s-20/s 横掃き攻撃が地面にヒットした際の 演出を最適化。","2.【バーストアタック】がサブ格闘副弾薬を再装墳 しなくなり 直接 「杏炎状態」 を発動。","3通常状態で 【サブ格闘】 のシールドダッシュが目 標の周囲に突進した後 即時信止しなくなるよう 調整。 アンジェリスの 【サブ格闘】 を防御できな い不具合を修正。","4杏炎状態中 任意方向 【メイン格闘】 が 【サブ射 撃】 をキャンセル可能","一・し】_ルーハ","ハーールルン】","ルーュ","撃】 をキャンセル可龍","影","現在のバージョンにおいて 影の戦闘スタイルは 全体的に受動的になりがちであることが確認され ました。","3コストキャラクターとして 積樋的に戦局を打開 する際には武装の性能がややカ不足であり 多く の場合は後方から移動で回避や時間和ぎに頼る形 となっていました。 これは当初のコンセプトと一 定の斐離があります。","これを踏まえ 影の武装構成を再設計 調整し、 攻撃面の性能を強化するとともに 自衛や着地性 能を適度に制限しました。","「闇滅」 の名にふさわしく。 影に潜み 先手 を取り_ 戦局を筆堰せよ。","な以り_ ふ同台手堰せよ。","1落下状態に入る際に継承できる最大水平速度: 14mls つ 16mls。","2.【メイン射撃】 の調整: 誘導なしの直線弾に変 更。 水平方向の判定: O.Sm っ 0.7m 3本の投げナ イフ間の角度: 20 つ 158 飛行時間: 1.5s ろう 0.75s。","3.【サブ格闘+メイン射撃】 の調整:","方向入力なし: 横万向に3枚の爆弾ナイフを投 撫","前後方向入力時: 縦方向に3枚の爆弾ナイフを 投撫","左方向入力時: 誘導角度を増加: 26/s つ 4Ols。","ナイフの飛行速度を低下: 4Omls 一 3Omls 爆 隊高宗ち坊十- -クスハn [さn 上子土結吐門左","ナイノの飛付逸度を供ト: 4U な操作感を提供す ることを目的としています。","1.【メイン射撃】 で発射される弾で中央の手裏剣 に誘導性能を追加。","2.【後+サブ格闘】 は その場に分身を生成した 後 直接着地するように変更。 着地後は15Fのブ ノロロドツ亜","後 良接看地するように変曳。 看地後は15トのフ 一スト回復時間が必要。","武装発動中にメイン射撃を入力した場合 【サブ 格闘+ メイン射撃】 ではなく 通常の 【メイン射 撃】 が発動する。","3.【サブ格闘】 のブースト消費を減少。 ただし、 その2段目モーション中は 【サブ格闘】 でキャ ンセルは不可となる ( 【後+サブ格闘】 でキャン セル可能)","4影分身の攻撃ダメージをわずかに下方修正し かつその攻撃が目標にダウン値をチャージしなく なる。","シャオリン","シャオリンの 【サブ格闘】 はヒットストップが長 いため 保護を目的としてスーパーアーマーの持 続時間を1F延長しました。","続時間を1延長しました。","あわせて 中一近亜離でもより安心して使用でき るよう調整しています。","1. 【サブ格闘】 のスーパーアーマ一効果持続時間 をり延長。","キャラ調整","3A D 」 U s T","セイレン","巡遊状態中のセイレンの一部武装の挙動が 想定 していた立ち位畳から永離していることを確認し ています。","攻撃パターンや防御性能にはさらなる最適化の余 地があります。","今同の調整では 武hの擬作威の向ト 強燕やゲ","今回の調整では: 武装の操作感の向上 弾薬やゲ 一ジなどのリソース管理 および一部武装効果の 調整を行うことで 巡遊状態におけるセイレンの 特微的な立ち回りをより明確にし、 全体の戦闘テ ンポを合理的なものにすることを目的としていま す。","1.巡遊状態中 【サブ射撃】 の自身慣性速度を減 少。 銃口照準時間: 15F発生後の追加照準1-発 生時間と同等に変更。","ビーム弾の命中間隔: 1FっZF タツノオトシゴ照射の持続時間: 60F-30F。","2巡遊状態中 【左後+サブ格闘】 の垂直方 向速度: 第10からの落下-第からの落下へ変 更。","弾の分布と誘導弾道を調整し、 削り値: 34っ 50。","3 巡:状能中","【メイン射整】 の海の初凍-","3巡遊状態中 【メイン射撃】 の泊の初速: 1Omls-4Omls。 誘導弾道を最適化。","直撃ダメージ: 210-345 ダウン値: 40-120。 弾薬数を3発に調整 4利ごとに1発を回復","4巡遊状態中 【左右+サブ射撃】 の移動軌道を 曲線移動に変更し、 発射される弾道を最適化","関連数値を調整: ダメージ61っ45 ダウン値 5一4 ダメージ補正率5一4.8 削り値100-50。 この時タツノオトシゴも同一弾丸を発射。","5. 【ガード】 の最大維持時間を延長: 40F-6OF 新仕様を追加: 防御成功時に一部のブーストおよ びスターエネルギーを回復可能となる。","6.【サブ射撃】 の攻撃判定範囲を30%減少。","ヴァルキア","アルーノ","ヴァルキア従来の武装 「強制暴走」 の発動条件が 厳しく 通常状態の武装だけでは十分な強さを発 揮しにくく 対戦での安定性に欠けることが確認 されました。","そこで 今回ヴァルキアを全面的にリワークし、 ハイリスク・ハイリターンの戦闘スタイルは維持 した上で 強制暴走に依存せずとも比ぎ的安定し た立ち回りが可能になるよう調整を行いました。 具体的には: 部武装ルートの調整やメインメカ ニズムの発動条件 効果の再設計を実施しまし た。","これにより; タイミングの見極めとリソースの管 理を通じて ヴァルキアが攻撃タイプのキャラク ターとしての役割をより発揮でき 有利な局面で 相手の逆転を封じることを目的としています。","1. 【サブ射撃】 の最終段をブラックシャーク型子 機が目標に突進して-みつきに変更。","機が目標に突進して艦みつきに変更。","弾数: 2-1 リロード時間: 1Os-6S。 サブ射撃】 武装を削除。","横万向+","2.【前+メイン格闘】 のモーションを目標への飛 び掛か り軒撃に変更。","3.【メイン格闘派生サブ射撃】 を強化し、 モーシ ヨン速度を加速。","4. 【サブ格闘】 を調整: 1段目に拾い効果を追加 その場で準備期間中にスーパーアーマーを付与。","その場で準備時間: 10Fっ15F_ 最大追撃時間: 19Fっ22F 移動速度: ZOmls-ZZmls","目標命中後自身の方向転換が発生する不具合を修 正。","5. サブ格闘派生メイン格闘】 を強化し、 連打中 に継続的加 低下するよう調 整","ヴァルキア","対戦中 ヴァルキアは強力なパッシブ能力の復活","対戦中 ヴァルキアは強力なパッシブ能力の復活 と効率的なH回復により、 激しい撃ち合いや終盤 戦で高い持続力を発揮し、 ミス許容度が高く対応 が難しい状沢を生み出していました。 また 一部 の移動武装はリソースが尽きた状態でも週剥な脱 出性能を持ち リスクとリターンのバランスが適 切ではありませんでした。","今回の調整では: ヴァルキアの狂暴な攻撃や逆境 からの反撃といった特微を維持しつつ 相手が戦 紀や突進への対応を取りやすくなることを目指し ています。","1. 戦傷】 【強制暴走】 状態中 ダウン時にもHP が継続して滅少するよう調整 あわせて 格闘に よるH吸収率: 35% っ 40%。","2.【左右ノ前+サブ格闘】 をオーバーヒート状態 で使用しても ダッシュ時間が短縮されないよう 調整。","オーバーヒート時のダッシュ速度: 17.5m/s一","オーバーヒート時のダッシュ速度: 17.5m/s一 1Zmls","3.【後+サブ格闘】 のダッシュ中はキャンセル不 可となるよう調整","4.ファイティングバースト中 【左ノに前+サブ 格闘派生左右+サブ格闘】 発動時に 速度とモー ション加速効果が異常に重複し、 突進速度が週度 に上昇する不具合を修正。","ドラグナー","ドラグナーの巡航モード時の戦闘を確認したとこ ろ 【メイン射撃】 と援護攻撃による連続攻撃が 長時間継続しやすく 回避が難しい状沢が見受け られました。 また、 【メイン格闘】 がヒットしな かった場合でも相手に十分な費威を与えられ 空 中戦において過度なプレッシャーを与える一方 で 相手側に反撃の余地やミスを突く 機会が生ま","で; 相手側に及撃の余地やミスを突く 機会か生ま れにくい状態となっていました","そこで 援護攻撃の誘導性能を調整し、 飛行中の 持続火力を柳制するとともに 格闘攻撃に伴うり スクを明確化しました。 これにより、 空中での過 度に安定した制圧力や先手を取り続ける展開を担 えることを目的としています。","1.【前+サブ射撃】 の援護が目標に衝突後の旋回 速度: 3O0e/s つ 150/s。","2巡航モード中 【メイン射撃】 のリロード時間: 3s-4s。 総弾薬数: 4一3。 弾丸判定範囲を視覚表 示と一致するよう調整: O.5xO.Zm つ O.3mx03 mo","3巡航モード中 【メイン格闘】 がステップされ た際に一部の弾丸に誘導効果が残る不具合を修 正。 あわせて 衝突終了後の硬直時間を10F延 長","フリード","現在の環境では フリードの 【サブ射撃】 および その派生攻撃が 通常状態でも中亜離において安 定した葦制性能を発揮しており 相手側から見る と動きを読み取りにくい状沢を生み出していまし た。","そのため これらの性能については 全体バラン スを踏まえたうえで一定の弱体調整を行うことと しました。","1. 【サブ射撃】 【後+サブ射撃】 弾丸発射前の5 Fの間 ステップで誘導を切ることが可能となる よう調整 あわせて 弾丸の誘導性能をわずかに 低下。","上方修正","一A D 」 U s T","さ イノルり","~nり」り5","ライン","現在の環境では ラインの 【サブ格闘】 は実戦に おける費威度や存在感がややグえめであり また 【後+サブ射撃】 についても 操作感やリスクと リターンの面で改善の余地があると判断しまし た。","そこで 高火力や特定エリアでの制圧力といった 彼女の特微をより際立たせるため 関連する武装 に強化調整を行います。 これにより、 武装同士の 組み合わせがより実用的になることを目指してい ます。","なお 今後も実戦での使用状沢を継続的に確認し ていきます。","1. 【サブ格闘】 で発射される弾丸を 2発の大型低 速ミサイルに変更。 ミサイルの移動速度は低いも 語道性能おトフドケケ軽判完左改似 令中時に","迷二リイルル父史。 ニリイルリ修里や安は八いも のの 誘導性能および攻撃判定を強化 命中時に は小型の球状爆風を発生させ 敵を吹き飛ばす。","2.【後+サブ射撃】 の発生中 銃口照準性能を向 上 あわせて 左右両側の細ビームの延伸速度: 1OOmls つ 7Smls。","薫雷改","韓雷改の 【サブ射撃+メイン射撃】 は: 主要な制 圧手段として機能していますが 激しい弾幕戦で は消莉されやすく 火力を安定して発揮しづらい 状沢が見受けられました。","そこで 誠当武装の性能を強化する調整を行いま した。","1. 【サブ射撃+メイン射撃】 の弾丸を 実に果たせることを期待しています。","1.【前+メイン格闘】 の速度曲線を調整し、 ブー スト消費を減少。 落下時に方向を後々に転換する 効果を追加","2. サブ格闘】","ファイティングバーストによる","2.【サブ格闘】 ファイティングバーストによる 追従速度上昇効果を適用可能になる。","3.【サブ格闘+サブ格闘派生】 通常状態での突 進速度: 15mls-16.5mls。","ファイティングバースト中に武装の追従速度とモ 一ション加速効果が異常に重複し、 突進速度が過 度に上昇する不具合を修正。","4.【後+サブ格闘】 リロード時間: 80s-6Os。","クリスタ","クリスタの一部格闘武装において ダメージ量お よび発生速度が想定を下回っており 正面からの プレッシャーヤコンボの締めにおける決定力が不 足している状沢を確認しております。","そのため 誠当武装の性能を強化し、 瞬間火力の 向上と操作性の改善を図ることにしました。","向上と操作性の改善を図ることにしました。","1.【サブ格闘】 【左右+サブ格闘】 【サブ格闘+ サブ格闘派生】 【後+メイン格闘】 のダメージを 向上。","2.【後サブ射撃+サブ射撃派生】 発生時間: 18F うう 15F。","3.【左ノ+サブ格闘】 の最短発生時間: 18F つ 15F。","4.【バーストアタック】がステップされた後にそ の場で回転する不具合を修正。","キャラ調整","一A DJU S T","アイスリン","ノりハソ‥","1.【後+メイン格闘】 の誘導性能が異常となる不 具合を修正。","デュカリオン","1.仮想ジョイスティックによるビーム武装のドラ ッグロジックを最適化し、 目標方向への操作性を 改善。","2.【サブ格闘】 がステップされた後にその場で回 転する不具合を修正。","レキ","1. 【サブ格闘】 が一部のスーパーアーマー武装を 信止できる不具合を修正。","ラジエル","1.【後+メイン格闘】 ビットの攻撃が目標の防御 バリアを無視する不具合を修正。","秋雲","1. 【サブ射撃派生サブ射撃】 が特定条件下で修羅 丸に向かって移動しない不具合を修正。","共通調整","D 」U S T","1赤ロック状態で武装発動中にロックオン目標を 切り替え 【バーストアタック】 を使用した場 合 【バーストアタック】 が赤ロック状態を保存 する不具合を修正。","2変形可能なキャラクター (セイレン・ドラグナ 一を合む) が飛行状態移行真後にロックオン目標 を切り替えて武装を使用すると 赤ロック状態が 保存される不具合を修正。"],"detail":[{"box":[[122,54],[268,54],[268,84],[122,84]],"text":"BALANCE","conf":0},{"box":[[181,113],[519,113],[519,321],[181,321]],"text":"一一","conf":0},{"box":[[76,962],[1062,962],[1062,1371],[76,1371]],"text":"VHR。 210918 lozio「」 心辺y","conf":0},{"box":[[127,1484],[422,1484],[422,1581],[127,1581]],"text":"下方修正","conf":0},{"box":[[691,1501],[985,1501],[985,1581],[691,1581]],"text":"940 」 Us T","conf":0},{"box":[[225,1667],[489,1667],[489,1733],[225,1733]],"text":"ドラグナー","conf":0},{"box":[[56,1813],[997,1813],[997,2314],[56,2314]],"text":"現在の環境では ドラグナーは優れた自衛能力と 奇裏性能を兼ね備えています。 ゲームバランスを 考魔し、 対面時の公平なプレイ体験向上と より 精密な操作を低すため 近亜離での制圧力と巡航 モードでの奇裏安定性を若千柳制しました。 高い 機動力と突撃性能というキャラクターの独自性は 維持しつつ 今後のゲーム環境の変化を慎重に注 視していきます。","conf":0},{"box":[[53,2381],[851,2381],[851,2500],[53,2500]],"text":"1.【メイン射撃】 の弾丸幅: OZmxo.Zm こう O.1Smxo.15m","conf":0},{"box":[[53,2570],[957,2570],[95 2.8223975455171],[515.7283570407292,455.93312801993784],[430.00394477413516,427.1776024544829]],"text":"‥阿","conf":0.00033465666815316806},{"box":[[430.3315670795699,417.0562457694621],[524.9998000149988,450.96000199985],[511.6684329204301,483.9437542305379],[417.00019998500125,450.03999800015]],"text":"川国町","conf":0.010823740611314444}],"ocr_mode":"original-short","rawText":"おi\nお知\nらせ\n} [\nN\nN 0\nT | ・ に\n‥阿\n川国町"},{"article_id":"2476","date":"2026-04-15","title":"『星の翼』4月16日キャラクターバランス調整","url":"https://xzyjp.shengtiangames.com/newsInfo?lan=CN&id=2476","image_index":0,"image_url":"https://sres.shengtiangames.com/uploads/publisher/1d895d85b009395a9c13ec37b8d9f37f.png","image_path":"work\\ocr_images\\2026-04-15_2476_0.png","size":[1062,28581],"texts":["BALAWCE","印川","VR.22021661 Io4lio 心込Da","IBRBEL","下方修正","1A D 」 U s T","フリード","フリードのサブ射撃系武装につきまして 中近亜 離において豊富な弾数による制圧力が想定を上回 っているため ゲームバランスを考魔し実施いた しました。 今回の調整では弾数を滅少させる一方 で リロード時間を短縮することでバランスを最 適化しました。","1.【サブ射撃】 弾数: 2っ 1、 リロード時間: 8s 6S。","2.【後+サブ射撃】 弾数: 2っ1、 リロード時 間: 12s っ 85。","ザハロワ","ザハロワにつきまして 前回の調整以降 火力お よび機動力の両面において週剥な性能を発揮して おりました。 本来のコンセプトである 「機動力を仰えた砲撃型 射撃キャラクター」 という立ち位畳を明確にする ため 今回の調整では援護武装の性能をわずかに 下方修正するとともに 基確機動力についても一 定の制限を設けました。","1.【後+ メイン格闘】 の速度慣性保存船力を低下 させ 援護射撃の発生時間: 8F っ 12F。 樋弾の弾 速: SOmls つ 45mls。 さらに 援護が消失してか ら弾薬リロードが開始されるようになる。","2.【ダッシュ】 の移動速度および旋回速度を若千 低下させ 【ステップ】 の性能を若千向上させ るs","グリフィン","グリフィンにつきまして 現状では飛行状態中レ バー人れを行わない組撃性能が突出しており 移 動を伴う粗撃の選沢肺が埋もれてしまっている状 紀です。 そのため これら両者のバランスを微調 整いたしました。 また; 現在の対戦環境における 優れた性能を考魔し、 命中率の高い一部武装およ びHPに対して下方修正を実施いたしました。 今回 の調整後の動向につきましても 引き続き注祝し てまいります。","1飛翔状態でN 【メイン射撃】 発生時間を1増 加 飛翔状態で 【任意方向+メイン射撃】 の発生 時間を1短縮。","2通常状態で 【サブ射撃】 における羽弾の誘導を 切れる時間: 発射後18F つ 発射後14F。","3.HP値: 3020-2952。","一","ル","一ーし","一ー。","レキ","レキのバーストアタックにつきまして 各段の命 中率が極めて高く 対処が因難なほど優位な性能 を発揮しておりました。 そのため 初段の攻撃判 定の範囲を縮小する調整を行いました。 また パ ッシブ武装 [龍喰の雷」 状態において 黄ロック の保護と強力な攻撃性能の組み合わせが過剥な強 みとなっていたため 誠当武装の仕様に一部制限 を設ける調整を実施いたしました。","1. 「龍喰の雷」 状態移行後 任意の武装を使用す ると黄ロック保護が即座に終了するようになる。","2.【バーストアタック】 の威圧半径: 1Om-8m。","3. 「龍喰の雷」 状態移行時に分身が自動召喰され ない不具合を修正。 現在はバースト演出前に即座 に分身を召喰するようになる。","にケ身を台晩するよつにな句。","上方修正","一A D 」 U 5 T","ローランド","ローランドにつきまして これまではコンボの撃 ぎのぎこちなさや 遠亜離での追撃能力の不足 さらに解放状態でのダメージが覚醍の恩恵と噌み 合っていないといった課題がありました。 これら を改善するため 今回は解放状態における格闘派 生のダメージタイプを修正し、 ファイティング型 覚醍のバフが最大限に乗るよう調整いたしまし た。 これにより 解放状態中のコンボの火カ上限 が引き上げられます。 件せて 通常状態でのコン ボの操作感や、 中遠矩離における追撃性能につい ても大幅に強化しております。","1.【前+サブ格闘】 その場で信止する5の制限","1.【前+サブ格闘】 その場で信止する5の制限 をは廃。 突進時間: 2OF 一 25F。 【サブ射撃】 【後+サブ射撃】 へのキャンセルルートを追加。","2.【後+サブ射撃】 の上下射撃角度制限: 309 こう 609","3. 【メイン射撃】 【サブ射撃】 【後+サブ射 撃】 によるキャンセルルートを追加","4解放状態で 【メイン格闘】 最終段の剣気一 【格 闘派生】 最終段の爆発 【サブ格闘】 最終段の地 火ダメージ属性: 射撃-格闘。","5.【左右+サブ格闘】 縁ロック状態および未命 中時におけるキャンセルルート無効制限をは廃。 解放状態中の緑ロック移動速度: 3Omls 一 ZSmls","6解放状態での 【サブ格闘】 誘導性能および着 地矩離を向上 ブースト消費を増加。 地火が地面 から空中へ倶斜して発生する不具合を修正。","から空中へ倶斜して発生する不具合を修正。","7.【バーストアタック】 武装終了時に自動で解 放状態へ移行。 武装が未命中の場合 追加で1OF のモーション後陽時間が発生する。","ボルゾイ","ボルゾイのメイン射撃につきまして 主力武装で ありながら 連射性能が十分ではないという課題 がありました。 そのため 本来備わっているべき 誘導性能を新たに追加いたしました。 また 格闘 戦の起点となるサブ格闘につきましても、 あと一 歩のところで目標に国かない場面が見受けられた ため 突進跳離を延長し、 追従性能の最適化を行 いました。","1.【メイン射撃】 の弾速: 45mls cう 42mls 件せ て 連続射撃時に毎回誘導を再取得するようにな る","2. 【サブ格闘】 跳びの踏み切りおよび追従速度を 若千向上 追従時間: 16F つ 18F。 最終段の硬直 をその場で吹き飛ばしに変更。","3. 【前+メイン格闘】 追従時間: 17F っ 8F _ 発生 時間: 7F っ GF。 初速度をろmノ向上 初期ブース ト消費: 10 っ 12。","4.【メイン格闘+サブ射撃】 派生を最適化: 最終 撃前に武装をキャンセルした場合 目標が直接落 下せずノックバック硬直状態に入るようになる。","バーゼラルド","バーゼラルドにつきまして 強化状態では強力な 性能と機動力を発揮できる反面 スターバースト の弾薬リソースと完全に独立した仕様となってお り 生存能力やリソース管理において非常に高い 習熟度が求められる設計でした。 今回の調整で","習熟度が求められる設計でした。 今回の調整で は; バーストゲージを消費して能動的に強化状態 へ移行できる手段を追加しつつ 強化状態への移 行リスクや持続時間について一定のバランス調整 を実施いたしました。","1. 【バーストアタック】 の持続時間を大幅短縮。 また 【ブーストアタック】 から主動的に強化状 態へ移行可能になる。","2.強化状態の持続時間: 20s- 16.6s。","3. 【サブ格闘】 発動中に 【後+メイン格闘】 の弾 薬ケージが不足している状態で 【後+メイン格 闘】 を入力すると 【サブ格闘+ メイン格闘】 派 生が発動する不具合を修正。","ベータ","新キャラクターが続々と登場する中 ベータを使 い続けるプレイヤーが滅少順向にあることを確認","い続けるプレイヤーが滅少順向にあることを確認 しております。 彼女が再び第一線で活曜できるよ う 天オと呼ばれる先書のデュカリオンと ライ バルの十八号が手を貸すことになりました。 ま た 彼女の唯一の立ち回り手段である 【後+サブ 格闘】 につきましても 現状では存在感が薄く、 十分に活用しきれていない場面が多く見受けられ ました。 そのため 今回の調整では本武装の性能 の最適化も件せて実施いたしました。","1.【前ノ後+サブ射撃】 を追加: デュカリオンを 召晩し、 目標に格闘ノ 射撃を行う。 スターバース ト発動中は 1回限定の援護に変化し、 十八号を 召喰して目標に格闘 射撃を行う。 本武装は 【メ イン射撃】 でキャンセル不可","2.【後+サブ格闘】 の誘導性能および着地矩離を 向上させ ブースト消費を減少。","タチアナ","タチアナのサブ射撃につきまして 連続発動時の 回避性能および追撃能力が不足しているという課 題がありました。 これに対し、 サブ射撃の速度曲 線と移動方向を最適化し、 連続発動時に一般的な ビーム弾をより回避しやすくすることで 攻撃の 安定性を向上させました。 また メイン射撃から 前メイン格闘へのキャンセルルートを追加し、 照 射の弾速を強化いたしました。 これらの調整によ り タチアナの攻撃性能の底上げを図っておりま す","1. 【サブ射撃】 および 【左右サブ射撃】 の速度曲 線と移動方向を調整し、 連続使用時に通常のビー ム弾に命中しにくくなる。","2.【メイン射撃】 【前+メイン格闘】 によるキ ヤンセルルートを追加 ビーム延伸速度: GSmls 7Omls","3.【サブ射撃+サブ射撃派生】 は 引き続き 【任 意方向+サブ射撃】 でキャンセル可能 【前+サ","ノ _ ス三 ' ノ♪ フ」三ルーム りけ","川・ 川uこ 山 意方向+サブ射撃】 でキャンセル可龍。 【前+サ ブ射撃】 / 【サブ射撃】 でキャンセルした場合 デ フォルトで 【左+サブ射撃】 が発動するようにな る。","4. 【サブ格闘】 縁ロック状態で発動した際に正 面へ移動せず 目標に向かって移動する不具合を 修正。","キャラ調整","一A D 」 U s T","スカイセーバー","スカイセーバーの支援能力における短所が 現在 の環境では顕着となっております。 また、 従来の 後格闘がキャラクターのコンセプトと噌み合って いない点も踏まえ 今回はサブ射撃をリワーク し、 後格闘をメイン射撃からキャンセル可能な援","し、 後格闘をメイン射撃からキャンセル可能な援 護武装へと差し替えました。 これにより; 中遠亜 離からより厚い弾幕を張れるようになり、 支援が しやすくなっただけでなく 立ち回りの中で援護 武装を利用した素早い着地も可能となり より有 利に攻めを展開できるようになります。 また サ ブ格闘からの攻め手が限定的だったため 格闘派 生に新たな追従方式を採用し、 より多彩な攻撃オ プションを追加いたしました。 件せて 格闘アク ションの最適化も実施いたしました。 格闘サブ格 闘派生を移動量 ダメージ共に優れたものへ調整 したほか キャラクターの特色を活かしたスタ一 バースト中の限定の前格闘や援護武装を追加し、 接近に成功した際の格闘リターンを大幅に向上さ せました。","1.【メイン射撃】 を調整: 特殊背面射撃を削除。","2.【サブ射撃】 バックパックから強力なビーム とミサイルを発射する効果に変更。 リロード時 間: 1発ごとに8 つ 7利。","3.【左ノ右後+サブ射撃】 の最大弾速: Zs つ 5s リロード時間: 3s つ 4S。 左は二連射に変更。","4. 【メイン格闘】 の各ヒットのダメージ構成を再 調整。","5.【左+メイン格闘】 の各ヒットのダメージ構 成を再調整。","6.【前+メイン格闘】 複合武装を使用した目標 への斯り抜け効果に変更。 スターバースト状態中 の効果を調整: 基確性能 攻撃段数 部格闘武 装からの 【前+メイン格闘】 派生を追加","7.【後+メイン格闘】 ダークスターを召喰し、 目標に射撃する効果に変更。 スターバースト状態 中に初めて使用した場合 ダークスターが目標に 突進して強力な攻撃を行う。 総弾: 60-1 リ ロード時間: 12s つ 1OS。","8. サブ格闘派生メイン格闘】 の追撃を目標に跳","8.【サブ格闘派生メイン格闘】 の追撃を目標に跳 びかかり ~撃を行うに変更。 1段目のダメージ 補正率: 15% つ 209。","9.【後+サブ格闘】 の弾薬消費を剤廃。 追従時 間: 3OF つ 15F 跳びの踏み切り速度: SOmls つう 4Omls。","10.【メイン格闘派生サブ射撃】 補正率: 20% 一 159。 命中時に受け身不可効果を追加し、 従来ス ターバースト中のみ有効だった効果を常時有効 化 渡得ブースト量を1-7に調整","11.【メイン格闘派生サブ格闘】 の戦闘演出を再設 計。","12.【バーストアタック】 の戦闘アニメーションを 再設計。","フィービー","フィービーのビットにつきまして 飛行亜離に   function renderList() { const list = $('#charList'); const tabs = $('#sideCostTabs'); const order = ['all','3.0','2.5','2.0','1.5','未設定']; const labels = {all:'全COST','3.0':'COST 3.0','2.5':'COST 2.5','2.0':'COST 2.0','1.5':'COST 1.5','未設定':'未設定'}; const counts = {}; DATA.characters.forEach(c => { const cost = c.cost || '未設定'; counts[cost] = (counts[cost] || 0) + 1; }); counts.all = DATA.characters.length; tabs.innerHTML = order.filter(cost => counts[cost]).map(cost => '<button class="side-cost-btn' + (state.sideCost === cost ? ' active' : '') + '" type="button" data-side-cost="' + esc(cost) + '">' + labels[cost] + '<span>' + counts[cost] + 'キャラ</span></button>').join(''); tabs.querySelectorAll('button').forEach(button => { button.addEventListener('click', () => { state.sideCost = button.dataset.sideCost; state.costFilter = button.datasetSideCost || button.dataset.sideCost; state.selected = null; document.querySelectorAll('button[data-cost-filter]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.costFilter === state.costFilter))); render(); }); }); const visibleChars = DATA.characters.filter(char => state.sideCost === 'all' || (char.cost || '未設定') === state.sideCost); const currentLabel = labels[state.sideCost] || state.sideCost; list.innerHTML = '<div class="side-cost-heading"><strong>' + esc(currentLabel) + '</strong><span>' + visibleChars.length + 'キャラ</span></div>' + visibleChars.map(char => { const active = state.selected === char.name ? ' active' : ''; return '<button class="char-button' + active + '" type="button" data-char="' + esc(char.name) + '">' + (char.icon ? '<img class="char-icon" src="' + esc(char.icon) + '" alt="">' : '<span class="char-icon"></span>') + '<span><span class="char-name">' + esc(char.name) + '</span><span class="char-meta-small">COST ' + esc(char.cost || '未設定') + '</span></span></button>'; }).join(''); list.querySelectorAll('button[data-char]').forEach(button => { button.addEventListener('click', () => { const name = bu   function renderImages() { const grid = $('#imageGrid'); const q = state.query.trim().toLowerCase(); const rows = DATA.ocrRawArticles.filter(a => !q || [a.title, a.date, a.rawText].join(' ').toLowerCase().includes(q)); grid.innerHTML = rows.map(a => '<article class="image-card"><div class="image-card-head"><strong>' + esc(a.title) + '</strong><span>' + esc(a.date) + ' / 画像 ' + (a.image_index + 1) + '</span><button class="ref-button" type="button" data-ref-type="article" data-ref-url="' + esc(a.url) + '" data-ref-title="' + esc(a.title) + '">公式記事</button></div><button class="ref-button" type="button" data-ref-type="image" data-ref-url="' + esc(a.image_url) + '" data-ref-title="' + esc(a.title) + '">右で画像を見る</button><img loading="lazy" src="' + esc(a.image_url) + '" alt="' + esc(a.title) + '" data-ref-type="image" data-ref-url="' + esc(a.image_url) + '" data-ref-title="' + esc(a.title) + '"><details class="ocr-raw"><summary>OCRテキストを開く</summary><pre>' + esc(a.rawText) + '</pre></details></article>').join(''); setText('#imageCountVisible', rows.length); }
  function renderDateSummary(items){ const el = $('#dateSummary'); if(!el) return; if(!items.length){ el.innerHTML = ''; return; } const byDate = new Map(); items.forEach(({char, update}) => { const dateLabel = displayDate(update.date); if(!byDate.has(dateLabel)) byDate.set(dateLabel, new Map()); const chars = byDate.get(dateLabel); chars.set(char.name, (chars.get(char.name) || 0) + 1); }); const dateEntries = [...byDate.entries()].sort((a,b) => dateSortKey(a[0]).localeCompare(dateSortKey(b[0]))); const options = ['<option value="all">全日付</option>'].concat(dateEntries.map(([date]) => '<option value="' + esc(date) + '"' + (state.dateFilter === date ? ' selected' : '') + '>' + esc(date) + '</option>')).join(''); const rows = dateEntries.filter(([date]) => state.dateFilter === 'all' || state.dateFilter === date).map(([date, chars]) => { const pills = [...chars.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([name,count]) => '<span class="date-char-pill">' + esc(name) + '<span>' + count + '件</span></span>').join(''); return '<article class="date-row"><strong>' + esc(date) + '</strong><div class="date-row-body">' + pills + '</div></article>'; }).join(''); const openAttr = state.dateFilter !== 'all' ? ' open' : ''; el.innerHTML = '<details' + openAttr + '><summary><span>日付別アップデート</span><small>' + byDate.size + '日分 / ' + items.length + '件</small></summary><div class="date-summary-inner"><div class="date-summary-head"><div><h3>日付で絞り込み</h3><p>日付を選ぶと、その日に更新されたキャラだけ表示します。</p></div></div><div class="date-summary-control"><label for="dateFilterSelect">日付</label><select id="dateFilterSelect">' + options + '</select></div><div class="date-list">' + rows + '</div></div></details>'; const select = $('#dateFilterSelect'); if(select){ select.addEventListener('change', event => { state.dateFilter = event.target.value; renderCards(); }); } }
  function renderCards() { const container = $('#cards'); const cards = []; const dateItems = []; let visibleCharacters = 0; let visibleUpdateCount = 0; for (const char of DATA.characters) { if (!matchesCharacter(char)) continue; visibleUpdates(char, true).forEach(update => dateItems.push({char, update})); const updates = visibleUpdates(char); if (!updates.length) continue; visibleCharacters++; visibleUpdateCount += updates.length; const badges = categoryOrder.filter(cat => char.counts[cat]).map(cat => '<span class="badge ' + cat + '">' + categoryLabels[cat] + ' ' + char.counts[cat] + '</span>').join(''); const weapons = char.weapons.length ? char.weapons.slice(0,18).map(w => '<span class="chip">' + esc(w) + '</span>').join('') : '<span class="chip">本文側は記載なし</span>'; const byDate = new Map(); updates.forEach(u => { if(!byDate.has(u.date)) byDate.set(u.date, []); byDate.get(u.date).push(u); }); const groups = [...byDate.entries()].sort((a,b)=>dateSortKey(a[0]).localeCompare(dateSortKey(b[0]))).map(([date, items]) => { const list = items.sort(compareUpdateAsc).map(u => { const t = textOf(u); const textHtml = state.editing ? '<textarea class="edit-area" data-edit-id="' + esc(u.id) + '">' + esc(t) + '</textarea>' : '<div class="update-text">' + esc(t) + '</div>'; return '<li class="update-item" data-category="' + u.category + '"><div class="update-top"><span class="badge ' + u.category + '">' + categoryLabels[u.category] + '</span><span class="update-date">' + esc(u.date) + '</span><button class="update-link ref-button" type="button" data-ref-type="article" data-ref-url="' + esc(u.url) + '" data-ref-title="' + esc(u.title) + '">公式記事</button>' + (u.imageUrl ? '<button class="update-link ref-button" type="button" data-ref-type="image" data-ref-url="' + esc(u.imageUrl) + '" data-ref-title="' + esc(u.title) + '">公式画像</button>' : '') + (state.edits[u.id] ? '<span class="badge other">編集済み</span>' : '') + '</div>' + textHtml + '<div class="edit-actions"><button class="filter-btn" type="button" data-smooth="' + esc(u.id) + '">改行整形</button><button class="filter-btn danger" type="button" data-reset="' + esc(u.id) + '">元に戻す</button></div></li>'; }).join(''); return '<section class="update-group"><h3 class="group-title">' + esc(displayDate(date)) + '</h3><ul class="update-list">' + list + '</ul></section>'; }).join(''); cards.push({cost: char.cost || '未設定', html: '<article class="character-card" id="char-' + encodeURIComponent(char.name) + '"><div class="card-head"><div class="card-title-row">' + (char.icon ? '<img class="card-icon" src="' + esc(char.icon) + '" alt="">' : '') + '<div><h2>' + esc(char.name) + '</h2><div class="meta"><span class="cost-pill">COST ' + esc(char.cost || '未設定') + '</span><span>' + esc(char.firstDate) + '〜' + esc(char.lastDate) + '</span><span>本文 ' + char.updateCount + '件</span><span>上方・下方調整 ' + char.ocrCount + '件</span></div></div></div><div class="badge-row">' + badges + '</div></div><div class="card-body"><aside class="weapon-box"><h3>関連武装・要素</h3><div class="chips">' + weapons + '</div></aside><div class="updates">' + groups + '</div></div></article>'}); } const costOrder = ['3.0','2.5','2.0','1.5','未設定']; const grouped = new Map(); cards.forEach(card => { if(!grouped.has(card.cost)) grouped.set(card.cost, []); grouped.get(card.cost).push(card.html); }); container.innerHTML = costOrder.filter(cost => grouped.has(cost)).map(cost => '<section class="cost-section"><div class="cost-section-head"><h3>COST ' + esc(cost) + '</h3><span>' + grouped.get(cost).length + 'キャラ</span></div>' + grouped.get(cost).join('') + '</section>').join(''); renderDateSummary(dateItems); $('#empty').hidden = cards.length !== 0; setText('#statVisible', visibleCharacters); setText('#metricUpdates', visibleUpdateCount); wireEditors(); wireReferences(); }
  function showReference(type, url, title){ const panelTitle = document.querySelector('#refTitle'); const sub = document.querySelector('#refSub'); const body = document.querySelector('#refBody'); const open = document.querySelector('#refOpen'); if(!body) return; document.body.classList.add('reference-open'); panelTitle.textContent = title || (type === 'image' ? '公式画像' : '公式記事'); sub.textContent = url; open.href = url; open.hidden = false; if(type === 'image'){ body.innerHTML = '<div class="ref-image-wrap"><img class="ref-image" src="' + esc(url) + '" alt="' + esc(title || '公式画像') + '"></div>'; } else { body.innerHTML = '<div class="ref-placeholder"><p>公式記事は外部サイト側の制限で埋め込み表示できない場合があります。</p><p><a class="filter-btn primary" href="' + esc(url) + '" target="_blank" rel="noreferrer">公式記事を開く</a></p></div>'; } document.querySelectorAll('[data-ref-url]').forEach(el => el.classList.toggle('active', el.dataset.refUrl === url)); }
  function wireReferences(){ document.querySelectorAll('[data-ref-url]').forEach(el => { el.addEventListener('click', event => { event.preventDefault(); showReference(el.dataset.refType, el.dataset.refUrl, el.dataset.refTitle); }); }); }
  function setupResizableReference(){ const root = document.documentElement; const savedWidth = localStorage.getItem('starward-ref-width'); const savedZoom = localStorage.getItem('starward-img-zoom'); if(savedWidth) root.style.setProperty('--ref-width', savedWidth + 'px'); if(savedZoom) root.style.setProperty('--img-zoom', savedZoom); const slider = document.querySelector('#imageZoom'); const zoomLabel = document.querySelector('#zoomValue'); if(slider){ if(savedZoom) slider.value = String(Math.round(Number(savedZoom) * 100)); const syncZoom = () => { const z = Math.max(50, Math.min(250, Number(slider.value || 100))); root.style.setProperty('--img-zoom', String(z / 100)); localStorage.setItem('starward-img-zoom', String(z / 100)); if(zoomLabel) zoomLabel.textContent = z + '%'; }; slider.addEventListener('input', syncZoom); syncZoom(); } const reset = document.querySelector('#resetRefSize'); if(reset){ reset.addEventListener('click', () => { localStorage.removeItem('starward-ref-width'); localStorage.removeItem('starward-img-zoom'); root.style.setProperty('--ref-width','430px'); root.style.setProperty('--img-zoom','1'); if(slider) slider.value = '100'; if(zoomLabel) zoomLabel.textContent = '100%'; }); } const handle = document.querySelector('#refResizer'); if(!handle) return; let dragging = false; const move = (event) => { if(!dragging) return; const width = Math.max(300, Math.min(Math.round(window.innerWidth * 0.72), window.innerWidth - event.clientX)); root.style.setProperty('--ref-width', width + 'px'); localStorage.setItem('starward-ref-width', String(width)); }; handle.addEventListener('pointerdown', event => { dragging = true; handle.setPointerCapture(event.pointerId); document.body.style.userSelect = 'none'; }); handle.addEventListener('pointermove', move); handle.addEventListener('pointerup', event => { dragging = false; document.body.style.userSelect = ''; try { handle.releasePointerCapture(event.pointerId); } catch {} }); }
  function wireEditors(){ document.querySelectorAll('.edit-area').forEach(area => { area.addEventListener('input', () => { state.edits[area.dataset.editId] = area.value; saveEdits(); }); }); document.querySelectorAll('[data-reset]').forEach(btn => btn.addEventListener('click', () => { delete state.edits[btn.dataset.reset]; saveEdits(); renderCards(); })); document.querySelectorAll('[data-smooth]').forEach(btn => btn.addEventListener('click', () => { const id = btn.dataset.smooth; const area = document.querySelector('.edit-area[data-edit-id="' + CSS.escape(id) + '"]'); if (area) { area.value = smoothText(area.value); state.edits[id] = area.value; saveEdits(); } })); }
  function render() { document.body.classList.toggle('editing', state.editing); renderList(); renderCards(); updateEditCount(); const editButton = $('#editMode'); if (editButton) { editButton.hidden = !canEdit; editButton.textContent = state.editing ? '編集終了' : '編集する'; editButton.classList.toggle('primary', state.editing); } }
  function exportJson(){ const blob = new Blob([JSON.stringify({version:1, exportedAt:new Date().toISOString(), edits:state.edits}, null, 2)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'starward_update_edits.json'; a.click(); URL.revokeObjectURL(a.href); }
  function exportMarkdown(){ let md = '# 星の翼 キャラ別まとめ 編集反映版\n\n'; for (const char of DATA.characters) { const updates = visibleUpdates({...char, updates: char.updates}); if (!updates.length) continue; md += '## ' + char.name + '\n\n'; for (const u of updates) md += '- ' + u.date + ' ' + categoryLabels[u.category] + ' / ' + u.title + '\n\n' + textOf(u) + '\n\n'; } const blob = new Blob([md], {type:'text/markdown'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'starward_updates_edited.md'; a.click(); URL.revokeObjectURL(a.href); }
  setText('#statChars', DATA.characterCount); setText('#statUpdates', totalTextUpdates); setText('#statArticles', DATA.articleCount); setText('#statImages', DATA.imageCount); setText('#statOcr', DATA.ocrUpdateCount); setText('#metricRange', DATA.firstArticle + '〜' + DATA.lastArticle); setText('#metricArticles', DATA.articleCount + '件'); setText('#metricChars', DATA.characterCount + '件'); setText('#metricImages', DATA.imageArticleCount + '記事 / ' + DATA.imageCount + '枚'); setText('#rangeText', DATA.firstArticle + '〜' + DATA.lastArticle + ' / 公式ニュース参照'); $('#searchInput').addEventListener('input', event => { state.query = event.target.value; state.dateFilter = 'all'; renderCards(); }); document.querySelectorAll('button[data-filter]').forEach(button => { button.addEventListener('click', () => { state.filter = button.dataset.filter; state.dateFilter = 'all'; document.querySelectorAll('button[data-filter]').forEach(b => b.setAttribute('aria-pressed', String(b === button))); renderCards(); }); }); document.querySelectorAll('button[data-cost-filter]').forEach(button => { button.addEventListener('click', () => { state.costFilter = button.dataset.costFilter; state.sideCost = button.dataset.costFilter; state.dateFilter = 'all'; document.querySelectorAll('button[data-cost-filter]').forEach(b => b.setAttribute('aria-pressed', String(b === button))); render(); }); }); $('#editMode')?.addEventListener('click', () => { if (!canEdit) return; if (!state.editing && sessionStorage.getItem('starward-edit-unlocked') !== '1') { const pw = prompt('編集パスワードを入力してください'); if (pw !== 'xzyjp') { alert('パスワードが違います'); return; } sessionStorage.setItem('starward-edit-unlocked', '1'); } state.editing = !state.editing; render(); }); $('#exportJson').addEventListener('click', exportJson); $('#exportMd').addEventListener('click', exportMarkdown); $('#importFile').addEventListener('change', event => { const file = event.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (
