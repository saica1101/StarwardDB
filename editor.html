<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>武装データ編集 | 星の翼ガイド</title>
    <meta name="description" content="星の翼ガイドの武装表データを編集するためのローカル編集ページです。" />
    <link rel="stylesheet" href="styles.css?v=20260603publicsplit1" />
  </head>
  <body>
    <header class="site-header" id="top">
      <a class="brand" href="index.html" aria-label="星の翼ガイド トップへ">
        <span class="brand-mark">S</span>
        <span>星の翼ガイド</span>
      </a>
      <nav class="nav" aria-label="主要ナビゲーション">
        <a href="index.html">基本</a>
        <a href="index.html#contributors">ご協力様</a>
        <a href="characters.html">キャラ</a>
        <a href="videos.html">動画</a>
        <a href="tools.html">ツール</a>
        <a href="editor.html" aria-current="page">編集</a>
      </nav>
    </header>

    <main>
      <section class="page-hero compact">
        <div class="page-hero-inner">
          <p class="eyebrow">Local Editor</p>
          <h1>武装データ編集</h1>
          <p>キャラを選んで、射撃・格闘・バースト表を編集できます。編集後はJSONを書き出して、生成スクリプトでHTMLへ反映します。</p>
        </div>
      </section>

      <section class="section tight">
        <div class="editor-shell">
          <aside class="editor-sidebar">
            <label for="data-file">JSON読み込み</label>
            <input id="data-file" type="file" accept="application/json,.json" />
            <label for="editor-character">キャラ</label>
            <select id="editor-character"></select>
            <div class="editor-actions">
              <button class="button primary" type="button" id="download-json">JSONを書き出す</button>
              <button class="button ghost" type="button" id="copy-command">生成コマンド</button>
            </div>
            <p class="editor-hint" id="editor-status">データを読み込み中です。</p>
          </aside>

          <section class="editor-main" aria-live="polite">
            <div class="editor-title">
              <div>
                <p class="eyebrow">Selected Character</p>
                <h2 id="editor-name">-</h2>
              </div>
              <a id="editor-source" href="#" target="_blank" rel="noreferrer">atwikiを開く</a>
            </div>

            <div class="editor-section" data-section="shooting">
              <div class="editor-section-header">
                <h3>射撃</h3>
                <button type="button" class="mini-button" data-add-row="shooting">行を追加</button>
              </div>
              <div class="editor-table-wrap" id="editor-shooting"></div>
            </div>

            <div class="editor-section" data-section="melee">
              <div class="editor-section-header">
                <h3>格闘</h3>
                <button type="button" class="mini-button" data-add-row="melee">行を追加</button>
              </div>
              <div class="editor-table-wrap" id="editor-melee"></div>
            </div>

            <div class="editor-section" data-section="burst">
              <div class="editor-section-header">
                <h3>バースト</h3>
                <button type="button" class="mini-button" data-add-row="burst">行を追加</button>
              </div>
              <div class="editor-table-wrap" id="editor-burst"></div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>編集したJSONを反映するには、プロジェクトフォルダで <code>node generate-character-pages.js</code> を実行します。</p>
      <a href="#top">上へ戻る</a>
    </footer>
    <script src="editor.js"></script>
    <script src="script.js?v=20260603publicsplit1"></script>
  </body>
</html>
